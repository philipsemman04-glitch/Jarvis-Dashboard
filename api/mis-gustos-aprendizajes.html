<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta http-equiv="Content-Language" content="es">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis Gustos & Aprendizajes — Jarvis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#08090d; --panel:#12141d; --panel-alt:#1a1d29;
    --border:rgba(201,169,97,0.18); --border-soft:rgba(255,255,255,0.09);
    --gold:#d4af6a; --gold-bright:#f0cd8e; --gold-dim:rgba(212,175,106,0.16);
    --text:#f8f6f0; --text-dim:#a8a496; --text-faint:#6f6c62;
    --blue:#4f8fe8; --blue-dim:rgba(79,143,232,0.18);
    --green:#3ecf8e; --green-dim:rgba(62,207,142,0.18);
    --pink:#ec6ba3; --pink-dim:rgba(236,107,163,0.18);
    --purple:#a06bf0; --purple-dim:rgba(160,107,240,0.18);
    --amber:#f2a13d; --amber-dim:rgba(242,161,61,0.18);
    --teal:#2dd4c8; --teal-dim:rgba(45,212,200,0.18);
    --radius:14px; --serif:'Fraunces',serif; --sans:'Inter',sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: radial-gradient(ellipse 1400px 900px at 15% -10%, #181420 0%, transparent 55%),
                radial-gradient(ellipse 1100px 800px at 100% 0%, #101a26 0%, transparent 50%), var(--bg);
    color:var(--text); font-family:var(--sans); min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  a{color:inherit; text-decoration:none;} button{font-family:inherit; cursor:pointer; border:none;}
  ::-webkit-scrollbar{width:8px;} ::-webkit-scrollbar-thumb{background:var(--panel-alt); border-radius:8px;}

  .shell{ display:flex; }
  .main{ flex:1; padding:24px 28px 60px; max-width:1280px; margin:0 auto;}
  .page-head{ display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:10px;}
  .page-head h2{ font-family:var(--serif); font-size:23px; font-weight:600; display:flex; align-items:center; gap:9px;}
  .page-head p{ font-size:12px; color:var(--text-dim); margin-top:4px;}
  .head-actions{ display:flex; align-items:center; gap:10px;}
  .chip{ font-size:11px; color:var(--text-dim); background:var(--panel); border:1px solid var(--border-soft); padding:7px 12px; border-radius:8px; display:flex; align-items:center; gap:6px;}
  .ask-btn{ background:linear-gradient(155deg,var(--gold-bright),var(--gold)); color:#181205; font-weight:600; font-size:12px; padding:9px 16px; border-radius:8px; display:flex; align-items:center; gap:6px;}

  .stat-row{ display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-bottom:16px;}
  .stat-card{ background:var(--panel); border:1px solid var(--border-soft); border-radius:var(--radius); padding:15px 16px; box-shadow: 0 6px 18px rgba(0,0,0,0.24);}
  .stat-card .top{ display:flex; align-items:center; gap:9px; margin-bottom:10px;}
  .stat-icon{ width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:14px; box-shadow: 0 3px 10px -2px currentColor;}
  .stat-card .label{ font-size:10.5px; color:var(--text-dim);}
  .stat-card .value{ font-family:var(--serif); font-size:23px; font-weight:600; line-height:1;}
  .stat-card .sub{ font-size:10px; color:var(--text-faint); margin-top:5px;}

  .layout{ display:grid; grid-template-columns: 1fr 1fr 280px; gap:14px; margin-bottom:14px; align-items:stretch;}
  .layout3{ display:grid; grid-template-columns: repeat(3,1fr); gap:14px; margin-bottom:14px; align-items:stretch;}
  .span2{ grid-column: span 2; }
  .side-col{ display:flex; flex-direction:column; gap:14px; }

  .panel{ background:var(--panel); border:1px solid var(--border-soft); border-radius:var(--radius); padding:18px 20px; display:flex; flex-direction:column; box-shadow: 0 8px 24px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.03);}
  .panel-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .panel-head h3{ font-size:12.5px; font-weight:600; display:flex; align-items:center; gap:7px;}
  .panel-head .link{ font-size:11px; color:var(--gold-bright); cursor:pointer;}
  .panel-footer{ margin-top:auto; padding-top:12px; }

  /* Areas de interés */
  .area-row{ display:flex; align-items:center; gap:10px; margin-bottom:11px;}
  .area-label{ width:100px; font-size:11.5px; color:var(--text-dim); flex-shrink:0;}
  .area-track{ flex:1; height:8px; background:var(--panel-alt); border-radius:4px; overflow:hidden;}
  .area-fill{ height:100%; border-radius:4px; background:linear-gradient(90deg,var(--gold),var(--gold-bright));}
  .area-pct{ width:34px; text-align:right; font-size:11px; color:var(--text-faint); flex-shrink:0;}
  .area-tags{ display:flex; gap:6px; flex-wrap:wrap; margin-top:12px;}
  .tag-chip{ font-size:10px; padding:4px 9px; border-radius:20px; background:var(--panel-alt); color:var(--text-dim); border:1px solid var(--border-soft);}

  /* Donut */
  .donut-wrap{ display:flex; align-items:center; gap:18px;}
  .donut-legend{ display:flex; flex-direction:column; gap:8px; flex:1;}
  .legend-row{ display:flex; align-items:center; gap:8px; font-size:11px; color:var(--text-dim);}
  .legend-dot{ width:8px; height:8px; border-radius:2px; flex-shrink:0;}
  .legend-row b{ color:var(--text); margin-left:auto; font-weight:600;}

  /* Pennyworth mini */
  .pw-mini{ display:flex; flex-direction:column; align-items:center; text-align:center;}
  .pw-avatar{ width:52px; height:52px; border-radius:50%; margin-bottom:10px; background:radial-gradient(circle at 35% 30%,#4a4030,#14120c); border:2px solid var(--gold); display:flex; align-items:center; justify-content:center; font-family:var(--serif); font-size:19px; color:var(--gold-bright);}
  .pw-mini p{ font-size:11.5px; color:var(--text-dim); line-height:1.5; margin-bottom:12px;}
  .pw-input{ width:100%; background:var(--panel-alt); border:1px solid var(--border-soft); border-radius:8px; padding:9px 12px; font-size:11.5px; color:var(--text-faint);}

  /* Captura rápida */
  .capture-btn{ display:flex; align-items:center; gap:9px; width:100%; padding:9px 10px; border-radius:8px; background:var(--panel-alt); border:1px solid var(--border-soft); font-size:11.5px; color:var(--text-dim); margin-bottom:7px; transition:background 0.15s;}
  .capture-btn:hover{ background:var(--gold-dim); color:var(--gold-bright); }
  .capture-btn .ico{ width:20px; height:20px; border-radius:5px; background:var(--gold-dim); color:var(--gold-bright); display:flex; align-items:center; justify-content:center; font-size:11px; flex-shrink:0;}
  .capture-form{ display:none; gap:6px; margin-top:8px; }
  .capture-form.open{ display:flex; }
  .capture-form input{ flex:1; background:var(--panel); border:1px solid var(--border-soft); border-radius:6px; padding:7px 9px; font-size:11px; color:var(--text); }
  .capture-form button{ background:var(--gold); color:#181205; font-size:10.5px; font-weight:700; padding:0 10px; border-radius:6px; }

  /* Stat pills sidebar */
  .stat-pill{ display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border-soft); font-size:11.5px;}
  .stat-pill:last-child{ border-bottom:none;}
  .stat-pill .n{ font-family:var(--serif); font-weight:700; color:var(--gold-bright);}

  /* Content cards */
  .content-item{ display:flex; gap:11px; padding:9px 0; border-bottom:1px solid var(--border-soft);}
  .content-item:last-of-type{ border-bottom:none;}
  .content-swatch{ width:34px; height:44px; border-radius:5px; flex-shrink:0;}
  .content-item p{ font-size:12px; font-weight:500; line-height:1.3;}
  .content-item span{ font-size:10px; color:var(--text-faint); display:block; margin-top:2px;}
  .content-item .view{ margin-left:auto; font-size:10px; color:var(--gold-bright); align-self:center; flex-shrink:0;}

  /* Network graph */
  .network-wrap{ display:flex; justify-content:center; }
  .node-center{ fill:var(--gold-dim); stroke:var(--gold-bright); stroke-width:2;}
  .node-outer{ fill:var(--panel-alt); stroke-width:1.5;}
  .node-label{ font-size:9px; fill:var(--text-dim); font-family:var(--sans); text-anchor:middle; font-weight:500;}
  .node-label-center{ font-size:10px; fill:var(--gold-bright); font-family:var(--serif); font-weight:700; text-anchor:middle;}
  .edge{ stroke:var(--border-soft); stroke-width:1.25;}

  /* Word cloud */
  .cloud{ display:flex; flex-wrap:wrap; gap:9px; align-items:center; justify-content:center; padding:8px 0;}
  .cloud span{ font-family:var(--serif); font-weight:600;}

  /* Goals */
  .goal-row{ margin-bottom:14px;}
  .goal-row:last-child{ margin-bottom:0;}
  .goal-top{ display:flex; justify-content:space-between; font-size:11.5px; margin-bottom:6px;}
  .goal-top span:first-child{ color:var(--text-dim);}
  .goal-top span:last-child{ color:var(--gold-bright); font-weight:600;}
  .goal-track{ height:7px; background:var(--panel-alt); border-radius:4px; overflow:hidden;}
  .goal-fill{ height:100%; background:linear-gradient(90deg,var(--gold),var(--gold-bright)); border-radius:4px;}

  /* Quote */
  .quote-panel{ text-align:center; padding:26px 20px;}
  .quote-mark{ font-family:var(--serif); font-size:34px; color:var(--gold); line-height:1; margin-bottom:6px;}
  .quote-text{ font-family:var(--serif); font-size:15px; font-style:italic; line-height:1.5; margin-bottom:10px;}
  .quote-author{ font-size:11px; color:var(--text-faint); margin-bottom:16px;}
  .save-quote{ background:var(--panel-alt); border:1px solid var(--border-soft); color:var(--text-dim); font-size:11px; padding:8px 16px; border-radius:8px;}
  .save-quote.saved{ background:var(--gold-dim); color:var(--gold-bright); border-color:var(--gold);}

  /* Upcoming */
  .upcoming-item{ display:flex; gap:12px; padding:9px 0; border-bottom:1px solid var(--border-soft); align-items:center;}
  .upcoming-item:last-child{ border-bottom:none;}
  .up-date{ width:44px; text-align:center; background:var(--panel-alt); border-radius:7px; padding:5px 0; font-size:9.5px; color:var(--gold-bright); font-weight:700; flex-shrink:0;}
  .upcoming-item p{ font-size:12px; font-weight:500;}
  .upcoming-item span{ font-size:10px; color:var(--text-faint);}

  @media (max-width:1100px){
    .layout{ grid-template-columns:1fr; } .span2{ grid-column:span 1;}
    .layout3{ grid-template-columns:1fr; }
    .stat-row{ grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>
<body>
<div class="shell">
  <div class="main">
    <div class="page-head">
      <div>
        <h2>💙 Mis Gustos &amp; Aprendizajes</h2>
        <p>Explora lo que te apasiona. Conecta ideas, aprende y construye una vida con propósito.</p>
      </div>
      <div style="display:flex; flex-direction:column; align-items:flex-end; gap:8px;">
        <span id="sync-note" style="font-size:11px; color:var(--text-faint);"></span>
        <div class="head-actions">
          <div class="chip">📅 Hoy, 10 Ago 2026</div>
          <div class="chip">⏷ Filtros</div>
          <div class="chip" onclick="window.location.href='https://jarvis-dashboard-phi-one.vercel.app/'" style="cursor:pointer;" title="Volver al selector de dashboards">🏠 Inicio</div>
          <div class="ask-btn" onclick="window.location.href='https://app.notion.com/p/d9917599cc404cc58b50e9e3401b4bf8'" style="cursor:pointer;">✦ Ask Pennyworth</div>
        </div>
      </div>
    </div>

    <div class="stat-row" id="stat-row"></div>

    <div class="layout">
      <div class="panel" id="areas-panel"></div>
      <div class="panel" id="biblioteca-panel"></div>
      <div class="side-col">
        <div class="panel pw-mini" id="pw-panel"></div>
        <div class="panel" id="captura-panel"></div>
      </div>
    </div>

    <div class="layout" style="grid-template-columns: 1fr 1fr 280px;">
      <div class="panel" id="libros-panel"></div>
      <div class="panel" id="podcasts-panel"></div>
      <div class="panel" id="stats-panel"></div>
    </div>

    <div class="layout3">
      <div class="panel" id="tiempo-panel"></div>
      <div class="panel" id="mapa-panel"></div>
      <div class="panel" id="nube-panel"></div>
    </div>

    <div class="layout3">
      <div class="panel" id="metas-panel"></div>
      <div class="panel quote-panel" id="quote-panel"></div>
      <div class="panel" id="proximo-panel"></div>
    </div>

    <div class="panel" style="margin-top:14px;" id="ideas-panel"></div>
  </div>
</div>

<script>
/* ============================================================
   MOCK DATA — field names mirror what will become the real
   Notion "Learning Library" / "Personal Goals" / "Notes & Ideas"
   schema, so this block is a drop-in replacement target once
   wired to the API proxy. Everything below is fully computed
   and interactive off this object — change a number here and
   every chart/bar/list updates.
   ============================================================ */
const DATA = {
  stats: {
    areasExploradas:7, contenidoGuardado:342, ideasConectadas:28,
    horasAprendiendo:186, creatividadScore:82
  },
  areasInteres: [
    { name:"Psicología", pct:90, tag:"Pasión" },
    { name:"Diseño", pct:78, tag:"Aprendiendo" },
    { name:"Arquitectura", pct:70, tag:"Inspiración" },
    { name:"IA & Tecnología", pct:85, tag:"Constante" },
    { name:"Libros", pct:65, tag:"" },
    { name:"Podcasts", pct:58, tag:"" }
  ],
  biblioteca: [
    { label:"Libros", value:120, color:"var(--purple)" },
    { label:"Artículos", value:103, color:"var(--blue)" },
    { label:"Videos", value:68, color:"var(--green)" },
    { label:"Podcasts", value:51, color:"var(--pink)" }
  ],
  pennyworth: { greeting:"Hola Aurelio, veo que sigues explorando, aprendiendo y creciendo." },
  statsPersonales: [
    { label:"Racha de aprendizaje", value:"27 días" },
    { label:"Notas escritas", value:124 },
    { label:"Ideas conectadas", value:57 },
    { label:"Insights este mes", value:18 }
  ],
  librosRecientes: [
    { title:"Hábitos Atómicos", author:"James Clear", color:"var(--purple)" },
    { title:"Psicología del Dinero", author:"Morgan Housel", color:"var(--blue)" },
    { title:"El Diseño de las Cosas Cotidianas", author:"Don Norman", color:"var(--teal)" }
  ],
  podcastsRecientes: [
    { title:"The Tim Ferriss Show", ep:"Episodio #715" },
    { title:"Durmiendo Podcast", ep:"Rutinas nocturnas" },
    { title:"Lex Fridman Podcast", ep:"IA, ciencia y filosofía" }
  ],
  ideasRecientes: [
    { title:"La disciplina es libertad", date:"6 Ago 2026" },
    { title:"El minimalismo visual mejora la claridad mental", date:"5 Ago 2026" },
    { title:"Tatuajes: historia, símbolo e identidad", date:"4 Ago 2026" }
  ],
  tiempoPorArea: [
    { label:"Psicología", pct:52, color:"var(--purple)" },
    { label:"Arquitectura", pct:30, color:"var(--blue)" },
    { label:"Diseño", pct:18, color:"var(--teal)" }
  ],
  mapaConocimiento: {
    center:"YO",
    nodes:["Disciplina","Creatividad","Mentalidad","Diseño","Psicología","Arquitectura","Hábitos","Identidad"]
  },
  nubeTemas: [
    {word:"creatividad", weight:10}, {word:"disciplina", weight:9}, {word:"mentalidad", weight:8},
    {word:"psicología", weight:8}, {word:"diseño", weight:7}, {word:"arquitectura", weight:6},
    {word:"propósito", weight:6}, {word:"hábitos", weight:5}, {word:"identidad", weight:5},
    {word:"minimalismo", weight:4}, {word:"tatuajes", weight:4}, {word:"claridad", weight:3}
  ],
  metasAprendizaje: [
    { label:"Leer 50 libros este año", current:32, target:50 },
    { label:"Aprender sobre arquitectura emocional", pct:65 },
    { label:"Desarrollar habilidades de diseño digital", pct:40 }
  ],
  citaDelDia: { text:"No es que tengamos poco tiempo, sino que perdemos mucho.", author:"Séneca" },
  proximoAprendizaje: [
    { date:"11 AGO", title:"Escuchar: Entiende Tu Mente #173", tag:"Psicología" },
    { date:"12 AGO", title:"Leer: La espiritualidad en el arte", tag:"Arquitectura" },
    { date:"14 AGO", title:"Charla de diseño con Dieter Rams", tag:"Diseño" }
  ],
  profile: { quote:"La curiosidad es el combustible de una vida extraordinaria." }
};

const vividPalette = ["#f2a13d","#3ecf8e","#a06bf0","#4f8fe8","#ec6ba3","#2dd4c8","#f0cd8e"];
const REFERENCIAS_URL = "https://app.notion.com/p/02b424b2755d4865b99f0576e7125fba";
const DAILY_QUOTES = [
  { text:"No es que tengamos poco tiempo, sino que perdemos mucho.", author:"Séneca" },
  { text:"La disciplina es libertad.", author:"Aristóteles" },
  { text:"La curiosidad es el combustible de una vida extraordinaria.", author:"Anónimo" },
  { text:"Lo que no se mide, no se mejora.", author:"Peter Drucker" },
  { text:"El conocimiento habla, pero la sabiduría escucha.", author:"Jimi Hendrix" },
  { text:"Somos lo que hacemos repetidamente.", author:"Will Durant" },
  { text:"El que pregunta es un tonto por cinco minutos. El que no pregunta lo es toda la vida.", author:"Proverbio chino" },
];

/* ============================================================
   FIX (Aug 15): this used to be a DATA object populated entirely
   with fake numbers (342 saved items, 186h learning, 27-day
   streak, Psychology 52%, books/podcasts never actually added,
   etc.) that stayed visible even when connected to Notion, because
   the merge logic below spread it first and only overrode fields
   the API happened to return. Per Aurelio's explicit instruction —
   real data when available, 0 / "No data yet" otherwise, never
   invented — this is now an honestly EMPTY shape, used only as a
   structural fallback if the API call fails outright (not deployed,
   token missing). It is never blended into a successful response.
   ============================================================ */
const DEMO_DATA = {
  stats: { referenciasGuardadas:0, temasExplorados:0, porConsumir:0, terminado:0 },
  referencias: [], biblioteca: [], temasExplorados: [], nubeTemas: [],
  librosRecientes: [], podcastsRecientes: [], ideasRecientes: [],
  metasAprendizaje: [], rachaAprendizaje: 0,
};

function emptyNote(text){
  return `<div style="font-size:12px; color:var(--text-faint); font-style:italic; padding:14px 0; text-align:center;">${text}</div>`;
}

function renderStats(d){
  const s = d.stats;
  const cards = [
    { icon:"📦", bg:"var(--blue)", label:"Referencias Guardadas", value:s.referenciasGuardadas, sub:"Total" },
    { icon:"🏷️", bg:"var(--purple)", label:"Temas Explorados", value:s.temasExplorados, sub:"Distintos" },
    { icon:"📥", bg:"var(--amber)", label:"Por Consumir", value:s.porConsumir, sub:"En cola" },
    { icon:"✅", bg:"var(--green)", label:"Terminadas", value:s.terminado, sub:"Completas" },
  ];
  document.getElementById("stat-row").innerHTML = cards.map(c=>`
    <div class="stat-card">
      <div class="top"><div class="stat-icon" style="background:${c.bg}; color:${c.bg}">${c.icon}</div><span class="label">${c.label}</span></div>
      <div class="value">${c.value}</div><div class="sub">${c.sub}</div>
    </div>`).join("");
}

function renderAreas(d){
  document.getElementById("areas-panel").innerHTML = `
    <div class="panel-head"><h3>🎯 Temas Explorados</h3></div>
    <div id="area-rows"></div>`;
  const temas = d.temasExplorados;
  if(!temas.length){
    document.getElementById("area-rows").innerHTML = emptyNote("Sin referencias guardadas todavía — los temas aparecen aquí cuando empieces a agregar.");
    return;
  }
  const max = temas[0].count;
  document.getElementById("area-rows").innerHTML = temas.map(t=>`
    <div class="area-row" style="cursor:pointer;" onclick="window.location.href='${REFERENCIAS_URL}'">
      <div class="area-label">${t.name}</div>
      <div class="area-track"><div class="area-fill" style="width:${Math.round(t.count/max*100)}%"></div></div>
      <div class="area-pct">${t.count}</div>
    </div>`).join("");
}

function donutSVG(data, centerLabel, size=140){
  const total = data.reduce((s,x)=>s+x.value,0) || 1;
  const r = size/2 - 14, cx = size/2, cy = size/2, circ = 2*Math.PI*r;
  let offset = 0;
  const segs = data.map(x=>{
    const frac = x.value/total;
    const dash = frac*circ;
    const seg = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${x.color}" stroke-width="16"
      stroke-dasharray="${dash} ${circ-dash}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})" stroke-linecap="butt"/>`;
    offset += dash;
    return seg;
  }).join("");
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--panel-alt)" stroke-width="16"/>
    ${segs}
    <text x="${cx}" y="${cy-2}" text-anchor="middle" font-family="Fraunces" font-size="17" font-weight="700" fill="var(--text)">${centerLabel}</text>
  </svg>`;
}

function renderBiblioteca(d){
  const items = d.biblioteca.map((b,i) => ({ ...b, color: vividPalette[i % vividPalette.length] }));
  const total = items.reduce((s,x)=>s+x.value,0);
  document.getElementById("biblioteca-panel").innerHTML = `
    <div class="panel-head"><h3>📖 Mi Biblioteca Actual</h3></div>
    ${!total ? emptyNote("Sin contenido guardado todavía.") : `
    <div class="donut-wrap">
      ${donutSVG(items, total)}
      <div class="donut-legend">
        ${items.map(b=>`<div class="legend-row"><span class="legend-dot" style="background:${b.color}"></span>${b.label} (${Math.round(b.value/total*100)}%)<b>${b.value}</b></div>`).join("")}
      </div>
    </div>`}

function renderMapa(d){
  const size = 260, cx = size/2, cy = size/2, r = 92, nodeR = 26;
  const nodes = d.temasExplorados.map(t=>t.name);
  if(!nodes.length){
    document.getElementById("mapa-panel").innerHTML = `<div class="panel-head"><h3>🕸️ Mapa de Conocimiento</h3></div>${emptyNote("Aparece cuando empieces a guardar referencias con temas.")}`;
    return;
  }
  const n = nodes.length;
  let edges = "", labels = "";
  nodes.forEach((label, i)=>{
    const angle = (i / n) * 2 * Math.PI - Math.PI/2;
    const x = cx + r * Math.cos(angle), y = cy + r * Math.sin(angle);
    const color = vividPalette[i % vividPalette.length];
    edges += `<line class="edge" x1="${cx}" y1="${cy}" x2="${x}" y2="${y}"/>`;
    labels += `<circle class="node-outer" cx="${x}" cy="${y}" r="${nodeR}" stroke="${color}"/>
      <text class="node-label" x="${x}" y="${y+3}">${label.length>9?label.slice(0,8)+'…':label}</text>`;
  });
  document.getElementById("mapa-panel").innerHTML = `
    <div class="panel-head"><h3>🕸️ Mapa de Conocimiento</h3></div>
    <div class="network-wrap">
      <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
        ${edges}
        ${labels}
        <circle class="node-center" cx="${cx}" cy="${cy}" r="30"/>
        <text class="node-label-center" x="${cx}" y="${cy+4}">YO</text>
      </svg>
    </div>
    <div class="panel-footer" style="text-align:center;"><span class="link" style="cursor:pointer;" onclick="window.location.href='${REFERENCIAS_URL}'">Ver mapa completo →</span></div>`;
}

/* ============================================================
   Live data loading. Tries the Notion-backed API first; only on
   total failure does it fall back to DEMO_DATA (honestly empty,
   clearly labeled) — a successful response is used exactly as
   returned, field by field, with no fake-number blending.
   ============================================================ */
async function loadData(){
  const syncNote = document.getElementById("sync-note");
  try{
    const res = await fetch("/api/gustos-data");
    if(!res.ok) throw new Error("API returned " + res.status);
    const live = await res.json();
    if(live.error) throw new Error(live.error);
    renderAll(live);
    if(syncNote){
      syncNote.textContent = "Synced with Notion · " + new Date(live.fetchedAt).toLocaleTimeString();
    }
  }catch(err){
    console.warn("Live Notion data unavailable, showing empty state:", err.message);
    renderAll(DEMO_DATA);
    if(syncNote) syncNote.textContent = "Sin conexión a Notion — revisa NOTION_TOKEN en Vercel.";
  }
}

/* Make quick-capture actually save to Notion instead of only updating the page in-memory */
const CAPTURE_TYPE_MAP = ["book","podcast","idea","note","reference"];
async function submitCapture(i, label){
  const input = document.getElementById("cap-input-"+i);
  if(!input.value.trim()) return;
  const text = input.value.trim();
  const type = CAPTURE_TYPE_MAP[i] || "note";

  // Optimistic UI update, same as before
  DATA.ideasRecientes.unshift({ title: text, date: "Hoy" });
  renderIdeas(DATA);
  DATA.statsPersonales[1].value = (parseInt(DATA.statsPersonales[1].value)||0) + 1;
  renderStatsPersonales(DATA);
  input.value = "";
  document.getElementById("cap-form-"+i).classList.remove("open");

  try{
    const res = await fetch("/api/capture", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ type, text })
    });
    const result = await res.json();
    if(!res.ok) throw new Error(result.error || "Save failed");
  }catch(e){
    console.warn("Couldn't save to Notion (showing locally only):", e.message);
  }
}

loadData();
