<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meetings — Jarvis</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#08090d;--panel:#11151d;--panel2:#171c27;--line:rgba(255,255,255,.1);--text:#f8f6f0;--muted:#a8a496;--faint:#6f6c62;--gold:#d4af6a;--blue:#3d8cf0;--green:#3ecf8e;--red:#e8615f;--serif:Fraunces,serif;--sans:Inter,sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse 1200px 700px at 65% -15%,#142130,transparent 60%),var(--bg);color:var(--text);font-family:var(--sans)}button,input,textarea,select{font:inherit}button{cursor:pointer}.main{max-width:1180px;margin:auto;padding:22px 28px 60px}.workspace-banner{height:178px;margin-bottom:20px;border:1px solid rgba(255,255,255,.12);border-radius:16px;overflow:hidden;background-position:center;background-size:cover;box-shadow:0 18px 45px rgba(0,0,0,.35);position:relative}.workspace-banner:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,7,12,.9),rgba(5,7,12,.42) 55%,rgba(5,7,12,.15)),linear-gradient(0deg,rgba(5,7,12,.35),transparent 65%)}.workspace-banner-content{height:100%;display:flex;align-items:flex-end;padding:22px 26px;position:relative;z-index:1}.workspace-banner-kicker{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#f0cf8d;font-weight:800}.topline{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--muted);margin-bottom:14px}.topline b{color:var(--text)}.head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.titleline{display:flex;gap:14px;align-items:center}.calendar-mark{width:48px;height:48px;border:1px solid var(--line);border-radius:12px;display:grid;place-items:center;background:var(--panel2);font-size:24px}.head h1{font:600 30px var(--serif);margin:0}.meta{font-size:12px;color:var(--muted);margin-top:7px}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:9px 13px;border-radius:8px;font-weight:600;font-size:11px}.btn.primary{background:linear-gradient(140deg,#efd18f,#c7a45c);color:#171108;border:0}.btn.danger{color:#ffb1ab;background:rgba(232,97,95,.13)}.status{margin-left:auto;margin-top:18px;display:flex;align-items:center;gap:9px;font-size:12px}.status select{background:var(--panel2);color:var(--text);border:1px solid var(--line);padding:9px 12px;border-radius:8px}.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin-top:22px}.tab{background:none;border:0;color:var(--muted);padding:12px 2px;font-size:12px;border-bottom:2px solid transparent}.tab.active{color:var(--gold);border-bottom-color:var(--gold)}.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(290px,.75fr);gap:16px;margin-top:14px}.stack{display:grid;gap:16px}.card{background:rgba(17,21,29,.88);border:1px solid var(--line);border-radius:12px;padding:16px}.card h2{font-size:14px;margin:0 0 13px}.card h3{font-size:12px;margin:0 0 8px}.summary{color:var(--muted);font-size:12px;line-height:1.6}.summary-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.stat{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:12px}.stat strong{display:block;font:600 22px var(--serif);margin-top:6px}.stat span{font-size:10px;color:var(--muted)}.topics{display:grid;gap:10px}.topic{display:grid;grid-template-columns:26px 1fr 85px;align-items:center;gap:8px;font-size:11px}.num{width:25px;height:25px;border-radius:7px;background:#1854a4;display:grid;place-items:center;font-weight:700}.bar{height:7px;background:#243041;border-radius:5px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:var(--gold);border-radius:5px}.ring{width:130px;height:130px;border-radius:50%;margin:6px auto 12px;background:conic-gradient(var(--blue) 0 62%,var(--gold) 62% 100%);display:grid;place-items:center}.ring:after{content:'52 min';white-space:pre;text-align:center;display:grid;place-items:center;width:92px;height:92px;border-radius:50%;background:var(--panel);font:600 17px var(--serif)}.person{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);padding:5px 0}.transcript{display:grid;gap:8px}.line{display:grid;grid-template-columns:42px 25px 1fr;gap:8px;align-items:start;font-size:11px;color:var(--muted)}.time{color:var(--faint)}.speaker{width:22px;height:22px;border-radius:50%;background:var(--blue);display:grid;place-items:center;color:white;font-size:10px}.actions-list,.files{display:grid;gap:8px}.action,.file{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06)}.action input{accent-color:var(--green)}.file b{color:var(--text);font-weight:500}.editor{width:100%;min-height:110px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:12px;resize:vertical}.rating{display:flex;gap:6px;font-size:24px;color:var(--faint);cursor:pointer}.rating .on{color:var(--gold)}.footer-nav{display:flex;justify-content:space-between;align-items:center;margin-top:18px}.empty{padding:70px 20px;text-align:center;color:var(--muted)}.list{display:grid;gap:10px}.meeting-row{padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;cursor:pointer}.meeting-row:hover{border-color:rgba(212,175,106,.55)}.hidden{display:none!important}@media(max-width:850px){.main{padding:18px 14px}.workspace-banner{height:150px}.grid{grid-template-columns:1fr}.head{display:block}.actions{justify-content:flex-start;margin-top:14px}.stats{grid-template-columns:repeat(2,1fr)}.tabs{overflow:auto;gap:16px}.topic{grid-template-columns:26px 1fr 60px}}

.meetings-shell{max-width:1280px;margin:auto;padding:20px 26px 60px}.meeting-hero{height:150px;border:1px solid rgba(212,175,106,.45);border-radius:14px;background:url('/assets/covers/meetings-cover-v2.jpg') center/cover;position:relative;overflow:hidden;margin-bottom:18px}.meeting-hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(3,10,20,.86),rgba(3,10,20,.32) 65%,rgba(3,10,20,.1))}.meeting-hero-copy{position:absolute;z-index:1;left:30px;bottom:24px;letter-spacing:.2em;text-transform:uppercase;color:#f1d390;font-size:11px;font-weight:800}.meeting-hero .btn{position:absolute;z-index:2;right:18px;top:18px}.meetings-title{display:flex;justify-content:space-between;gap:16px;align-items:flex-end}.meetings-title h1{font:600 38px var(--serif);margin:0}.meetings-title p{margin:5px 0 0;color:var(--muted);font-size:13px}.meeting-filters{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:20px 0 12px;border:1px solid var(--line);border-radius:10px;background:rgba(13,22,35,.85);padding:8px}.filter-tabs{display:flex;gap:3px;flex-wrap:wrap}.filter-tab{border:0;background:transparent;color:var(--muted);padding:8px 12px;border-radius:7px;font-size:11px}.filter-tab.active{background:#183b65;color:#fff}.view-toggle{display:flex;gap:5px}.view-toggle .active{border-color:var(--gold);color:var(--gold2)}.meeting-dashboard{display:grid;grid-template-columns:250px minmax(0,1fr) 260px;gap:14px}.meeting-panel{background:rgba(13,22,35,.9);border:1px solid var(--line);border-radius:12px;padding:14px}.meeting-panel h2{font-size:13px;margin:0 0 13px}.calendar-mini{border-top:1px solid var(--line);padding-top:12px}.calendar-head{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:12px}.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:10px}.calendar-grid span{padding:5px 0;color:var(--muted)}.calendar-grid .today{background:var(--gold);color:#1b1408;border-radius:50%;font-weight:800}.today-list{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}.today-item{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:10px}.today-dot{width:3px;background:var(--blue);border-radius:2px}.meeting-list-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.meeting-list-head h2{margin:0}.meeting-list-head select{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:7px;border-radius:7px;font-size:10px}.meeting-item{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px 10px;border:1px solid var(--line);border-radius:9px;background:#0e1928;margin-bottom:7px;cursor:pointer}.meeting-item:hover{border-color:rgba(212,175,106,.6)}.meeting-date{font-size:10px;color:var(--muted);text-align:center}.meeting-date strong{display:block;color:var(--gold2);font-size:18px;font-family:var(--serif)}.meeting-item h3{font-size:12px;margin:0 0 5px}.meeting-item p{font-size:10px;color:var(--muted);margin:0}.status-pill{font-size:9px;padding:5px 8px;border-radius:12px;background:#123a67;color:#79bdff;white-space:nowrap}.status-pill.done{background:#143d31;color:#72e0ae}.status-pill.pending{background:#4a3817;color:#f6ca68}.insight-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.insight{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:11px}.insight strong{display:block;font:600 21px var(--serif);color:var(--gold2)}.insight span{font-size:10px;color:var(--muted)}.side-list{margin-top:16px}.side-list h2{display:flex;justify-content:space-between}.side-list h2 span{color:var(--gold2);font-size:10px}.side-meeting{padding:9px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:11px}.side-meeting small{display:block;color:var(--muted);margin-top:4px;font-size:10px}@media(max-width:1000px){.meeting-dashboard{grid-template-columns:220px minmax(0,1fr)}.meeting-dashboard>.meeting-panel:last-child{grid-column:1/-1}.insight-grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:700px){.meetings-shell{padding:14px}.meetings-title{display:block}.meetings-title .actions{margin-top:12px;justify-content:flex-start}.meeting-dashboard{grid-template-columns:1fr}.meeting-filters{display:block}.view-toggle{margin-top:8px}.insight-grid{grid-template-columns:1fr 1fr}.meeting-item{grid-template-columns:48px minmax(0,1fr)}}
</style></head><body><div class="main" id="app"></div><script>
const STATUS=["Scheduled","Completed","Cancelled"], LABEL={Scheduled:"Programada",Completed:"Completada",Cancelled:"Cancelada"};let meetings=[],current=null,tab="Resumen",meetingsCover="/assets/covers/meetings-cover-v2.jpg";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){window.jarvisToast?.success(null,msg)}
function dateLabel(v){if(!v)return"Sin fecha";try{return new Date(v).toLocaleString('es',{weekday:'long',day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'})}catch{return v}}
function banner(){return `<section class=\"workspace-banner\" style=\"background-image:url('${esc(meetingsCover)}')\"><div class=\"workspace-banner-content\"><div class=\"workspace-banner-kicker\">Jarvis · Meetings</div></div></section>`}
function render(){const a=document.getElementById('app');if(!current){const counts={all:meetings.length,scheduled:meetings.filter(m=>m.status==='Scheduled').length,completed:meetings.filter(m=>m.status==='Completed').length,pending:meetings.filter(m=>m.status==='Pending Notes').length,cancelled:meetings.filter(m=>m.status==='Cancelled').length};const filtered=window.meetingFilter==='completed'?meetings.filter(m=>m.status==='Completed'):window.meetingFilter==='scheduled'?meetings.filter(m=>m.status==='Scheduled'):window.meetingFilter==='cancelled'?meetings.filter(m=>m.status==='Cancelled'):meetings;const upcoming=meetings.filter(m=>m.status==='Scheduled').slice(0,3);a.innerHTML=`<main class="meetings-shell"><section class="meeting-hero"><button class="btn" onclick="location.href='/sistemas-ajustes.html'">✎ Editar portada</button><div class="meeting-hero-copy">Better conversations · A brighter tomorrow</div></section><div class="meetings-title"><div><h1>Meetings</h1><p>Reuniones agendadas, notas, resultados y seguimientos en un solo lugar.</p></div><div class="actions"><button class="btn" onclick="location.href='/'">⌂ Inicio</button><button class="btn primary" onclick="newMeeting()">＋ Nueva reunión</button></div></div><div class="meeting-filters"><div class="filter-tabs"><button class="filter-tab ${!window.meetingFilter?'active':''}" onclick="window.meetingFilter='';render()">Todas <b>${counts.all}</b></button><button class="filter-tab ${window.meetingFilter==='scheduled'?'active':''}" onclick="window.meetingFilter='scheduled';render()">Programadas <b>${counts.scheduled}</b></button><button class="filter-tab ${window.meetingFilter==='completed'?'active':''}" onclick="window.meetingFilter='completed';render()">Completadas <b>${counts.completed}</b></button><button class="filter-tab ${window.meetingFilter==='cancelled'?'active':''}" onclick="window.meetingFilter='cancelled';render()">Canceladas <b>${counts.cancelled}</b></button></div><div class="view-toggle"><button class="btn active">☷ Lista</button><button class="btn" onclick="location.href='/general-calendar.html'">▦ Calendario</button></div></div><div class="meeting-dashboard"><section class="meeting-panel"><h2>${new Date().toLocaleString('es',{month:'long',year:'numeric'})}</h2><div class="calendar-mini"><div class="calendar-head"><span>‹</span><b>Hoy</b><span>›</span></div><div class="calendar-grid">${['L','M','X','J','V','S','D'].map(x=>`<span>${x}</span>`).join('')}${Array.from({length:14},(_,i)=>`<span class="${i===new Date().getDate()%14?'today':''}">${i+1}</span>`).join('')}</div></div><div class="today-list"><h2>Próximos hoy</h2>${upcoming.slice(0,3).map(m=>`<div class="today-item"><i class="today-dot"></i><div><b>${esc(m.name||'Sin título')}</b><br><span>${esc(dateLabel(m.date).split(',').pop()||'Sin hora')}</span></div></div>`).join('')||'<div class="empty" style="padding:18px 0">No hay próximas reuniones.</div>'}</div><button class="btn" style="width:100%;margin-top:12px" onclick="location.href='/general-calendar.html'">Ver calendario completo →</button></section><section class="meeting-panel"><div class="meeting-list-head"><h2>Meetings <span class="meta">${filtered.length} reuniones</span></h2><select onchange="window.meetingSort=this.value;render()"><option value="date">Ordenar por fecha</option><option value="name">Ordenar por nombre</option></select></div>${filtered.length?filtered.map(m=>{const d=m.date?new Date(m.date):null;const st=m.status==='Completed'?'done':m.status==='Pending Notes'?'pending':'';return `<article class="meeting-item" onclick="openMeeting('${m.id}')"><div class="meeting-date"><strong>${d?d.getDate():'—'}</strong>${d?d.toLocaleString('es',{month:'short'}).toUpperCase():''}</div><div><h3>${esc(m.name||'Sin título')}</h3><p>${esc(m.platform||'Reunión')} · ${esc(m.duration||'Hora no definida')} · ${m.notes?'Notas disponibles':'Sin notas aún'}</p></div><span class="status-pill ${st}">${esc(LABEL[m.status]||m.status||'Programada')}</span></article>`}).join(''):'<div class="empty">No hay reuniones para este filtro.</div>'}</section><aside class="meeting-panel"><h2>Meeting insights</h2><div class="insight-grid"><div class="insight"><strong>${counts.all}</strong><span>Total reuniones</span></div><div class="insight"><strong>${counts.scheduled}</strong><span>Próximas</span></div><div class="insight"><strong>${counts.completed}</strong><span>Completadas</span></div><div class="insight"><strong>${counts.pending}</strong><span>Notas pendientes</span></div></div><div class="side-list"><h2>Upcoming meetings <span>Ver todas →</span></h2>${upcoming.map(m=>`<div class="side-meeting" onclick="openMeeting('${m.id}')"><b>${esc(m.name||'Sin título')}</b><small>${esc(dateLabel(m.date))}</small></div>`).join('')||'<div class="empty" style="padding:18px 0">Sin próximas reuniones.</div>'}</div><div class="side-list"><h2>Recent follow-ups <span>Ver todos →</span></h2><div class="side-meeting">○ Añade notas y decisiones a una reunión.<small>Se sincronizan con Notion.</small></div></div></aside></div></main>`;return}a.innerHTML=banner()+`<div class="topline"><button class="btn" onclick="backToList()">‹ Meetings</button><span>›</span><b>${esc(current.name||'Sin título')}</b></div><div class="head"><div class="titleline"><div class="calendar-mark">▣</div><div><h1>${esc(current.name||'Sin título')}</h1><div class="meta">${esc(dateLabel(current.date))}${current.platform?' · '+esc(current.platform):''}${current.recurrence?' · '+esc(current.recurrence):''}</div></div></div><div class="actions"><button class="btn" onclick="editMeeting()">Editar</button><button class="btn" onclick="duplicateMeeting()">Duplicar</button><button class="btn danger" onclick="archiveMeeting()">Eliminar</button><button class="btn" onclick="backToList()">…</button></div></div><div class="status"><b>Estado</b><select id="head-status" onchange="quickStatus(this.value)">${STATUS.map(s=>`<option value="${s}" ${s===current.status?'selected':''}>${LABEL[s]}</option>`).join('')}</select></div><div class="tabs">${['Resumen','Notas','Transcripción','Tareas','Archivos','Historial'].map(t=>`<button class="tab ${tab===t?'active':''}" onclick="tab='${t}';render()">${t}</button>`).join('')}</div><div class="grid">${tab==='Resumen'?summaryView():tab==='Notas'?notesView():tab==='Transcripción'?transcriptView():tab==='Tareas'?tasksView():tab==='Archivos'?filesView():historyView()}</div><div class="footer-nav"><button class="btn" onclick="move(-1)">← Reunión anterior</button><span class="meta">${meetings.indexOf(current)+1} de ${meetings.length}</span><button class="btn" onclick="move(1)">Siguiente reunión →</button></div>`}
function summaryView(){return `<div class="stack"><section class="card"><div class="summary-head"><h2>Resumen de la reunión</h2><button class="btn primary" onclick="generateSummary()">✦ Generar resumen</button></div><p class="summary">${esc(current.summary||'Todavía no hay un resumen guardado. Añade un resumen manual o conecta una transcripción para generar uno.')}</p><div class="meta" style="margin-top:10px">Última actualización: ${current.summary?'Guardado en Notion':'Sin actualizar'}</div><div class="stats"><div class="stat"><span>Duración</span><strong>${esc(current.duration||'—')}</strong></div><div class="stat"><span>Tu participación</span><strong>—</strong></div><div class="stat"><span>Participación total</span><strong>—</strong></div><div class="stat"><span>Acciones detectadas</span><strong>—</strong></div></div></section><section class="card"><h2>Temas principales</h2>${current.topics?`<p class="summary">${esc(current.topics)}</p>`:'<div class="empty">Los temas aparecerán aquí cuando exista una transcripción o se añadan manualmente.</div>'}</section><section class="card"><h2>Notas personales</h2><textarea class="editor" id="notes-summary">${esc(current.notes||'')}</textarea><button class="btn primary" style="margin-top:10px" onclick="saveNotes('notes-summary')">Guardar notas</button></section></div><div class="stack"><section class="card"><h2>Participación en la conversación</h2><div class="ring"></div><div class="person"><span>Participante</span><b>Datos no disponibles</b></div><div class="person"><span>Conecta Tactiq para ver métricas</span></div></section><section class="card"><h2>Transcripción</h2>${transcriptPreview()}<button class="btn" style="margin-top:10px" onclick="tab='Transcripción';render()">Ver completa →</button></section><section class="card"><h2>Acciones detectadas</h2><div class="actions-list"><div class="action">☐ Aún no hay acciones sincronizadas</div></div></section></div>`}
function transcriptPreview(){return current.transcript?`<p class="summary">${esc(current.transcript).slice(0,420)}${current.transcript.length>420?'…':''}</p>`:'<div class="empty" style="padding:20px 0">Sin transcripción disponible.</div>'}
function notesView(){return `<div class="stack"><section class="card"><h2>Notas personales</h2><textarea class="editor" id="notes-tab" style="min-height:300px">${esc(current.notes||'')}</textarea><button class="btn primary" style="margin-top:10px" onclick="saveNotes('notes-tab')">Guardar notas</button></section><section class="card"><h2>Evaluación de la reunión</h2><div class="rating" id="rating">${[1,2,3,4,5].map(n=>`<span class="${n<=(current.rating||0)?'on':''}" onclick="setRating(${n})">★</span>`).join('')}</div><textarea class="editor" id="evaluation" placeholder="¿Qué salió bien? ¿Qué se puede mejorar?" style="margin-top:12px">${esc(current.evaluation||'')}</textarea><button class="btn primary" style="margin-top:10px" onclick="saveEvaluation()">Guardar evaluación</button></section></div><div class="stack"><section class="card"><h2>Decisiones tomadas</h2><textarea class="editor" id="decisions">${esc(current.decisions||'')}</textarea><button class="btn primary" style="margin-top:10px" onclick="saveDecisions()">Guardar decisiones</button></section></div>`}
function transcriptView(){return `<div class="stack"><section class="card"><h2>Transcripción</h2><textarea class="editor" id="transcript" style="min-height:360px" placeholder="Pega o escribe aquí la transcripción…">${esc(current.transcript||'')}</textarea><button class="btn primary" style="margin-top:10px" onclick="saveTranscript()">Guardar transcripción</button></section></div><div class="stack"><section class="card"><h2>Estado de integración</h2><p class="summary">Tactiq: no conectado. La transcripción puede añadirse manualmente mientras se configura la integración.</p></section></div>`}
function tasksView(){return `<div class="stack"><section class="card"><h2>Acciones detectadas</h2><div class="actions-list"><div class="action">☐ No hay tareas vinculadas a esta reunión todavía.</div></div></section></div><div class="stack"><section class="card"><h2>Próximo paso</h2><p class="summary">Las tareas extraídas desde una transcripción aparecerán aquí y podrán sincronizarse con Notion.</p></section></div>`}
function filesView(){return `<div class="stack"><section class="card"><div class="summary-head"><h2>Archivos</h2><input type="file" id="meeting-file" onchange="uploadFile()"></div><div class="files">${(current.attachments||[]).map(f=>`<div class="file">▣ <b>${esc(f.name||'Archivo')}</b><span class="meta">${esc(f.type||'')}</span></div>`).join('')||'<div class="empty" style="padding:20px 0">No hay archivos adjuntos.</div>'}</div></section></div><div class="stack"><section class="card"><h2>Integraciones</h2><p class="summary">Notion: conectado<br>Google Drive: no configurado<br>Google Calendar: no configurado</p></section></div>`}
function historyView(){return `<div class="stack"><section class="card"><h2>Historial</h2><div class="empty">El historial detallado estará disponible cuando se conecte el registro de cambios de Notion.</div></section></div>`}
async function api(body){const r=await fetch('/api/task-api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok||d.error||d.ok===false)throw Error(d.error||'Error de servidor');return d}
async function load(){try{const wr=await fetch('/api/workspaces-data');if(wr.ok){const wd=await wr.json();const ws=(wd.workspaces||[]).find(w=>w.name==='Meetings'||w.displayName==='Meetings');if(ws?.coverUrl)meetingsCover=ws.coverUrl}const r=await fetch('/api/task-api?action=meetings');const raw=await r.text();let d={};try{d=JSON.parse(raw)}catch{}if(!r.ok)throw Error(r.status===404?'La conexión de datos no está desplegada todavía. Verifica que la carpeta /api esté en la raíz de Vercel.':(d.error||`Error ${r.status}`));if(d.error)throw Error(d.error);meetings=d.meetings||[];const id=new URLSearchParams(location.search).get('id');if(id)current=meetings.find(m=>m.id===id)||null;render()}catch(e){meetings=[];document.getElementById('app').innerHTML=`<section class="topline"><b>Meetings</b><span>›</span><span>Lista de reuniones</span></section><div class="head"><div><h1>Meetings</h1><div class="meta">Reuniones, notas y compromisos conectados con Notion.</div></div><div class="actions"><button class="btn" onclick="location.href='/'">Inicio</button><button class="btn primary" onclick="load()">Reintentar</button></div></div><div class="card" style="margin-top:18px"><div class="empty"><b>No se pudo cargar Meetings</b><br><span class="meta">${esc(e.message)}</span></div></div>`}}
function openMeeting(id){current=meetings.find(m=>m.id===id);tab='Resumen';history.replaceState({},'',`?id=${encodeURIComponent(id)}`);render()}function backToList(){current=null;history.replaceState({},'',location.pathname);render()}function move(n){const i=meetings.indexOf(current),next=meetings[i+n];if(next)openMeeting(next.id)}
async function quickStatus(status){try{await api({action:'update-meeting',pageId:current.id,status});current.status=status;toast('Estado actualizado')}catch(e){alert(e.message)}}
async function saveNotes(id){try{await api({action:'update-meeting',pageId:current.id,notes:document.getElementById(id).value});current.notes=document.getElementById(id).value;toast('Notas guardadas')}catch(e){alert(e.message)}}
async function saveDecisions(){try{await api({action:'update-meeting',pageId:current.id,decisions:document.getElementById('decisions').value});current.decisions=document.getElementById('decisions').value;toast('Decisiones guardadas')}catch(e){alert(e.message)}}
async function saveTranscript(){try{await api({action:'update-meeting',pageId:current.id,transcript:document.getElementById('transcript').value});current.transcript=document.getElementById('transcript').value;toast('Transcripción guardada')}catch(e){alert(e.message)}}
async function setRating(n){current.rating=n;render();try{await api({action:'update-meeting',pageId:current.id,rating:n})}catch(e){alert(e.message)}}
async function saveEvaluation(){try{await api({action:'update-meeting',pageId:current.id,evaluation:document.getElementById('evaluation').value,rating:current.rating||0});current.evaluation=document.getElementById('evaluation').value;toast('Evaluación guardada')}catch(e){alert(e.message)}}
function editMeeting(){const name=prompt('Nombre de la reunión:',current.name||'');if(name===null)return;const date=prompt('Fecha y hora ISO (opcional):',current.date||'');api({action:'update-meeting',pageId:current.id,name,date}).then(()=>{current.name=name;current.date=date;render();toast('Reunión actualizada')}).catch(e=>alert(e.message))}
function newMeeting(){const name=prompt('Nombre de la nueva reunión:');if(!name)return;api({action:'create-meeting',name}).then(load).catch(e=>alert(e.message))}
function duplicateMeeting(){api({action:'duplicate-meeting',pageId:current.id}).then(load).then(()=>toast('Reunión duplicada')).catch(e=>alert(e.message))}
function archiveMeeting(){if(!confirm('¿Eliminar esta reunión?'))return;api({action:'archive-meeting',pageId:current.id}).then(backToList).then(()=>toast('Reunión eliminada')).catch(e=>alert(e.message))}
async function generateSummary(){const text=prompt('Escribe o pega un resumen para guardarlo:');if(text===null)return;try{await api({action:'update-meeting',pageId:current.id,summary:text});current.summary=text;render();toast('Resumen guardado')}catch(e){alert(e.message)}}
async function uploadFile(){const f=document.getElementById('meeting-file').files?.[0];if(!f)return;if(f.size>3*1024*1024){alert('El archivo debe pesar menos de 3MB.');return}const r=new FileReader();r.onload=async()=>{try{await api({action:'upload',pageId:current.id,filename:f.name,contentType:f.type,dataBase64:String(r.result).split(',')[1]});toast('Archivo adjuntado');await load();current=meetings.find(m=>m.id===current?.id)||current;render()}catch(e){alert(e.message)}};r.readAsDataURL(f)}
load();</script><script src="/toast.js"></script><script src="/sidebar.js"></script></body></html>
