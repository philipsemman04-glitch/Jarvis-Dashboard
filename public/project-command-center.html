<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Command Center — Jarvis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#08090d; --panel:#12141d; --panel-alt:#1a1d29;
    --border:rgba(201,169,97,0.18); --border-soft:rgba(255,255,255,0.09);
    --gold:#d4af6a; --gold-bright:#f0cd8e; --gold-dim:rgba(212,175,106,0.16);
    --text:#f8f6f0; --text-dim:#a8a496; --text-faint:#6f6c62;
    --blue:#4f8fe8; --blue-dim:rgba(79,143,232,0.18);
    --green:#3ecf8e; --green-dim:rgba(62,207,142,0.18);
    --red:#e8615f; --red-dim:rgba(232,97,95,0.18);
    --amber:#f2a13d; --amber-dim:rgba(242,161,61,0.18);
    --radius:14px; --serif:'Fraunces',serif; --sans:'Inter',sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: radial-gradient(ellipse 1400px 900px at 15% -10%, #181420 0%, transparent 55%),
                radial-gradient(ellipse 1100px 800px at 100% 0%, #101a26 0%, transparent 50%), var(--bg);
    color:var(--text); font-family:var(--sans); min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  a{color:inherit; text-decoration:none;} button,select{font-family:inherit; cursor:pointer;}
  ::-webkit-scrollbar{height:8px; width:8px;} ::-webkit-scrollbar-thumb{background:var(--panel-alt); border-radius:8px;}

  .main{ padding:22px 26px 60px; max-width:1400px; margin:0 auto;}
  .page-head{ display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:18px; flex-wrap:wrap; gap:10px;}
  .page-head h2{ font-family:var(--serif); font-size:22px; font-weight:600;}
  .page-head p{ font-size:12px; color:var(--text-dim); margin-top:3px;}
  .head-actions{ display:flex; align-items:center; gap:8px;}
  .head-btn{ background:var(--panel); border:1px solid var(--border-soft); color:var(--text); font-weight:600; font-size:12px;
    padding:9px 14px; border-radius:8px; display:flex; align-items:center; gap:6px;}
  .head-btn:hover{ border-color:var(--gold); }
  .head-btn.primary{ background:linear-gradient(155deg,var(--gold-bright),var(--gold)); color:#181205; border:none;}

  .stat-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:18px;}
  .stat-card{ background:var(--panel); border:1px solid var(--border-soft); border-radius:var(--radius); padding:15px 16px;}
  .stat-card .top{ display:flex; align-items:center; gap:9px; margin-bottom:9px;}
  .stat-icon{ width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:14px;}
  .stat-card .label{ font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.03em;}
  .stat-card .value{ font-family:var(--serif); font-size:22px; font-weight:600;}
  .stat-card .sub{ font-size:10px; color:var(--text-faint); margin-top:3px;}

  .layout{ display:grid; grid-template-columns:1fr 300px; gap:16px; align-items:start;}
  .board-panel{ background:var(--panel); border:1px solid var(--border-soft); border-radius:var(--radius); padding:18px 20px;}
  .board-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:8px;}
  .board-head h3{ font-size:13px; font-weight:600;}
  .board-head-actions{ display:flex; align-items:center; gap:10px; }
  .add-area-btn{ font-size:11px; font-weight:600; color:var(--gold-bright); cursor:pointer; }
  .area-scroll-btn{ width:24px; height:24px; border-radius:6px; background:var(--panel-alt); border:1px solid var(--border-soft);
    display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:14px; color:var(--text-dim); }
  .area-scroll-btn:hover{ border-color:var(--gold); color:var(--text); }
  .board-hint{ font-size:10.5px; color:var(--text-faint);}

  .area-nav{ display:flex; gap:6px; overflow-x:auto; padding-bottom:10px; margin-bottom:10px; border-bottom:1px solid var(--border-soft); scroll-behavior:smooth;}
  .area-nav-item{ flex-shrink:0; font-size:11px; font-weight:600; color:var(--text-dim); background:var(--panel-alt);
    border:1px solid var(--border-soft); border-radius:20px; padding:6px 13px; cursor:pointer; white-space:nowrap; }
  .area-nav-item:hover{ border-color:var(--gold); color:var(--text); }
  .area-nav-item.active{ background:var(--gold-dim); border-color:var(--gold); color:var(--gold-bright); }

  .filter-bar{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; align-items:center; }
  .filter-bar select{ background:var(--panel-alt); border:1px solid var(--border-soft); color:var(--text-dim);
    font-size:11.5px; padding:7px 9px; border-radius:7px; }
  .filter-bar select.active-filter{ border-color:var(--gold); color:var(--gold-bright); }
  .filter-clear{ font-size:11px; color:var(--text-faint); cursor:pointer; padding:7px 4px; }
  .filter-clear:hover{ color:var(--red); }
  .filter-count{ font-size:10.5px; color:var(--text-faint); margin-left:auto; }

  .board-cols{ display:flex; gap:12px; overflow-x:auto; padding-bottom:8px; scroll-behavior:smooth; }
  .board-col{ background:var(--panel-alt); border-radius:12px; padding:12px; min-width:230px; flex-shrink:0;}
  .board-col.dragover{ outline:2px dashed var(--gold); outline-offset:-2px;}
  .board-col-head{ font-size:11.5px; font-weight:700; color:var(--text-dim); margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; gap:6px;}
  .board-col-head .name{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .area-actions{ display:flex; gap:5px; flex-shrink:0; }
  .area-actions span{ cursor:pointer; opacity:0.6; font-size:10.5px; }
  .area-actions span:hover{ opacity:1; }
  .board-card{ background:var(--panel); border:1px solid var(--border-soft); border-radius:9px; padding:10px 11px; margin-bottom:8px; cursor:grab; font-size:12px;}
  .board-card:active{ cursor:grabbing;}
  .board-card .prio-row{ display:flex; align-items:center; gap:6px; margin-bottom:5px;}
  .prio-dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0;}
  .prio-dot.P0{ background:var(--red);} .prio-dot.P1{ background:var(--amber);}
  .prio-dot.P2{ background:#e8c34f;} .prio-dot.P3{ background:var(--green);}
  .board-card .name{ font-weight:500; margin-bottom:6px; line-height:1.3;}
  .board-card .meta{ display:flex; justify-content:space-between; align-items:center; font-size:10px; color:var(--text-faint);}
  .status-pill{ font-size:9px; padding:2px 7px; border-radius:5px; background:var(--panel-alt); color:var(--text-dim);}
  .status-pill.en-progreso{ background:var(--blue-dim); color:var(--blue);}
  .status-pill.bloqueado{ background:var(--red-dim); color:var(--red);}
  .board-empty{ font-size:11px; color:var(--text-faint); font-style:italic; padding:10px 0; text-align:center;}

  .panel{ background:var(--panel); border:1px solid var(--border-soft); border-radius:var(--radius); padding:16px 18px; margin-bottom:14px;}
  .panel p{ font-size:11.5px; color:var(--text-dim); line-height:1.5; margin-bottom:10px;}
  .panel h3{ font-size:12.5px; font-weight:600; margin-bottom:10px;}
  .crit-item{ display:flex; gap:8px; padding:7px 0; border-bottom:1px solid var(--border-soft); font-size:11.5px; cursor:pointer;}
  .crit-item:last-child{ border-bottom:none;}
  .crit-item .n{ color:var(--red); font-weight:700; flex-shrink:0;}

  .card-group{ margin-bottom:14px;}
  .card-group h4{ font-size:11px; color:var(--gold-bright); margin-bottom:8px; text-transform:uppercase; letter-spacing:0.03em;}
  .card-item{ font-size:12.5px; padding:7px 0; border-bottom:1px solid var(--border-soft); display:flex; justify-content:space-between;}
  .card-item:last-child{ border-bottom:none;}
  .card-item span{ font-size:10px; color:var(--text-faint);}

  #sync-note{ display:block; text-align:center; font-size:11px; color:var(--text-faint); margin-top:14px;}
  .empty-note{ font-size:12px; color:var(--text-faint); font-style:italic; padding:14px 0; text-align:center;}

  @media (max-width:1000px){ .stat-row{ grid-template-columns:repeat(2,1fr);} .layout{ grid-template-columns:1fr;} }
</style>
</head>
<body>
<div class="main">
  <div class="page-head">
    <div>
      <h2 id="page-title">Command Center</h2>
      <p>Estructura real conectada a Notion — sin datos de negocio inventados.</p>
    </div>
    <div class="head-actions">
      <div class="head-btn" onclick="window.location.href='/'">🏠 Inicio</div>
      <div class="head-btn" onclick="window.location.href='/general-calendar.html?project=' + encodeURIComponent(currentProjectLabel || '')">📅 Calendario</div>
      <div class="head-btn primary" onclick="toggleAddTask()">+ Nueva Tarea</div>
    </div>
  </div>

  <div class="add-task-form" id="add-task-form" style="display:none; gap:8px; flex-wrap:wrap; margin-bottom:16px; background:var(--panel); border:1px solid var(--border-soft); border-radius:10px; padding:12px;">
    <input type="text" id="new-task-name" placeholder="Nueva tarea…" style="flex:1; min-width:200px; background:var(--panel-alt); border:1px solid var(--border-soft); border-radius:7px; color:var(--text); font-family:inherit; font-size:12.5px; padding:8px 10px;">
    <select id="new-task-area" style="background:var(--panel-alt); border:1px solid var(--border-soft); border-radius:7px; color:var(--text); font-family:inherit; font-size:12.5px; padding:8px 10px;"></select>
    <select id="new-task-priority" style="background:var(--panel-alt); border:1px solid var(--border-soft); border-radius:7px; color:var(--text); font-family:inherit; font-size:12.5px; padding:8px 10px;">
      <option value="P0">P0</option><option value="P1">P1</option><option value="P2" selected>P2</option><option value="P3">P3</option>
    </select>
    <div onclick="submitNewTask()" style="background:var(--gold); color:#12141d; font-weight:700; font-size:12px; padding:8px 14px; border-radius:7px; cursor:pointer;">Guardar</div>
  </div>

  <div class="stat-row" id="stat-row"></div>

  <div class="layout">
    <div class="board-panel">
      <div class="board-head">
        <h3>📋 Tablero de Tareas por Área</h3>
        <div class="board-head-actions">
          <span class="area-scroll-btn" onclick="document.getElementById('area-nav').scrollBy({left:-200, behavior:'smooth'})">‹</span>
          <span class="area-scroll-btn" onclick="document.getElementById('area-nav').scrollBy({left:200, behavior:'smooth'})">›</span>
          <span class="board-hint">Arrastra tareas entre columnas para cambiar su área</span>
          <span class="add-area-btn" onclick="addArea()">+ Área</span>
        </div>
      </div>
      <div class="area-nav" id="area-nav"></div>
      <div class="filter-bar" id="filter-bar"></div>
      <div class="board-cols" id="board-cols"></div>
    </div>
    <div>
      <div class="panel">
        <h3>🔴 Tareas Críticas (P0)</h3>
        <div id="critical-list"></div>
      </div>
      <div class="panel" id="cards-panel" style="display:none;">
        <h3 id="cards-title">📇 Tarjetas</h3>
        <div id="cards-list"></div>
      </div>
    </div>
  </div>

  <span id="sync-note"></span>
</div>

<div id="task-modal-backdrop" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:100; align-items:center; justify-content:center; padding:20px;">
  <div id="task-modal" style="background:var(--panel); border:1px solid var(--border-soft); border-radius:16px; max-width:640px; width:100%; max-height:85vh; overflow-y:auto; padding:24px;"></div>
</div>

<script>
function getProjectKey(){ return (new URLSearchParams(window.location.search).get('project') || '').toLowerCase(); }

const STATUS_OPTIONS = ["No iniciado","Preparación","En progreso","En revisión","En validación","Bloqueado","Terminado","Cancelado"];
const PRIO_LEVEL_LABEL = { Critical:"🔴 Crítica", High:"🟠 Alta", Medium:"🟡 Media", Low:"🟢 Baja" };
let allBoardData = [];
let currentProjectLabel = "";
let currentCards = [];
let filters = { area: "all", status: "all", priority: "all", priorityLevel: "all", person: "all" };

function emptyNote(t){ return `<div class="empty-note">${t}</div>`; }

function getFilteredBoard(){
  return allBoardData.map(col => ({
    area: col.area, areaId: col.areaId,
    tasks: col.tasks.filter(t => {
      if(filters.area !== "all" && col.area !== filters.area) return false;
      if(filters.status !== "all" && t.status !== filters.status) return false;
      if(filters.priority !== "all" && t.priority !== filters.priority) return false;
      if(filters.priorityLevel !== "all" && t.priorityLevel !== filters.priorityLevel) return false;
      if(filters.person !== "all" && (t.collaborators||"").indexOf(filters.person) === -1) return false;
      return true;
    })
  })).filter(col => filters.area === "all" || col.area === filters.area);
}

function uniquePeople(){
  const set = new Set();
  allBoardData.forEach(col => col.tasks.forEach(t => {
    (t.collaborators||"").split(",").map(s=>s.trim()).filter(Boolean).forEach(p => set.add(p));
  }));
  return [...set].sort();
}

function renderAreaNav(){
  const el = document.getElementById("area-nav");
  const chips = [["all","Todas las áreas"], ...allBoardData.map(c => [c.area, `${c.area} (${c.tasks.length})`])];
  el.innerHTML = chips.map(([key,label]) =>
    `<div class="area-nav-item ${filters.area===key?"active":""}" data-area="${key}">${label}</div>`).join("");
  el.querySelectorAll(".area-nav-item").forEach(chip => {
    chip.addEventListener("click", () => {
      filters.area = chip.dataset.area;
      applyFilters();
      if(chip.dataset.area !== "all"){
        const colEl = document.querySelector(`.board-col[data-area="${CSS.escape(chip.dataset.area)}"]`);
        if(colEl) colEl.scrollIntoView({ behavior:"smooth", inline:"start", block:"nearest" });
      }
    });
  });
}

function renderFilterBar(){
  const el = document.getElementById("filter-bar");
  const totalShown = getFilteredBoard().reduce((n,c)=>n+c.tasks.length,0);
  const totalAll = allBoardData.reduce((n,c)=>n+c.tasks.length,0);
  const anyActive = Object.values(filters).some(v => v !== "all");

  el.innerHTML = `
    <select id="f-status"><option value="all">Estado: Todos</option>${STATUS_OPTIONS.map(s=>`<option value="${s}" ${filters.status===s?"selected":""}>${s}</option>`).join("")}</select>
    <select id="f-plevel"><option value="all">P-Level: Todos</option>${["P0","P1","P2","P3"].map(p=>`<option value="${p}" ${filters.priority===p?"selected":""}>${p}</option>`).join("")}</select>
    <select id="f-priority"><option value="all">Prioridad: Todas</option>${Object.entries(PRIO_LEVEL_LABEL).map(([k,v])=>`<option value="${k}" ${filters.priorityLevel===k?"selected":""}>${v}</option>`).join("")}</select>
    <select id="f-person"><option value="all">Responsable: Todos</option>${uniquePeople().map(p=>`<option value="${p}" ${filters.person===p?"selected":""}>${p}</option>`).join("")}</select>
    ${anyActive ? `<span class="filter-clear" id="f-clear">✕ Limpiar filtros</span>` : ""}
    <span class="filter-count">${totalShown} de ${totalAll} tareas</span>`;

  document.getElementById("f-status").addEventListener("change", (e) => { filters.status = e.target.value; applyFilters(); });
  document.getElementById("f-plevel").addEventListener("change", (e) => { filters.priority = e.target.value; applyFilters(); });
  document.getElementById("f-priority").addEventListener("change", (e) => { filters.priorityLevel = e.target.value; applyFilters(); });
  document.getElementById("f-person").addEventListener("change", (e) => { filters.person = e.target.value; applyFilters(); });
  document.querySelectorAll("#filter-bar select").forEach(sel => { if(sel.value !== "all") sel.classList.add("active-filter"); });
  const clearBtn = document.getElementById("f-clear");
  if(clearBtn) clearBtn.addEventListener("click", () => {
    filters = { area: "all", status: "all", priority: "all", priorityLevel: "all", person: "all" };
    applyFilters(); renderAreaNav();
  });
}

function applyFilters(){ renderFilterBar(); renderBoard(getFilteredBoard()); }

function renderStats(board){
  const openTasks = board.flatMap(c => c.tasks);
  const critical = openTasks.filter(t => t.priority === "P0").length;
  const blocked = openTasks.filter(t => t.status === "Bloqueado").length;
  document.getElementById("stat-row").innerHTML = [
    { icon:"🗂️", bg:"var(--blue-dim)", label:"Áreas Activas", value: board.filter(c=>c.areaId).length },
    { icon:"✔️", bg:"var(--green-dim)", label:"Tareas Abiertas", value: openTasks.length },
    { icon:"🔴", bg:"var(--red-dim)", label:"Críticas (P0)", value: critical },
    { icon:"⛔", bg:"var(--amber-dim)", label:"Bloqueadas", value: blocked },
  ].map(c=>`
    <div class="stat-card">
      <div class="top"><div class="stat-icon" style="background:${c.bg}">${c.icon}</div><span class="label">${c.label}</span></div>
      <div class="value">${c.value}</div>
    </div>`).join("");
}

function statusPillClass(status){
  if(status==="En progreso") return "en-progreso";
  if(status==="Bloqueado") return "bloqueado";
  return "";
}

function renderBoard(board){
  const el = document.getElementById("board-cols");
  el.innerHTML = board.map(col => `
    <div class="board-col" data-area="${col.area}">
      <div class="board-col-head">
        <span class="name">${col.area}</span>
        ${col.areaId ? `<span class="area-actions"><span onclick="renameArea('${col.areaId}','${col.area.replace(/'/g,"\\'")}')" title="Renombrar">✎</span><span onclick="archiveArea('${col.areaId}','${col.area.replace(/'/g,"\\'")}')" title="Archivar">🗑</span></span>` : ""}
        <span>${col.tasks.length}</span>
      </div>
      <div class="board-col-body" data-dropzone="${col.area}">
        ${col.tasks.length ? col.tasks.map(t => `
          <div class="board-card" draggable="true" data-id="${t.id}">
            <div class="prio-row"><span class="prio-dot ${t.priority}"></span>${t.priority}</div>
            <div class="name">${t.taskName}</div>
            <div class="meta"><span>${t.collaborators || "—"}</span><span class="status-pill ${statusPillClass(t.status)}">${t.status}</span></div>
          </div>`).join("") : `<div class="board-empty">${Object.values(filters).some(v=>v!=="all") ? "Sin tareas que coincidan" : "Sin tareas abiertas"}</div>`}
      </div>
    </div>`).join("");

  el.querySelectorAll(".board-card").forEach(card => {
    card.addEventListener("click", () => openTaskDetail(card.dataset.id));
    card.addEventListener("dragstart", (e) => { e.dataTransfer.setData("text/plain", card.dataset.id); card.style.opacity="0.4"; });
    card.addEventListener("dragend", () => { card.style.opacity="1"; });
  });
  el.querySelectorAll(".board-col").forEach(col => {
    col.addEventListener("dragover", (e) => { e.preventDefault(); col.classList.add("dragover"); });
    col.addEventListener("dragleave", () => col.classList.remove("dragover"));
    col.addEventListener("drop", async (e) => {
      e.preventDefault();
      col.classList.remove("dragover");
      const taskId = e.dataTransfer.getData("text/plain");
      const t = window.jarvisToast?.loading("Moviendo tarea…");
      try{
        const r = await fetch("/api/task-api", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ action:"update-area", pageId: taskId, area: col.dataset.area }) });
        if(!r.ok) throw new Error("Error " + r.status);
        window.jarvisToast?.success(t, "Tarea movida");
        loadData();
      }catch(err){ window.jarvisToast?.error(t, "No se pudo mover: " + err.message); }
    });
  });
}

function renderCriticalList(board){
  const el = document.getElementById("critical-list");
  const list = board.flatMap(c => c.tasks).filter(t => t.priority === "P0")
    .sort((a,b) => (a.targetDate||"9999").localeCompare(b.targetDate||"9999")).slice(0,8);
  if(!list.length){ el.innerHTML = emptyNote("Sin tareas P0 abiertas."); return; }
  el.innerHTML = list.map((t,i) => `<div class="crit-item" data-id="${t.id}"><span class="n">${i+1}.</span><span>${t.taskName}</span></div>`).join("");
  el.querySelectorAll(".crit-item").forEach(item => item.addEventListener("click", () => openTaskDetail(item.dataset.id)));
}

function renderCards(cards, hasCards, label){
  if(!hasCards) return;
  document.getElementById('cards-panel').style.display = '';
  currentCards = cards;
  const filtered = filters.area !== "all" ? cards.filter(c => allBoardData.find(col=>col.area===filters.area)?.areaId === c.areaId) : cards;
  document.getElementById('cards-title').textContent = `📇 ${label} — Tarjetas`;
  const el = document.getElementById('cards-list');
  if(!filtered.length){ el.innerHTML = emptyNote("No hay tarjetas todavía."); return; }
  const groups = {};
  filtered.forEach(c => { const k = c.tipo || 'Sin tipo'; (groups[k] = groups[k] || []).push(c); });
  el.innerHTML = Object.entries(groups).map(([tipo, items]) => `
    <div class="card-group">
      <h4>${tipo} (${items.length})</h4>
      ${items.map(c => `<div class="card-item"><span>${c.name}</span>${c.estado ? `<span>${c.estado}</span>` : ''}</div>`).join('')}
    </div>`).join('');
}

async function openTaskDetail(pageId){
  const backdrop = document.getElementById("task-modal-backdrop");
  const modal = document.getElementById("task-modal");
  backdrop.style.display = "flex";
  modal.innerHTML = emptyNote("Cargando…");
  try{
    const res = await fetch(`/api/task-api?action=detail&pageId=${pageId}`);
    const t = await res.json();
    if(t.error) throw new Error(t.error);
    modal.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:16px;">
        <h2 style="font-family:var(--serif); font-size:19px; font-weight:600; flex:1;">${t.taskName}</h2>
        <span style="cursor:pointer; color:var(--text-faint); font-size:18px;" onclick="closeTaskModal()">✕</span>
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px;">
        <div><label style="font-size:10.5px; color:var(--text-faint); display:block; margin-bottom:4px;">Estado</label>
          <select id="td-status" style="width:100%; background:var(--panel-alt); border:1px solid var(--border-soft); color:var(--text); padding:8px; border-radius:8px; font-size:12.5px;">
            ${STATUS_OPTIONS.map(s => `<option value="${s}" ${s===t.status?"selected":""}>${s}</option>`).join("")}</select></div>
        <div><label style="font-size:10.5px; color:var(--text-faint); display:block; margin-bottom:4px;">Prioridad (Crítica/Alta/Media/Baja)</label>
          <select id="td-priority-level" style="width:100%; background:var(--panel-alt); border:1px solid var(--border-soft); color:var(--text); padding:8px; border-radius:8px; font-size:12.5px;">
            <option value="">Sin prioridad</option>
            ${Object.entries(PRIO_LEVEL_LABEL).map(([k,v]) => `<option value="${k}" ${k===t.priorityLevel?"selected":""}>${v}</option>`).join("")}</select></div>
        <div><label style="font-size:10.5px; color:var(--text-faint); display:block; margin-bottom:4px;">P-Level (P0-P3)</label>
          <select id="td-priority" style="width:100%; background:var(--panel-alt); border:1px solid var(--border-soft); color:var(--text); padding:8px; border-radius:8px; font-size:12.5px;">
            ${["P0","P1","P2","P3"].map(p => `<option value="${p}" ${p===t.priority?"selected":""}>${p}</option>`).join("")}</select></div>
        <div><label style="font-size:10.5px; color:var(--text-faint); display:block; margin-bottom:4px;">Responsable</label>
          <input id="td-collaborators" value="${t.collaborators||''}" style="width:100%; background:var(--panel-alt); border:1px solid var(--border-soft); color:var(--text); padding:8px; border-radius:8px; font-size:12.5px;"></div>
        <div><label style="font-size:10.5px; color:var(--text-faint); display:block; margin-bottom:4px;">Fecha límite</label>
          <input id="td-date" type="date" value="${t.targetDate||''}" style="width:100%; background:var(--panel-alt); border:1px solid var(--border-soft); color:var(--text); padding:8px; border-radius:8px; font-size:12.5px;"></div>
      </div>
      <label style="font-size:10.5px; color:var(--text-faint); display:block; margin-bottom:4px;">Descripción / Notas</label>
      <textarea id="td-description" rows="4" style="width:100%; background:var(--panel-alt); border:1px solid var(--border-soft); color:var(--text); padding:10px; border-radius:8px; font-size:12.5px; margin-bottom:16px; resize:vertical;">${t.description||''}</textarea>
      <label style="font-size:10.5px; color:var(--text-faint); display:block; margin-bottom:8px;">📎 Archivos y referencias</label>
      <div id="td-attachments" style="margin-bottom:8px;">
        ${t.attachments && t.attachments.length ? t.attachments.map(a => `
          <div style="display:flex; align-items:center; gap:8px; font-size:12px; padding:6px 0; border-bottom:1px solid var(--border-soft);">
            <span>📄</span><a href="${a.url}" target="_blank" style="color:var(--gold-bright); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${a.name}</a>
          </div>`).join("") : `<div style="font-size:11.5px; color:var(--text-faint);">Sin archivos todavía.</div>`}
      </div>
      <div style="display:flex; align-items:center; gap:10px; margin-bottom:16px;">
        <input type="file" id="td-file-input" style="display:none;" onchange="uploadAttachment('${pageId}')">
        <div onclick="document.getElementById('td-file-input').click()" style="background:var(--panel-alt); border:1px solid var(--border-soft); color:var(--text-dim); font-size:12px; padding:8px 14px; border-radius:8px; cursor:pointer;">+ Subir archivo</div>
        <span id="td-upload-status" style="font-size:11px; color:var(--text-faint);"></span>
      </div>
      <label style="font-size:10.5px; color:var(--text-faint); display:block; margin-bottom:8px;">Comentarios</label>
      <div id="td-comments" style="margin-bottom:10px; max-height:160px; overflow-y:auto;">
        ${t.comments.length ? t.comments.map(c => `<div style="font-size:12px; padding:8px 0; border-bottom:1px solid var(--border-soft);">${c.text}<div style="font-size:10px; color:var(--text-faint); margin-top:3px;">${new Date(c.createdTime).toLocaleString()}</div></div>`).join("") : emptyNote("Sin comentarios todavía.")}
      </div>
      <div style="display:flex; gap:8px; margin-bottom:16px;">
        <input id="td-comment-input" placeholder="Escribe un comentario…" style="flex:1; background:var(--panel-alt); border:1px solid var(--border-soft); color:var(--text); padding:9px 10px; border-radius:8px; font-size:12.5px;">
        <div onclick="submitComment('${pageId}')" style="background:var(--gold); color:#12141d; font-weight:700; font-size:12px; padding:9px 14px; border-radius:8px; cursor:pointer; white-space:nowrap;">Comentar</div>
      </div>
      <div style="display:flex; gap:10px;">
        <div onclick="saveTaskDetail('${pageId}')" style="flex:1; text-align:center; background:var(--gold); color:#12141d; font-weight:700; font-size:12.5px; padding:10px; border-radius:8px; cursor:pointer;">Guardar Cambios</div>
        <div onclick="closeTaskModal()" style="color:var(--text-faint); font-size:12px; cursor:pointer; padding:10px;">Cerrar</div>
      </div>`;
  }catch(e){
    modal.innerHTML = emptyNote("No se pudo cargar la tarea: " + e.message);
  }
}
function closeTaskModal(){ document.getElementById("task-modal-backdrop").style.display = "none"; }
document.getElementById("task-modal-backdrop").addEventListener("click", (e) => { if(e.target.id === "task-modal-backdrop") closeTaskModal(); });

async function saveTaskDetail(pageId){
  const t = window.jarvisToast?.loading("Guardando cambios…");
  try{
    const r = await fetch("/api/task-api", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        action:"update-full", pageId,
        status: document.getElementById("td-status").value,
        priority: document.getElementById("td-priority").value,
        priorityLevel: document.getElementById("td-priority-level").value || null,
        collaborators: document.getElementById("td-collaborators").value,
        targetDate: document.getElementById("td-date").value || null,
        description: document.getElementById("td-description").value,
      })
    });
    if(!r.ok) throw new Error("Error " + r.status);
    window.jarvisToast?.success(t, "Guardado");
    closeTaskModal();
    loadData();
  }catch(e){ window.jarvisToast?.error(t, "No se pudo guardar: " + e.message); }
}
async function uploadAttachment(pageId){
  const input = document.getElementById("td-file-input");
  const file = input.files[0];
  if(!file) return;
  const statusEl = document.getElementById("td-upload-status");
  if(file.size > 3 * 1024 * 1024){
    statusEl.textContent = "Archivo demasiado grande (máx. 3MB por ahora).";
    statusEl.style.color = "var(--red)";
    return;
  }
  statusEl.textContent = "Subiendo…";
  statusEl.style.color = "var(--text-faint)";
  try{
    const dataBase64 = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(",")[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
    const res = await fetch("/api/task-api", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ action:"upload", pageId, filename: file.name, contentType: file.type, dataBase64 })
    });
    const result = await res.json();
    if(!res.ok || result.error) throw new Error(result.error || "Error desconocido");
    input.value = "";
    openTaskDetail(pageId);
  }catch(e){
    statusEl.textContent = "No se pudo subir: " + e.message;
    statusEl.style.color = "var(--red)";
  }
}
async function submitComment(pageId){
  const input = document.getElementById("td-comment-input");
  if(!input.value.trim()) return;
  const t = window.jarvisToast?.loading("Comentando…");
  try{
    const r = await fetch("/api/task-api", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ action:"comment", pageId, text: input.value }) });
    if(!r.ok) throw new Error("Error " + r.status);
    window.jarvisToast?.success(t, "Comentario agregado");
    openTaskDetail(pageId);
  }catch(e){ window.jarvisToast?.error(t, "No se pudo comentar: " + e.message); }
}

function toggleAddTask(){ document.getElementById("add-task-form").style.display = document.getElementById("add-task-form").style.display==="none" ? "flex" : "none"; }
async function submitNewTask(){
  const name = document.getElementById("new-task-name").value.trim();
  if(!name){ alert("Escribe un nombre para la tarea."); return; }
  const area = document.getElementById("new-task-area").value;
  const priority = document.getElementById("new-task-priority").value;
  const t = window.jarvisToast?.loading("Creando tarea…");
  try{
    const r = await fetch("/api/task-api", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ action:"create", taskName:name, project:currentProjectLabel, area, priority })
    });
    if(!r.ok) throw new Error("Error " + r.status);
    window.jarvisToast?.success(t, "Tarea creada");
    document.getElementById("new-task-name").value = "";
    document.getElementById("add-task-form").style.display = "none";
    loadData();
  }catch(e){ window.jarvisToast?.error(t, "No se pudo crear la tarea: " + e.message); }
}

async function addArea(){
  const name = prompt("Nombre de la nueva área:");
  if(!name || !name.trim()) return;
  const t = window.jarvisToast?.loading("Creando área…");
  try{
    const r = await fetch("/api/project-data", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ action:"create-area", project: currentProjectLabel, name: name.trim() })
    });
    const result = await r.json();
    if(!r.ok || result.error) throw new Error(result.error || "Error desconocido");
    window.jarvisToast?.success(t, "Área creada");
    loadData();
  }catch(e){ window.jarvisToast?.error(t, "No se pudo crear el área: " + e.message); }
}
async function renameArea(areaId, currentName){
  const name = prompt("Nuevo nombre para el área:", currentName);
  if(!name || !name.trim() || name.trim() === currentName) return;
  const t = window.jarvisToast?.loading("Renombrando…");
  try{
    const r = await fetch("/api/project-data", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ action:"rename-area", areaId, name: name.trim() })
    });
    const result = await r.json();
    if(!r.ok || result.error) throw new Error(result.error || "Error desconocido");
    window.jarvisToast?.success(t, "Área renombrada");
    loadData();
  }catch(e){ window.jarvisToast?.error(t, "No se pudo renombrar: " + e.message); }
}
async function archiveArea(areaId, name){
  if(!confirm(`¿Archivar el área "${name}"? Las tareas dentro de ella no se eliminan, solo se oculta del tablero.`)) return;
  const t = window.jarvisToast?.loading("Archivando…");
  try{
    const r = await fetch("/api/project-data", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ action:"archive-area", areaId })
    });
    const result = await r.json();
    if(!r.ok || result.error) throw new Error(result.error || "Error desconocido");
    window.jarvisToast?.success(t, "Área archivada");
    if(filters.area === name) filters.area = "all";
    loadData();
  }catch(e){ window.jarvisToast?.error(t, "No se pudo archivar: " + e.message); }
}

async function loadData(){
  const key = getProjectKey();
  const syncNote = document.getElementById("sync-note");
  if(!key){
    document.getElementById("page-title").textContent = "Proyecto no especificado";
    document.getElementById("board-cols").innerHTML = emptyNote("Falta ?project= en la URL.");
    return;
  }
  try{
    const res = await fetch(`/api/project-data?project=${key}`);
    const data = await res.json();
    if(data.error && !data.project) throw new Error(data.error);

    currentProjectLabel = data.project.label;
    document.getElementById("page-title").textContent = `${data.project.icon || ''} ${data.project.label} — Command Center`;
    allBoardData = data.board || [];
    renderStats(allBoardData);
    renderAreaNav();
    applyFilters();
    renderCriticalList(allBoardData);
    renderCards(data.cards || [], data.hasCards, data.project.label);
    const areaSelect = document.getElementById("new-task-area");
    areaSelect.innerHTML = allBoardData.map(c => `<option value="${c.area}">${c.area}</option>`).join("");
    syncNote.textContent = data.error ? `Conectado parcialmente — ${data.error}` : "Synced with Notion";
  }catch(err){
    console.warn("Live data unavailable:", err.message);
    document.getElementById("board-cols").innerHTML = emptyNote("No se pudo conectar con Notion.");
    syncNote.textContent = "Sin conexión a Notion — revisa NOTION_TOKEN en Vercel.";
  }
}
loadData();
</script>
