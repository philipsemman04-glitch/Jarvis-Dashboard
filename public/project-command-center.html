<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Command Center — Jarvis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#08090d; --panel:#12141d; --panel-alt:#1a1d29;
    --border-soft:rgba(255,255,255,0.09);
    --gold:#d4af6a; --gold-bright:#f0cd8e;
    --text:#f8f6f0; --text-dim:#a8a496; --text-faint:#6f6c62;
    --blue:#4f8fe8; --blue-dim:rgba(79,143,232,0.18);
    --green:#3ecf8e; --green-dim:rgba(62,207,142,0.18);
    --red:#e8615f; --red-dim:rgba(232,97,95,0.18);
    --amber:#f2a13d; --amber-dim:rgba(242,161,61,0.18);
    --radius:14px; --serif:'Fraunces',serif; --sans:'Inter',sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: radial-gradient(ellipse 1400px 900px at 15% -10%, #181420 0%, transparent 55%),
                radial-gradient(ellipse 1100px 800px at 100% 0%, #101a26 0%, transparent 50%), var(--bg);
    color:var(--text); font-family:var(--sans); min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;} button{font-family:inherit; cursor:pointer; border:none;}
  ::-webkit-scrollbar{width:8px;} ::-webkit-scrollbar-thumb{background:var(--panel-alt); border-radius:8px;}

  .main{ padding:24px 28px 60px; max-width:1200px; margin:0 auto;}
  .page-head{ display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:10px;}
  .page-head h2{ font-family:var(--serif); font-size:23px; font-weight:600; display:flex; align-items:center; gap:9px;}
  .page-head p{ font-size:12px; color:var(--text-dim); margin-top:4px;}
  .home-btn{ background:var(--panel); border:1px solid var(--border-soft); color:var(--text); font-weight:600; font-size:12px;
    padding:9px 14px; border-radius:8px; cursor:pointer;}
  .home-btn:hover{ border-color:var(--gold); }

  .stat-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px;}
  .stat-card{ background:var(--panel); border:1px solid var(--border-soft); border-radius:var(--radius); padding:15px 16px; box-shadow:0 6px 18px rgba(0,0,0,0.24);}
  .stat-card .top{ display:flex; align-items:center; gap:9px; margin-bottom:10px;}
  .stat-icon{ width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:14px;}
  .stat-card .label{ font-size:10.5px; color:var(--text-dim);}
  .stat-card .value{ font-family:var(--serif); font-size:22px; font-weight:600;}
  .stat-card .sub{ font-size:10px; color:var(--text-faint); margin-top:5px;}

  .layout{ display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .layout.single{ grid-template-columns:1fr;}
  .panel{ background:var(--panel); border:1px solid var(--border-soft); border-radius:var(--radius); padding:18px 20px; margin-bottom:14px; box-shadow:0 8px 24px rgba(0,0,0,0.28);}
  .panel h3{ font-size:12.5px; font-weight:600; margin-bottom:14px; display:flex; align-items:center; gap:7px;}

  .area-row{ display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--border-soft); font-size:13px;}
  .area-row.clickable{ cursor:pointer; border-radius:8px; padding:9px 8px; margin:0 -8px;}
  .area-row.clickable:hover{ background:var(--panel-alt);}
  .area-row.active{ background:var(--gold-dim, rgba(212,175,106,0.14)); }
  .area-row.active .status-pill{ background:var(--gold); color:#181205;}
  .area-row:last-child{ border-bottom:none;}
  .status-pill{ font-size:9.5px; padding:2px 8px; border-radius:5px; background:var(--panel-alt); color:var(--text-dim);}

  .task-row{ display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border-soft); font-size:12.5px;}
  .task-row:last-child{ border-bottom:none;}
  .task-priority{ font-size:9px; font-weight:700; padding:2px 6px; border-radius:5px; flex-shrink:0;}
  .task-priority.P0{ background:var(--red-dim); color:var(--red);}
  .task-priority.P1{ background:var(--amber-dim); color:var(--amber);}
  .task-priority.P2, .task-priority.P3{ background:var(--panel-alt); color:var(--text-faint);}
  .task-name{ flex:1;}
  .task-status{ font-size:10.5px; color:var(--text-faint); white-space:nowrap;}

  .card-group{ margin-bottom:14px;}
  .card-group h4{ font-size:11px; color:var(--gold-bright); margin-bottom:8px; text-transform:uppercase; letter-spacing:0.03em;}
  .card-item{ font-size:12.5px; padding:7px 0; border-bottom:1px solid var(--border-soft); display:flex; justify-content:space-between;}
  .card-item:last-child{ border-bottom:none;}
  .card-item span{ font-size:10px; color:var(--text-faint);}

  .empty-note{ font-size:12px; color:var(--text-faint); font-style:italic; padding:14px 0; text-align:center;}
  #sync-note{ display:block; text-align:center; font-size:11px; color:var(--text-faint); margin-top:10px;}

  @media (max-width:900px){ .stat-row{ grid-template-columns:repeat(2,1fr);} .layout{ grid-template-columns:1fr;} }
</style>
</head>
<body>
<div class="main">
  <div class="page-head">
    <div>
      <h2 id="page-title">Command Center</h2>
      <p>Estructura real conectada a Notion — sin datos de negocio inventados.</p>
    </div>
    <div class="home-btn" onclick="window.location.href='/'">🏠 Inicio</div>
  </div>

  <div class="stat-row" id="stat-row"></div>
  <div class="layout" id="layout">
    <div>
      <div class="panel">
        <h3>🗂️ Áreas</h3>
        <div id="areas-list"><div class="empty-note">Cargando…</div></div>
      </div>
    </div>
    <div>
      <div class="panel">
        <h3>✔️ Tareas</h3>
        <div id="tasks-list"><div class="empty-note">Cargando…</div></div>
      </div>
      <div class="panel" id="cards-panel" style="display:none;">
        <h3 id="cards-title">📇 Tarjetas</h3>
        <div id="cards-list"></div>
      </div>
    </div>
  </div>
  <span id="sync-note"></span>
</div>

<script>
function getProjectKey(){
  const params = new URLSearchParams(window.location.search);
  return (params.get('project') || '').toLowerCase();
}

function renderStats(stats){
  document.getElementById('stat-row').innerHTML = [
    { icon:'🗂️', bg:'var(--blue-dim)', label:'Áreas Activas', value: stats.totalAreas },
    { icon:'✔️', bg:'var(--green-dim)', label:'Tareas Totales', value: stats.totalTasks },
    { icon:'🔴', bg:'var(--red-dim)', label:'Críticas (P0)', value: stats.critical },
    { icon:'⛔', bg:'var(--amber-dim)', label:'Bloqueadas', value: stats.blocked },
  ].map(c => `
    <div class="stat-card">
      <div class="top"><div class="stat-icon" style="background:${c.bg}">${c.icon}</div><span class="label">${c.label}</span></div>
      <div class="value">${c.value}</div>
    </div>`).join('');
}

let currentTasks = [];
let currentCards = [];
let activeAreaId = null;

function renderAreas(areas, hasCards){
  const el = document.getElementById('areas-list');
  if(!areas.length){ el.innerHTML = '<div class="empty-note">No hay áreas registradas.</div>'; return; }
  const clickable = hasCards || areas.some(a => a.taskCount > 0);
  el.innerHTML = areas.map(a => `
    <div class="area-row ${clickable ? 'clickable' : ''} ${activeAreaId===a.id ? 'active' : ''}" data-area="${a.id}">
      <span>${a.name}</span>
      <span class="status-pill">${hasCards ? `${a.cardCount} tarjeta${a.cardCount===1?'':'s'} · ` : ''}${a.taskCount} tarea${a.taskCount===1?'':'s'}</span>
    </div>`).join('');
  if(clickable){
    el.querySelectorAll('.area-row').forEach(row => {
      row.addEventListener('click', () => {
        const id = row.dataset.area;
        activeAreaId = (activeAreaId === id) ? null : id;
        renderAreas(areas, hasCards);
        renderTasks(currentTasks);
        renderCards(currentCards, hasCards, window.__projectLabel);
      });
    });
  }
}

function renderTasks(tasks){
  currentTasks = tasks;
  const el = document.getElementById('tasks-list');
  const filtered = activeAreaId ? tasks.filter(t => t.areaId === activeAreaId) : tasks;
  if(!tasks.length){
    el.innerHTML = '<div class="empty-note">Sin tareas asignadas todavía en Master Actions — nada etiquetado a este proyecto por ahora.</div>';
    return;
  }
  if(!filtered.length){
    el.innerHTML = '<div class="empty-note">Sin tareas en esta área todavía.</div>';
    return;
  }
  el.innerHTML = filtered.map(t => `
    <div class="task-row">
      <span class="task-priority ${t.priority || ''}">${t.priority || '—'}</span>
      <span class="task-name">${t.name}</span>
      <span class="task-status">${t.status || ''}</span>
    </div>`).join('');
}

function renderCards(cards, hasCards, label){
  if(!hasCards) return;
  window.__projectLabel = label;
  document.getElementById('cards-panel').style.display = '';
  currentCards = cards;
  const filtered = activeAreaId ? cards.filter(c => c.areaId === activeAreaId) : cards;
  document.getElementById('cards-title').textContent = activeAreaId
    ? `📇 ${label} — Tarjetas (área seleccionada)`
    : `📇 ${label} — Todas las Tarjetas`;
  const el = document.getElementById('cards-list');
  if(!filtered.length){ el.innerHTML = '<div class="empty-note">No hay tarjetas en esta área todavía.</div>'; return; }
  const groups = {};
  filtered.forEach(c => { const k = c.tipo || 'Sin tipo'; (groups[k] = groups[k] || []).push(c); });
  el.innerHTML = Object.entries(groups).map(([tipo, items]) => `
    <div class="card-group">
      <h4>${tipo} (${items.length})</h4>
      ${items.map(c => `<div class="card-item"><span>${c.name}</span>${c.estado ? `<span>${c.estado}</span>` : ''}</div>`).join('')}
    </div>`).join('');
}

async function loadData(){
  const key = getProjectKey();
  const syncNote = document.getElementById('sync-note');
  if(!key){
    document.getElementById('page-title').textContent = 'Proyecto no especificado';
    document.getElementById('areas-list').innerHTML = '<div class="empty-note">Falta ?project= en la URL.</div>';
    return;
  }
  try{
    const res = await fetch(`/api/project-data?project=${key}`);
    const data = await res.json();
    if(data.error && !data.project) throw new Error(data.error);

    document.getElementById('page-title').textContent = `${data.project.icon || ''} ${data.project.label} — Command Center`;
    renderStats(data.stats || { totalAreas:0, totalTasks:0, critical:0, blocked:0 });
    renderAreas(data.areas || [], data.hasCards);
    renderTasks(data.tasks || []);
    renderCards(data.cards || [], data.hasCards, data.project.label);
    if(data.hasCards && !document.getElementById('areas-hint')){
      document.querySelector('#areas-panel .panel-head, #areas-panel h3')?.insertAdjacentHTML('afterend',
        '<div id="areas-hint" style="font-size:10.5px;color:var(--text-faint);margin:-6px 0 10px;">Haz clic en un área para filtrar sus tarjetas →</div>');
    }
    syncNote.textContent = data.error ? `Conectado parcialmente — ${data.error}` : 'Synced with Notion';
  }catch(err){
    console.warn('Live data unavailable:', err.message);
    document.getElementById('areas-list').innerHTML = '<div class="empty-note">No se pudo conectar con Notion.</div>';
    document.getElementById('tasks-list').innerHTML = '<div class="empty-note">No se pudo conectar con Notion.</div>';
    syncNote.textContent = 'Sin conexión a Notion — revisa NOTION_TOKEN en Vercel.';
  }
}

loadData();
</script>
<script src="/sidebar.js"></script>
</body>
</html>
