<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tareas & Proyectos — Jarvis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0b10;
    --panel: #12141d;
    --panel-alt: #171a24;
    --border: rgba(201,169,97,0.14);
    --border-soft: rgba(255,255,255,0.06);
    --gold: #c9a961;
    --gold-bright: #e0c584;
    --gold-dim: rgba(201,169,97,0.14);
    --text: #f3f0e8;
    --text-dim: #9a9683;
    --text-faint: #67645a;
    --red: #e0636b;
    --red-dim: rgba(224,99,107,0.14);
    --amber: #e0a45c;
    --amber-dim: rgba(224,164,92,0.14);
    --green: #7cc99a;
    --green-dim: rgba(124,201,154,0.14);
    --blue: #7d9cc9;
    --blue-dim: rgba(125,156,201,0.14);
    --purple: #b491d9;
    --purple-dim: rgba(180,145,217,0.14);
    --pink: #d98cb0;
    --pink-dim: rgba(217,140,176,0.14);
    --radius: 14px;
    --serif: 'Fraunces', serif;
    --sans: 'Inter', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: radial-gradient(ellipse 1400px 900px at 15% -10%, #1a1710 0%, transparent 55%),
                radial-gradient(ellipse 1000px 700px at 100% 0%, #0f1420 0%, transparent 50%),
                var(--bg);
    color: var(--text); font-family: var(--sans); min-height:100vh; -webkit-font-smoothing: antialiased;
  }
  a{color:inherit; text-decoration:none;}
  button, select, input{font-family:inherit;}

  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:16px 28px; border-bottom:1px solid var(--border-soft); }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-mark{ width:38px; height:38px; border-radius:10px; background:var(--amber-dim); color:var(--amber);
    display:flex; align-items:center; justify-content:center; font-size:18px; }
  .brand-text h1{ font-family:var(--serif); font-weight:600; font-size:19px; }
  .brand-text p{ font-size:11.5px; color:var(--text-dim); }
  .topbar-actions{ display:flex; align-items:center; gap:12px; }
  .icon-btn{ width:36px; height:36px; border-radius:50%; background:var(--panel-alt); border:1px solid var(--border-soft);
    display:flex; align-items:center; justify-content:center; font-size:15px; cursor:pointer; }
  .add-btn{ background:var(--gold); color:#12141d; font-weight:700; font-size:12.5px; padding:9px 16px;
    border-radius:9px; cursor:pointer; }

  .shell{ max-width:920px; margin:0 auto; padding:24px 20px 60px; }

  .stat-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:20px; }
  .stat-card{ background:var(--panel); border:1px solid var(--border-soft); border-radius:var(--radius); padding:14px; }
  .stat-num{ font-family:var(--serif); font-size:24px; font-weight:600; }
  .stat-num.red{ color:var(--red); } .stat-num.amber{ color:var(--amber); } .stat-num.gold{ color:var(--gold-bright); }
  .stat-lbl{ font-size:10.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.4px; margin-top:2px; }

  .filters{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px; }
  .chip{ font-size:12px; padding:6px 12px; border-radius:20px; background:var(--panel); border:1px solid var(--border-soft);
    color:var(--text-dim); cursor:pointer; user-select:none; }
  .chip.active{ background:var(--gold-dim); border-color:var(--gold); color:var(--gold-bright); font-weight:600; }
  .filter-row2{ display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; }
  .select-filter{ background:var(--panel); border:1px solid var(--border-soft); color:var(--text-dim); font-size:12px;
    padding:6px 10px; border-radius:8px; }

  #quick-add{ display:none; background:var(--panel); border:1px solid var(--border-soft); border-radius:var(--radius);
    padding:16px; margin-bottom:18px; gap:10px; flex-wrap:wrap; align-items:center; }
  #quick-add.open{ display:flex; }
  #quick-add input[type=text]{ flex:1; min-width:180px; background:var(--panel-alt); border:1px solid var(--border-soft);
    color:var(--text); padding:9px 12px; border-radius:8px; font-size:13px; }
  #quick-add select, #quick-add input[type=date]{ background:var(--panel-alt); border:1px solid var(--border-soft);
    color:var(--text-dim); padding:9px 10px; border-radius:8px; font-size:12.5px; }
  #quick-add .save-btn{ background:var(--gold); color:#12141d; font-weight:700; font-size:12.5px; padding:9px 16px;
    border-radius:8px; cursor:pointer; }
  #quick-add .cancel-btn{ color:var(--text-faint); font-size:12px; cursor:pointer; padding:9px 6px; }

  .task-list{ display:flex; flex-direction:column; gap:8px; }
  .task-row{ display:flex; align-items:center; gap:12px; background:var(--panel); border:1px solid var(--border-soft);
    border-radius:11px; padding:12px 14px; }
  .task-row.overdue{ border-color:rgba(224,99,107,0.35); }
  .task-main{ flex:1; min-width:0; cursor:pointer; }
  .task-name{ font-size:13.5px; font-weight:500; }
  .task-name.done{ text-decoration:line-through; color:var(--text-faint); }
  .task-meta{ display:flex; gap:6px; align-items:center; margin-top:5px; flex-wrap:wrap; }
  .tag{ font-size:9.5px; font-weight:700; letter-spacing:0.3px; text-transform:uppercase; padding:2px 7px; border-radius:5px; }
  .tag.proj{ background:var(--blue-dim); color:var(--blue); }
  .tag.p0{ background:var(--red-dim); color:var(--red); }
  .tag.p1{ background:var(--amber-dim); color:var(--amber); }
  .tag.p2{ background:var(--gold-dim); color:var(--gold); }
  .tag.p3{ background:var(--panel-alt); color:var(--text-faint); }
  .tag.due{ background:var(--red-dim); color:var(--red); }
  .status-select{ font-size:11px; padding:6px 8px; border-radius:7px; border:1px solid var(--border-soft); cursor:pointer; }
  .status-select.st-No-iniciado, .status-select.st-Preparación{ background:var(--panel-alt); color:var(--text-dim); }
  .status-select.st-En-progreso{ background:var(--blue-dim); color:var(--blue); }
  .status-select.st-En-revisión, .status-select.st-En-validación{ background:var(--purple-dim); color:var(--purple); }
  .status-select.st-Bloqueado{ background:var(--red-dim); color:var(--red); }
  .status-select.st-Terminado{ background:var(--green-dim); color:var(--green); }
  .status-select.st-Cancelado{ background:var(--panel-alt); color:var(--text-faint); }

  .empty-state{ text-align:center; padding:40px 20px; color:var(--text-faint); font-size:13px; }
  #sync-note{ display:block; text-align:center; font-size:11px; color:var(--text-faint); margin-top:20px; }
  #result-count{ font-size:11.5px; color:var(--text-faint); margin-bottom:10px; }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">✅</div>
      <div class="brand-text">
        <h1>Tareas & Proyectos</h1>
        <p>Todo lo pendiente, en un solo lugar</p>
      </div>
    </div>
    <div class="topbar-actions">
      <div class="icon-btn" onclick="window.location.href='https://jarvis-dashboard-phi-one.vercel.app/'" title="Volver al inicio">🏠</div>
      <div class="add-btn" id="toggle-add-btn">+ Nueva Tarea</div>
    </div>
  </div>

  <div class="shell">
    <div class="stat-row" id="stat-row"></div>

    <div class="filters" id="project-filters"></div>
    <div class="filter-row2">
      <div class="chip active" data-status="active">Activas</div>
      <div class="chip" data-status="not-started">No Iniciadas</div>
      <div class="chip" data-status="in-progress">En Progreso</div>
      <div class="chip" data-status="in-review">En Revisión</div>
      <div class="chip" data-status="completed">Completadas</div>
      <select class="select-filter" id="date-range-filter">
        <option value="all">Todo el tiempo</option>
        <option value="week">Esta semana</option>
        <option value="month">Este mes</option>
        <option value="lastmonth">Mes pasado</option>
      </select>
      <select class="select-filter" id="priority-filter">
        <option value="all">Todo P-Level</option>
        <option value="P0">P0</option>
        <option value="P1">P1</option>
        <option value="P2">P2</option>
        <option value="P3">P3</option>
      </select>
      <select class="select-filter" id="priority-level-filter">
        <option value="all">Toda prioridad</option>
        <option value="Critical">🔴 Crítica</option>
        <option value="High">🟠 Alta</option>
        <option value="Medium">🟡 Media</option>
        <option value="Low">🟢 Baja</option>
      </select>
      <select class="select-filter" id="area-filter">
        <option value="all">Toda área</option>
      </select>
    </div>

    <div id="quick-add">
      <input type="text" id="new-task-name" placeholder="Nombre de la tarea…">
      <select id="new-task-project"></select>
      <select id="new-task-area"><option value="">Sin área</option></select>
      <select id="new-task-priority">
        <option value="P0">P0</option>
        <option value="P1">P1</option>
        <option value="P2" selected>P2</option>
        <option value="P3">P3</option>
      </select>
      <select id="new-task-priority-level">
        <option value="">Sin prioridad</option>
        <option value="Critical">🔴 Crítica</option>
        <option value="High">🟠 Alta</option>
        <option value="Medium">🟡 Media</option>
        <option value="Low">🟢 Baja</option>
      </select>
      <input type="date" id="new-task-date">
      <div class="save-btn" id="save-task-btn">Guardar</div>
      <div class="cancel-btn" id="cancel-add-btn">Cancelar</div>
    </div>

    <div id="result-count"></div>
    <div class="task-list" id="task-list"></div>
    <span id="sync-note"></span>
  </div>

  <!-- Task Detail modal — matches the shared reference for ONG too -->
  <div id="task-modal-backdrop" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:100; align-items:center; justify-content:center; padding:20px;">
    <div id="task-modal" style="background:var(--panel); border:1px solid var(--border-soft); border-radius:16px; max-width:640px; width:100%; max-height:85vh; overflow-y:auto; padding:24px;"></div>
  </div>

<script>
const PROJECTS = ["One Night Guest", "RoutePup", "Nikita", "StatStrike", "Personal", "Aristóteles", "Transversal", "Sin proyecto"];
const STATUS_OPTIONS = ["No iniciado","Preparación","En progreso","En revisión","En validación","Bloqueado","Terminado","Cancelado"];

// Only shown if the live Notion fetch fails — clearly marked as demo, never
// presented as real numbers.
let allTasks = [];
let activeProject = "all";
let activeStatus = "active";

// FIX (Aug 15, round 3): Aurelio explicitly asked to stop treating the 8
// real Notion statuses as 8 separate primary filters — too much noise.
// These 5 buckets map onto the real statuses without changing any actual
// data; "Activas" is every open bucket combined.
const STATUS_BUCKETS = {
  "not-started": ["No iniciado"],
  "in-progress": ["Preparación", "En progreso", "Bloqueado", "En validación"],
  "in-review": ["En revisión"],
  "completed": ["Terminado"],
};
STATUS_BUCKETS["active"] = [...STATUS_BUCKETS["not-started"], ...STATUS_BUCKETS["in-progress"], ...STATUS_BUCKETS["in-review"]];

function priorityTag(p){
  const cls = { P0:"p0", P1:"p1", P2:"p2", P3:"p3" }[p] || "p3";
  return `<span class="tag ${cls}">${p}</span>`;
}
const PRIO_LEVEL_LABEL = { Critical:"🔴 Crítica", High:"🟠 Alta", Medium:"🟡 Media", Low:"🟢 Baja" };
const PRIO_LEVEL_CLASS = { Critical:"p0", High:"p1", Medium:"p2", Low:"p3" };
function priorityLevelTag(pl){
  if(!pl) return "";
  return `<span class="tag ${PRIO_LEVEL_CLASS[pl]}">${PRIO_LEVEL_LABEL[pl]}</span>`;
}

function statusClass(status){ return "st-" + status.replace(/\s+/g, "-").replace("ó","o").replace("é","e"); }

function dateInRange(dateStr, range){
  if(range === "all" || !dateStr) return range === "all" ? true : false;
  const d = new Date(dateStr);
  const now = new Date();
  if(range === "week"){
    const start = new Date(now); start.setDate(now.getDate() - now.getDay());
    return d >= start && d <= now;
  }
  if(range === "month"){
    return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
  }
  if(range === "lastmonth"){
    const lm = new Date(now.getFullYear(), now.getMonth() - 1, 1);
    return d.getFullYear() === lm.getFullYear() && d.getMonth() === lm.getMonth();
  }
  return true;
}

// Real stats: Total Active, Critical/High/Medium/Low (by the NEW Priority
// Level field), Completed — all computed from tasks matching every
// CURRENTLY ACTIVE filter except status itself, so these numbers always
// mean "if I clicked Completed right now, this is what I'd see."
function renderStats(){
  const project = activeProject;
  const area = document.getElementById("area-filter").value;
  const pLevel = document.getElementById("priority-filter").value;
  const dateRange = document.getElementById("date-range-filter").value;

  const scoped = allTasks.filter(t => {
    if(project !== "all" && t.project !== project) return false;
    if(area !== "all" && t.area !== area) return false;
    if(pLevel !== "all" && t.priority !== pLevel) return false;
    return true;
  });

  const activeCount = scoped.filter(t => STATUS_BUCKETS.active.includes(t.status)).length;
  const completedScoped = scoped.filter(t => t.status === "Terminado");
  const completedCount = dateRange === "all" ? completedScoped.length : completedScoped.filter(t => dateInRange(t.completionDate, dateRange)).length;

  const byLevel = { Critical:0, High:0, Medium:0, Low:0 };
  scoped.forEach(t => { if(STATUS_BUCKETS.active.includes(t.status) && byLevel[t.priorityLevel] !== undefined) byLevel[t.priorityLevel]++; });

  document.getElementById("stat-row").innerHTML = `
    <div class="stat-card"><div class="stat-num gold">${activeCount}</div><div class="stat-lbl">Total Activas</div></div>
    <div class="stat-card"><div class="stat-num red">${byLevel.Critical}</div><div class="stat-lbl">Críticas</div></div>
    <div class="stat-card"><div class="stat-num amber">${byLevel.High}</div><div class="stat-lbl">Altas</div></div>
    <div class="stat-card"><div class="stat-num" style="color:var(--gold-bright)">${byLevel.Medium}</div><div class="stat-lbl">Medias</div></div>
    <div class="stat-card"><div class="stat-num" style="color:var(--green)">${byLevel.Low}</div><div class="stat-lbl">Bajas</div></div>
    <div class="stat-card"><div class="stat-num" style="color:var(--green)">${completedCount}</div><div class="stat-lbl">Completadas${dateRange!=='all'?' (periodo)':''}</div></div>`;
}

function countsForCurrentFilters(){
  const pLevel = document.getElementById("priority-level-filter").value;
  const priority = document.getElementById("priority-filter").value;
  const counts = {};
  let allCount = 0;
  allTasks.forEach(t => {
    if(priority !== "all" && t.priority !== priority) return;
    if(pLevel !== "all" && t.priorityLevel !== pLevel) return;
    if(!STATUS_BUCKETS[activeStatus].includes(t.status)) return;
    counts[t.project] = (counts[t.project] || 0) + 1;
    allCount++;
  });
  return { counts, allCount };
}

function renderProjectFilters(){
  const el = document.getElementById("project-filters");
  const { counts, allCount } = countsForCurrentFilters();
  const chips = [["all", `Todas (${allCount})`], ...PROJECTS.map(p => [p, `${p} (${counts[p]||0})`])];
  el.innerHTML = chips.map(([key,label]) =>
    `<div class="chip ${activeProject===key?"active":""}" data-project="${key}">${label}</div>`
  ).join("");
  el.querySelectorAll(".chip").forEach(chip => {
    chip.addEventListener("click", () => { activeProject = chip.dataset.project; applyFilters(); });
  });
}

function applyFilters(){
  const priority = document.getElementById("priority-filter").value;
  const pLevel = document.getElementById("priority-level-filter").value;
  const areaFilter = document.getElementById("area-filter").value;
  const dateRange = document.getElementById("date-range-filter").value;

  renderProjectFilters();
  renderAreaFilterOptions();
  renderStats();

  let filtered = allTasks.filter(t => {
    if(activeProject !== "all" && t.project !== activeProject) return false;
    if(priority !== "all" && t.priority !== priority) return false;
    if(pLevel !== "all" && t.priorityLevel !== pLevel) return false;
    if(areaFilter !== "all" && t.area !== areaFilter) return false;
    if(!STATUS_BUCKETS[activeStatus].includes(t.status)) return false;
    if(activeStatus === "completed" && dateRange !== "all" && !dateInRange(t.completionDate, dateRange)) return false;
    return true;
  });

  document.querySelectorAll("#project-filters .chip").forEach(c =>
    c.classList.toggle("active", c.dataset.project === activeProject));
  document.querySelectorAll("[data-status]").forEach(c =>
    c.classList.toggle("active", c.dataset.status === activeStatus));

  document.getElementById("result-count").textContent =
    `${filtered.length} de ${allTasks.length} tareas`;
  renderTaskList(filtered);
}

// Areas are scoped to whichever project is currently selected (an area
// name can repeat across projects) — so this rebuilds the dropdown's
// options to match the active project scope, using only real area names
// that actually appear on tasks right now, not an invented full list.
function renderAreaFilterOptions(){
  const sel = document.getElementById("area-filter");
  const prevValue = sel.value;
  const scoped = activeProject === "all" ? allTasks : allTasks.filter(t => t.project === activeProject);
  const areas = [...new Set(scoped.map(t => t.area).filter(Boolean))].sort();
  sel.innerHTML = `<option value="all">Toda área</option>` +
    areas.map(a => `<option value="${a}">${a}</option>`).join("");
  if(areas.includes(prevValue)) sel.value = prevValue;
}

function renderTaskList(tasks){
  const list = document.getElementById("task-list");
  if(!tasks.length){
    list.innerHTML = `<div class="empty-state">No hay tareas que coincidan con estos filtros.</div>`;
    return;
  }
  list.innerHTML = "";
  tasks.forEach(t => {
    const row = document.createElement("div");
    row.className = "task-row" + (t.isOverdue ? " overdue" : "");
    row.innerHTML = `
      <div class="task-main">
        <div class="task-name ${t.status==='Terminado'?'done':''}">${t.taskName || "(sin título)"}</div>
        <div class="task-meta">
          <span class="tag proj">${t.project}</span>
          ${t.area ? `<span class="tag" style="background:var(--panel-alt); color:var(--text-dim);">${t.area}</span>` : ""}
          ${priorityTag(t.priority)}
          ${priorityLevelTag(t.priorityLevel)}
          ${t.collaborators ? `<span class="tag" style="background:var(--blue-dim); color:var(--blue);">👤 ${t.collaborators}</span>` : ""}
          ${t.targetDate ? `<span class="tag ${t.isOverdue?'due':'p3'}">${t.isOverdue?'Vencida ':''}${t.targetDate}</span>` : ""}
        </div>
      </div>
      <select class="status-select ${statusClass(t.status)}">
        ${STATUS_OPTIONS.map(s => `<option value="${s}" ${s===t.status?"selected":""}>${s}</option>`).join("")}
      </select>`;

    row.querySelector(".task-main").addEventListener("click", () => {
      openTaskDetail(t.id);
    });

    const sel = row.querySelector(".status-select");
    sel.addEventListener("click", (e) => e.stopPropagation());
    sel.addEventListener("change", async () => {
      const newStatus = sel.value;
      const prevClass = sel.className;
      try{
        const res = await fetch("/api/task-api", {
          method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify({ action:"update-status", pageId: t.id, status: newStatus })
        });
        if(!res.ok) throw new Error("Update failed");
        t.status = newStatus;
        sel.className = "status-select " + statusClass(newStatus);
        applyFilters();
      }catch(e){
        sel.className = prevClass;
        alert("No se pudo actualizar en Notion: " + e.message);
      }
    });

    list.appendChild(row);
  });
}

// ---- Task Detail modal ----
async function openTaskDetail(pageId){
  const backdrop = document.getElementById("task-modal-backdrop");
  const modal = document.getElementById("task-modal");
  backdrop.style.display = "flex";
  modal.innerHTML = `<div class="empty-state">Cargando…</div>`;
  try{
    const res = await fetch(`/api/task-api?action=detail&pageId=${pageId}`);
    const t = await res.json();
    if(t.error) throw new Error(t.error);
    modal.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:16px;">
        <h2 style="font-family:var(--serif); font-size:19px; font-weight:600; flex:1;">${t.taskName}</h2>
        <span style="cursor:pointer; color:var(--text-faint); font-size:18px; padding:0 4px;" onclick="closeTaskModal()">✕</span>
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px;">
        <div>
          <label style="font-size:10.5px; color:var(--text-faint); display:block; margin-bottom:4px;">Estado</label>
          <select id="td-status" style="width:100%; background:var(--panel-alt); border:1px solid var(--border-soft); color:var(--text); padding:8px; border-radius:8px; font-size:12.5px;">
            ${STATUS_OPTIONS.map(s => `<option value="${s}" ${s===t.status?"selected":""}>${s}</option>`).join("")}
          </select>
        </div>
        <div>
          <label style="font-size:10.5px; color:var(--text-faint); display:block; margin-bottom:4px;">Prioridad (Crítica/Alta/Media/Baja)</label>
          <select id="td-priority-level" style="width:100%; background:var(--panel-alt); border:1px solid var(--border-soft); color:var(--text); padding:8px; border-radius:8px; font-size:12.5px;">
            <option value="">Sin prioridad</option>
            ${Object.entries(PRIO_LEVEL_LABEL).map(([k,v]) => `<option value="${k}" ${k===t.priorityLevel?"selected":""}>${v}</option>`).join("")}
          </select>
        </div>
        <div>
          <label style="font-size:10.5px; color:var(--text-faint); display:block; margin-bottom:4px;">P-Level (P0-P3)</label>
          <select id="td-priority" style="width:100%; background:var(--panel-alt); border:1px solid var(--border-soft); color:var(--text); padding:8px; border-radius:8px; font-size:12.5px;">
            ${["P0","P1","P2","P3"].map(p => `<option value="${p}" ${p===t.priority?"selected":""}>${p}</option>`).join("")}
          </select>
        </div>
        <div>
          <label style="font-size:10.5px; color:var(--text-faint); display:block; margin-bottom:4px;">Responsable</label>
          <input id="td-collaborators" value="${t.collaborators||''}" placeholder="Nombre…" style="width:100%; background:var(--panel-alt); border:1px solid var(--border-soft); color:var(--text); padding:8px; border-radius:8px; font-size:12.5px;">
        </div>
        <div>
          <label style="font-size:10.5px; color:var(--text-faint); display:block; margin-bottom:4px;">Fecha límite</label>
          <input id="td-date" type="date" value="${t.targetDate||''}" style="width:100%; background:var(--panel-alt); border:1px solid var(--border-soft); color:var(--text); padding:8px; border-radius:8px; font-size:12.5px;">
        </div>
      </div>
      <label style="font-size:10.5px; color:var(--text-faint); display:block; margin-bottom:4px;">Descripción / Notas</label>
      <textarea id="td-description" rows="4" style="width:100%; background:var(--panel-alt); border:1px solid var(--border-soft); color:var(--text); padding:10px; border-radius:8px; font-size:12.5px; margin-bottom:16px; resize:vertical;">${t.description||''}</textarea>

      <div style="background:var(--panel-alt); border-radius:10px; padding:12px 14px; margin-bottom:16px; font-size:11.5px; color:var(--text-dim);">
        📎 Referencias / archivos — sube imágenes o documentos directamente en Notion (el upload dentro de Jarvis todavía no está construido):
        <a href="${t.notionUrl}" style="color:var(--gold-bright); cursor:pointer;" target="_self" onclick="window.location.href='${t.notionUrl}'; return false;"> abrir en Notion →</a>
      </div>

      <label style="font-size:10.5px; color:var(--text-faint); display:block; margin-bottom:8px;">Comentarios</label>
      <div id="td-comments" style="margin-bottom:10px; max-height:160px; overflow-y:auto;">
        ${t.comments.length ? t.comments.map(c => `<div style="font-size:12px; padding:8px 0; border-bottom:1px solid var(--border-soft);">${c.text}<div style="font-size:10px; color:var(--text-faint); margin-top:3px;">${new Date(c.createdTime).toLocaleString()}</div></div>`).join("") : `<div class="empty-state" style="padding:10px 0;">Sin comentarios todavía.</div>`}
      </div>
      <div style="display:flex; gap:8px; margin-bottom:16px;">
        <input id="td-comment-input" placeholder="Escribe un comentario…" style="flex:1; background:var(--panel-alt); border:1px solid var(--border-soft); color:var(--text); padding:9px 10px; border-radius:8px; font-size:12.5px;">
        <div class="save-btn" id="td-comment-btn" style="white-space:nowrap;">Comentar</div>
      </div>

      <div style="display:flex; gap:10px;">
        <div class="save-btn" id="td-save-btn" style="flex:1; text-align:center;">Guardar Cambios</div>
        <div class="cancel-btn" onclick="closeTaskModal()">Cerrar</div>
      </div>`;

    document.getElementById("td-save-btn").addEventListener("click", async () => {
      const btn = document.getElementById("td-save-btn");
      btn.textContent = "Guardando…";
      try{
        await fetch("/api/task-api", {
          method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify({
            action:"update-full",
            pageId,
            status: document.getElementById("td-status").value,
            priority: document.getElementById("td-priority").value,
            priorityLevel: document.getElementById("td-priority-level").value || null,
            collaborators: document.getElementById("td-collaborators").value,
            targetDate: document.getElementById("td-date").value || null,
            description: document.getElementById("td-description").value,
          })
        });
        closeTaskModal();
        loadData();
      }catch(e){
        btn.textContent = "Error — reintentar";
      }
    });
    document.getElementById("td-comment-btn").addEventListener("click", async () => {
      const input = document.getElementById("td-comment-input");
      if(!input.value.trim()) return;
      await fetch("/api/task-api", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ action:"comment", pageId, text: input.value })
      });
      openTaskDetail(pageId);
    });
  }catch(e){
    modal.innerHTML = `<div class="empty-state">No se pudo cargar la tarea: ${e.message}</div>`;
  }
}
function closeTaskModal(){ document.getElementById("task-modal-backdrop").style.display = "none"; }
document.getElementById("task-modal-backdrop").addEventListener("click", (e) => {
  if(e.target.id === "task-modal-backdrop") closeTaskModal();
});

document.querySelectorAll('[data-status]').forEach(chip => {
  chip.addEventListener("click", () => {
    activeStatus = chip.dataset.status;
    applyFilters();
  });
});
document.getElementById("priority-filter").addEventListener("change", applyFilters);
document.getElementById("priority-level-filter").addEventListener("change", applyFilters);
document.getElementById("area-filter").addEventListener("change", applyFilters);
document.getElementById("date-range-filter").addEventListener("change", applyFilters);

// ---- Quick add ----
const projectSelect = document.getElementById("new-task-project");
const newTaskAreaSelect = document.getElementById("new-task-area");
projectSelect.innerHTML = PROJECTS.map(p => `<option value="${p}">${p}</option>`).join("");

// Populate the area dropdown with the real areas that already appear on
// live tasks for the selected project — not a guessed/hardcoded list.
// This is intentionally scoped: it only shows areas we've actually seen
// data for, same source of truth as the area filter above.
function refreshNewTaskAreaOptions(){
  const project = projectSelect.value;
  const areas = [...new Set(allTasks.filter(t => t.project === project && t.area).map(t => t.area))].sort();
  newTaskAreaSelect.innerHTML = `<option value="">Sin área</option>` +
    areas.map(a => `<option value="${a}">${a}</option>`).join("");
}
projectSelect.addEventListener("change", refreshNewTaskAreaOptions);

document.getElementById("toggle-add-btn").addEventListener("click", () => {
  document.getElementById("quick-add").classList.toggle("open");
  refreshNewTaskAreaOptions();
});
document.getElementById("cancel-add-btn").addEventListener("click", () => {
  document.getElementById("quick-add").classList.remove("open");
});
document.getElementById("save-task-btn").addEventListener("click", async () => {
  const taskName = document.getElementById("new-task-name").value.trim();
  if(!taskName){ alert("Escribe un nombre para la tarea."); return; }
  const project = projectSelect.value;
  const area = newTaskAreaSelect.value || undefined;
  const priority = document.getElementById("new-task-priority").value;
  const priorityLevel = document.getElementById("new-task-priority-level").value || undefined;
  const targetDate = document.getElementById("new-task-date").value || undefined;
  const btn = document.getElementById("save-task-btn");
  const original = btn.textContent;
  btn.textContent = "Guardando…";
  try{
    const res = await fetch("/api/task-api", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ action:"create", taskName, project, area, priority, priorityLevel, targetDate })
    });
    if(!res.ok) throw new Error("No se pudo crear la tarea");
    const result = await res.json();
    if(result.areaWarning) console.warn(result.areaWarning);
    document.getElementById("new-task-name").value = "";
    document.getElementById("quick-add").classList.remove("open");
    btn.textContent = original;
    loadData();
  }catch(e){
    btn.textContent = original;
    alert(e.message);
  }
});

async function loadData(){
  const syncNote = document.getElementById("sync-note");
  try{
    const res = await fetch("/api/tasks-data");
    if(!res.ok) throw new Error("API error " + res.status);
    const data = await res.json();
    allTasks = data.tasks || [];
    renderProjectFilters();
    applyFilters();
    if(syncNote) syncNote.textContent = "";
  }catch(err){
    console.warn("Live tasks data unavailable:", err.message);
    allTasks = FALLBACK_TASKS;
    renderProjectFilters();
    applyFilters();
    if(syncNote) syncNote.textContent = "No data yet — Notion connection not active";
  }
}

loadData();
</script>
<script src="/sidebar.js"></script>
</body>
</html>
