<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tareas & Proyectos — Jarvis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0b10;
    --panel: #12141d;
    --panel-alt: #171a24;
    --border: rgba(201,169,97,0.14);
    --border-soft: rgba(255,255,255,0.06);
    --gold: #c9a961;
    --gold-bright: #e0c584;
    --gold-dim: rgba(201,169,97,0.14);
    --text: #f3f0e8;
    --text-dim: #9a9683;
    --text-faint: #67645a;
    --red: #e0636b;
    --red-dim: rgba(224,99,107,0.14);
    --amber: #e0a45c;
    --amber-dim: rgba(224,164,92,0.14);
    --green: #7cc99a;
    --green-dim: rgba(124,201,154,0.14);
    --blue: #7d9cc9;
    --blue-dim: rgba(125,156,201,0.14);
    --purple: #b491d9;
    --purple-dim: rgba(180,145,217,0.14);
    --pink: #d98cb0;
    --pink-dim: rgba(217,140,176,0.14);
    --radius: 14px;
    --serif: 'Fraunces', serif;
    --sans: 'Inter', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: radial-gradient(ellipse 1400px 900px at 15% -10%, #1a1710 0%, transparent 55%),
                radial-gradient(ellipse 1000px 700px at 100% 0%, #0f1420 0%, transparent 50%),
                var(--bg);
    color: var(--text); font-family: var(--sans); min-height:100vh; -webkit-font-smoothing: antialiased;
  }
  a{color:inherit; text-decoration:none;}
  button, select, input{font-family:inherit;}

  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:16px 28px; border-bottom:1px solid var(--border-soft); }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-mark{ width:38px; height:38px; border-radius:10px; background:var(--amber-dim); color:var(--amber);
    display:flex; align-items:center; justify-content:center; font-size:18px; }
  .brand-text h1{ font-family:var(--serif); font-weight:600; font-size:19px; }
  .brand-text p{ font-size:11.5px; color:var(--text-dim); }
  .topbar-actions{ display:flex; align-items:center; gap:12px; }
  .icon-btn{ width:36px; height:36px; border-radius:50%; background:var(--panel-alt); border:1px solid var(--border-soft);
    display:flex; align-items:center; justify-content:center; font-size:15px; cursor:pointer; }
  .add-btn{ background:var(--gold); color:#12141d; font-weight:700; font-size:12.5px; padding:9px 16px;
    border-radius:9px; cursor:pointer; }

  .shell{ max-width:920px; margin:0 auto; padding:24px 20px 60px; }

  .stat-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:20px; }
  .stat-card{ background:var(--panel); border:1px solid var(--border-soft); border-radius:var(--radius); padding:14px; }
  .stat-num{ font-family:var(--serif); font-size:24px; font-weight:600; }
  .stat-num.red{ color:var(--red); } .stat-num.amber{ color:var(--amber); } .stat-num.gold{ color:var(--gold-bright); }
  .stat-lbl{ font-size:10.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.4px; margin-top:2px; }

  .filters{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px; }
  .chip{ font-size:12px; padding:6px 12px; border-radius:20px; background:var(--panel); border:1px solid var(--border-soft);
    color:var(--text-dim); cursor:pointer; user-select:none; }
  .chip.active{ background:var(--gold-dim); border-color:var(--gold); color:var(--gold-bright); font-weight:600; }
  .filter-row2{ display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; }
  .select-filter{ background:var(--panel); border:1px solid var(--border-soft); color:var(--text-dim); font-size:12px;
    padding:6px 10px; border-radius:8px; }

  #quick-add{ display:none; background:var(--panel); border:1px solid var(--border-soft); border-radius:var(--radius);
    padding:16px; margin-bottom:18px; gap:10px; flex-wrap:wrap; align-items:center; }
  #quick-add.open{ display:flex; }
  #quick-add input[type=text]{ flex:1; min-width:180px; background:var(--panel-alt); border:1px solid var(--border-soft);
    color:var(--text); padding:9px 12px; border-radius:8px; font-size:13px; }
  #quick-add select, #quick-add input[type=date]{ background:var(--panel-alt); border:1px solid var(--border-soft);
    color:var(--text-dim); padding:9px 10px; border-radius:8px; font-size:12.5px; }
  #quick-add .save-btn{ background:var(--gold); color:#12141d; font-weight:700; font-size:12.5px; padding:9px 16px;
    border-radius:8px; cursor:pointer; }
  #quick-add .cancel-btn{ color:var(--text-faint); font-size:12px; cursor:pointer; padding:9px 6px; }

  .task-list{ display:flex; flex-direction:column; gap:8px; }
  .task-row{ display:flex; align-items:center; gap:12px; background:var(--panel); border:1px solid var(--border-soft);
    border-radius:11px; padding:12px 14px; }
  .task-row.overdue{ border-color:rgba(224,99,107,0.35); }
  .task-main{ flex:1; min-width:0; cursor:pointer; }
  .task-name{ font-size:13.5px; font-weight:500; }
  .task-name.done{ text-decoration:line-through; color:var(--text-faint); }
  .task-meta{ display:flex; gap:6px; align-items:center; margin-top:5px; flex-wrap:wrap; }
  .tag{ font-size:9.5px; font-weight:700; letter-spacing:0.3px; text-transform:uppercase; padding:2px 7px; border-radius:5px; }
  .tag.proj{ background:var(--blue-dim); color:var(--blue); }
  .tag.p0{ background:var(--red-dim); color:var(--red); }
  .tag.p1{ background:var(--amber-dim); color:var(--amber); }
  .tag.p2{ background:var(--gold-dim); color:var(--gold); }
  .tag.p3{ background:var(--panel-alt); color:var(--text-faint); }
  .tag.due{ background:var(--red-dim); color:var(--red); }
  .status-select{ font-size:11px; padding:6px 8px; border-radius:7px; border:1px solid var(--border-soft); cursor:pointer; }
  .status-select.st-No-iniciado, .status-select.st-Preparación{ background:var(--panel-alt); color:var(--text-dim); }
  .status-select.st-En-progreso{ background:var(--blue-dim); color:var(--blue); }
  .status-select.st-En-revisión, .status-select.st-En-validación{ background:var(--purple-dim); color:var(--purple); }
  .status-select.st-Bloqueado{ background:var(--red-dim); color:var(--red); }
  .status-select.st-Terminado{ background:var(--green-dim); color:var(--green); }
  .status-select.st-Cancelado{ background:var(--panel-alt); color:var(--text-faint); }

  .empty-state{ text-align:center; padding:40px 20px; color:var(--text-faint); font-size:13px; }
  #sync-note{ display:block; text-align:center; font-size:11px; color:var(--text-faint); margin-top:20px; }
  #result-count{ font-size:11.5px; color:var(--text-faint); margin-bottom:10px; }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">✅</div>
      <div class="brand-text">
        <h1>Tareas & Proyectos</h1>
        <p>Todo lo pendiente, en un solo lugar</p>
      </div>
    </div>
    <div class="topbar-actions">
      <div class="icon-btn" onclick="window.location.href='https://jarvis-dashboard-phi-one.vercel.app/'" title="Volver al inicio">🏠</div>
      <div class="add-btn" id="toggle-add-btn">+ Nueva Tarea</div>
    </div>
  </div>

  <div class="shell">
    <div class="stat-row" id="stat-row"></div>

    <div class="filters" id="project-filters"></div>
    <div class="filter-row2">
      <div class="chip active" data-due="all">Todas</div>
      <div class="chip" data-due="overdue">Vencidas</div>
      <div class="chip" data-due="today">Hoy</div>
      <div class="chip" data-due="blocked">Bloqueadas</div>
      <div class="chip" data-due="backlog">Backlog</div>
      <select class="select-filter" id="priority-filter">
        <option value="all">Toda prioridad</option>
        <option value="P0">P0</option>
        <option value="P1">P1</option>
        <option value="P2">P2</option>
        <option value="P3">P3</option>
      </select>
      <select class="select-filter" id="area-filter">
        <option value="all">Toda área</option>
      </select>
      <label class="chip" style="display:flex; align-items:center; gap:6px;">
        <input type="checkbox" id="show-done" style="cursor:pointer;"> Mostrar completadas
      </label>
    </div>

    <div id="quick-add">
      <input type="text" id="new-task-name" placeholder="Nombre de la tarea…">
      <select id="new-task-project"></select>
      <select id="new-task-priority">
        <option value="P0">P0</option>
        <option value="P1">P1</option>
        <option value="P2" selected>P2</option>
        <option value="P3">P3</option>
      </select>
      <input type="date" id="new-task-date">
      <div class="save-btn" id="save-task-btn">Guardar</div>
      <div class="cancel-btn" id="cancel-add-btn">Cancelar</div>
    </div>

    <div id="result-count"></div>
    <div class="task-list" id="task-list"></div>
    <span id="sync-note"></span>
  </div>

<script>
const PROJECTS = ["One Night Guest", "RoutePup", "Nikita", "StatStrike", "Personal", "Aristóteles", "Transversal", "Sin proyecto"];
const STATUS_OPTIONS = ["No iniciado","Preparación","En progreso","En revisión","En validación","Bloqueado","Terminado","Cancelado"];

// Only shown if the live Notion fetch fails — clearly marked as demo, never
// presented as real numbers.
const FALLBACK_TASKS = [];

let allTasks = [];
let activeProject = "all";
let activeDue = "all";

function priorityTag(p){
  const cls = { P0:"p0", P1:"p1", P2:"p2", P3:"p3" }[p] || "p3";
  return `<span class="tag ${cls}">${p}</span>`;
}

function statusClass(status){ return "st-" + status.replace(/\s+/g, "-").replace("ó","o").replace("é","e"); }

function renderStats(summary){
  const row = document.getElementById("stat-row");
  row.innerHTML = `
    <div class="stat-card"><div class="stat-num gold">${summary.total}</div><div class="stat-lbl">Total</div></div>
    <div class="stat-card"><div class="stat-num red">${summary.overdue}</div><div class="stat-lbl">Vencidas</div></div>
    <div class="stat-card"><div class="stat-num amber">${summary.dueToday}</div><div class="stat-lbl">Hoy</div></div>
    <div class="stat-card"><div class="stat-num red">${summary.blocked}</div><div class="stat-lbl">Bloqueadas</div></div>`;
}

// FIX (Aug 15): chip counts used to be a raw count over every task
// regardless of status — computed once at load and never updated. That's
// why "Sin proyecto (29)" showed only 1 task when clicked: 28 of those 29
// are cancelled tasks, correctly hidden by the "Mostrar completadas"
// filter in the actual list, but still counted in the frozen badge. Chip
// counts now use the exact same filter logic as the list itself (every
// filter except the project one, since we're counting per-project), and
// recompute every time any filter changes — so a chip's number always
// matches what clicking it actually shows.
function countsForCurrentFilters(){
  const showDone = document.getElementById("show-done").checked;
  const priority = document.getElementById("priority-filter").value;
  const counts = {};
  let allCount = 0;
  allTasks.forEach(t => {
    if(priority !== "all" && t.priority !== priority) return;
    if(!showDone && (t.status === "Terminado" || t.status === "Cancelado")) return;
    if(activeDue === "overdue" && !t.isOverdue) return;
    if(activeDue === "today" && !t.isDueToday) return;
    if(activeDue === "blocked" && t.status !== "Bloqueado") return;
    if(activeDue === "backlog" && t.status !== "No iniciado") return;
    counts[t.project] = (counts[t.project] || 0) + 1;
    allCount++;
  });
  return { counts, allCount };
}

function renderProjectFilters(){
  const el = document.getElementById("project-filters");
  const { counts, allCount } = countsForCurrentFilters();
  const chips = [["all", `Todas (${allCount})`], ...PROJECTS.map(p => [p, `${p} (${counts[p]||0})`])];
  el.innerHTML = chips.map(([key,label]) =>
    `<div class="chip ${activeProject===key?"active":""}" data-project="${key}">${label}</div>`
  ).join("");
  el.querySelectorAll(".chip").forEach(chip => {
    chip.addEventListener("click", () => { activeProject = chip.dataset.project; applyFilters(); });
  });
}

function applyFilters(){
  const today = new Date().toISOString().slice(0,10);
  const priority = document.getElementById("priority-filter").value;
  const areaFilter = document.getElementById("area-filter").value;
  const showDone = document.getElementById("show-done").checked;

  renderProjectFilters();
  renderAreaFilterOptions();

  let filtered = allTasks.filter(t => {
    if(activeProject !== "all" && t.project !== activeProject) return false;
    if(priority !== "all" && t.priority !== priority) return false;
    if(areaFilter !== "all" && t.area !== areaFilter) return false;
    if(!showDone && (t.status === "Terminado" || t.status === "Cancelado")) return false;
    if(activeDue === "overdue" && !t.isOverdue) return false;
    if(activeDue === "today" && !t.isDueToday) return false;
    if(activeDue === "blocked" && t.status !== "Bloqueado") return false;
    if(activeDue === "backlog" && t.status !== "No iniciado") return false;
    return true;
  });

  document.querySelectorAll("#project-filters .chip").forEach(c =>
    c.classList.toggle("active", c.dataset.project === activeProject));

  document.getElementById("result-count").textContent =
    `${filtered.length} de ${allTasks.length} tareas`;
  renderTaskList(filtered);
}

// Areas are scoped to whichever project is currently selected (an area
// name can repeat across projects) — so this rebuilds the dropdown's
// options to match the active project scope, using only real area names
// that actually appear on tasks right now, not an invented full list.
function renderAreaFilterOptions(){
  const sel = document.getElementById("area-filter");
  const prevValue = sel.value;
  const scoped = activeProject === "all" ? allTasks : allTasks.filter(t => t.project === activeProject);
  const areas = [...new Set(scoped.map(t => t.area).filter(Boolean))].sort();
  sel.innerHTML = `<option value="all">Toda área</option>` +
    areas.map(a => `<option value="${a}">${a}</option>`).join("");
  if(areas.includes(prevValue)) sel.value = prevValue;
}

function renderTaskList(tasks){
  const list = document.getElementById("task-list");
  if(!tasks.length){
    list.innerHTML = `<div class="empty-state">No hay tareas que coincidan con estos filtros.</div>`;
    return;
  }
  list.innerHTML = "";
  tasks.forEach(t => {
    const row = document.createElement("div");
    row.className = "task-row" + (t.isOverdue ? " overdue" : "");
    row.innerHTML = `
      <div class="task-main">
        <div class="task-name ${t.status==='Terminado'?'done':''}">${t.taskName || "(sin título)"}</div>
        <div class="task-meta">
          <span class="tag proj">${t.project}</span>
          ${t.area ? `<span class="tag" style="background:var(--panel-alt); color:var(--text-dim);">${t.area}</span>` : ""}
          ${priorityTag(t.priority)}
          ${t.targetDate ? `<span class="tag ${t.isOverdue?'due':'p3'}">${t.isOverdue?'Vencida ':''}${t.targetDate}</span>` : ""}
        </div>
      </div>
      <select class="status-select ${statusClass(t.status)}">
        ${STATUS_OPTIONS.map(s => `<option value="${s}" ${s===t.status?"selected":""}>${s}</option>`).join("")}
      </select>`;

    row.querySelector(".task-main").addEventListener("click", () => {
      window.location.href = t.notionUrl;
    });

    const sel = row.querySelector(".status-select");
    sel.addEventListener("click", (e) => e.stopPropagation());
    sel.addEventListener("change", async () => {
      const newStatus = sel.value;
      const prevClass = sel.className;
      try{
        const res = await fetch("/api/update-action", {
          method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify({ pageId: t.id, status: newStatus })
        });
        if(!res.ok) throw new Error("Update failed");
        t.status = newStatus;
        sel.className = "status-select " + statusClass(newStatus);
        applyFilters();
      }catch(e){
        sel.className = prevClass;
        alert("No se pudo actualizar en Notion: " + e.message);
      }
    });

    list.appendChild(row);
  });
}

document.querySelectorAll('.filter-row2 [data-due]').forEach(chip => {
  chip.addEventListener("click", () => {
    activeDue = chip.dataset.due;
    document.querySelectorAll('.filter-row2 [data-due]').forEach(c => c.classList.toggle("active", c===chip));
    applyFilters();
  });
});
document.getElementById("priority-filter").addEventListener("change", applyFilters);
document.getElementById("area-filter").addEventListener("change", applyFilters);
document.getElementById("show-done").addEventListener("change", applyFilters);

// ---- Quick add ----
const projectSelect = document.getElementById("new-task-project");
projectSelect.innerHTML = PROJECTS.map(p => `<option value="${p}">${p}</option>`).join("");

document.getElementById("toggle-add-btn").addEventListener("click", () => {
  document.getElementById("quick-add").classList.toggle("open");
});
document.getElementById("cancel-add-btn").addEventListener("click", () => {
  document.getElementById("quick-add").classList.remove("open");
});
document.getElementById("save-task-btn").addEventListener("click", async () => {
  const taskName = document.getElementById("new-task-name").value.trim();
  if(!taskName){ alert("Escribe un nombre para la tarea."); return; }
  const project = projectSelect.value;
  const priority = document.getElementById("new-task-priority").value;
  const targetDate = document.getElementById("new-task-date").value || undefined;
  const btn = document.getElementById("save-task-btn");
  const original = btn.textContent;
  btn.textContent = "Guardando…";
  try{
    const res = await fetch("/api/create-task", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ taskName, project, priority, targetDate })
    });
    if(!res.ok) throw new Error("No se pudo crear la tarea");
    document.getElementById("new-task-name").value = "";
    document.getElementById("quick-add").classList.remove("open");
    btn.textContent = original;
    loadData();
  }catch(e){
    btn.textContent = original;
    alert(e.message);
  }
});

async function loadData(){
  const syncNote = document.getElementById("sync-note");
  try{
    const res = await fetch("/api/tasks-data");
    if(!res.ok) throw new Error("API error " + res.status);
    const data = await res.json();
    allTasks = data.tasks || [];
    renderStats(data.summary);
    renderProjectFilters();
    applyFilters();
    if(syncNote) syncNote.textContent = "";
  }catch(err){
    console.warn("Live tasks data unavailable:", err.message);
    allTasks = FALLBACK_TASKS;
    renderStats({ total:0, overdue:0, dueToday:0, blocked:0 });
    renderProjectFilters();
    applyFilters();
    if(syncNote) syncNote.textContent = "No data yet — Notion connection not active";
  }
}

loadData();
</script>
</body>
</html>
