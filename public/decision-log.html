<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Decision Log — Jarvis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#08090d;--panel:#12141d;--panel2:#181b26;--line:rgba(255,255,255,.09);--gold:#d6b36b;--gold2:#f1ce8c;--text:#f7f4ec;--muted:#a7a397;--faint:#6e6b63;--red:#ed6c6a;--amber:#f1aa46;--green:#42d39a;--blue:#77a9ff;--serif:'Fraunces',serif;--sans:'Inter',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}body{background:radial-gradient(1100px 650px at 8% -8%,#211a22 0,transparent 58%),radial-gradient(1100px 700px at 100% 0,#101c2a 0,transparent 55%),var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh}button,select,input,textarea{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}
.main{width:100%;max-width:1240px;margin:0 auto;padding:22px 30px 70px}.workspace-banner{height:176px;border:1px solid var(--line);border-radius:17px;overflow:hidden;position:relative;background:url('/assets/covers/decision-log-cover-v2.jpg') center/cover;box-shadow:0 20px 50px rgba(0,0,0,.3);margin-bottom:22px}.workspace-banner:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(4,6,12,.9),rgba(4,6,12,.47) 48%,rgba(4,6,12,.15)),linear-gradient(0deg,rgba(4,6,12,.55),transparent 65%)}.banner-copy{position:absolute;z-index:1;inset:auto 28px 24px}.kicker{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold2);font-weight:800}.banner-copy h1{font:600 34px var(--serif);margin-top:7px}.banner-copy p{font-size:12px;color:#ddd7ca;margin-top:4px}.topline{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px}.topline h2{font:600 25px var(--serif)}.topline p{font-size:12px;color:var(--muted);margin-top:4px}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:rgba(18,20,29,.9);color:var(--text);border-radius:9px;padding:10px 14px;font-size:12px;font-weight:700;transition:.16s}.btn:hover{border-color:rgba(214,179,107,.55);transform:translateY(-1px)}.btn.primary{border:0;background:linear-gradient(145deg,var(--gold2),var(--gold));color:#191307}.btn.subtle{color:var(--muted)}
#quick-add{display:none;background:linear-gradient(145deg,rgba(24,27,38,.96),rgba(18,20,29,.96));border:1px solid rgba(214,179,107,.24);border-radius:14px;padding:15px;margin-bottom:16px;gap:9px;flex-wrap:wrap}.quick-open #quick-add{display:flex}#quick-add input,#quick-add select,#quick-add textarea{background:#0d1018;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:10px 11px;font-size:12px}#new-decision{flex:1;min-width:230px}#new-context{flex-basis:100%;min-height:58px;resize:vertical}.filter-bar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:18px}.filter-bar select{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:9px 11px;font-size:11.5px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}.stat{background:rgba(18,20,29,.82);border:1px solid var(--line);border-radius:12px;padding:13px 15px}.stat-label{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em}.stat-value{font:600 25px var(--serif);margin-top:4px}.stat.pending .stat-value{color:#c6c3bb}.stat.review .stat-value{color:var(--amber)}.stat.decided .stat-value{color:var(--green)}
.d-list{display:grid;gap:10px}.d-card{background:linear-gradient(145deg,rgba(24,27,38,.94),rgba(16,18,26,.94));border:1px solid var(--line);border-radius:14px;padding:17px 18px;cursor:pointer;transition:.16s;position:relative}.d-card:hover{border-color:rgba(214,179,107,.48);transform:translateY(-1px);box-shadow:0 12px 30px rgba(0,0,0,.18)}.d-top{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.d-title{font-size:14px;font-weight:700;flex:1;min-width:220px}.d-meta{font-size:11px;color:var(--faint);margin-top:8px}.tag{font-size:9px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:4px 8px;border-radius:5px}.tag.pending{background:rgba(150,150,150,.15);color:#bcb9b0}.tag.under-review{background:rgba(241,170,70,.16);color:var(--amber)}.tag.decided{background:rgba(66,211,154,.16);color:var(--green)}.tag.reversed{background:rgba(237,108,106,.16);color:var(--red)}.tag.impact-high{background:rgba(237,108,106,.16);color:var(--red)}.tag.impact-medium{background:rgba(241,170,70,.16);color:var(--amber)}.tag.impact-low{background:rgba(119,169,255,.14);color:var(--blue)}.empty-note{color:var(--faint);font-style:italic;text-align:center;padding:42px 0;font-size:13px}
#modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:100;align-items:center;justify-content:center;padding:20px}#modal{background:#12141d;border:1px solid rgba(214,179,107,.28);border-radius:16px;max-width:620px;width:100%;max-height:88vh;overflow:auto;padding:23px;box-shadow:0 24px 80px rgba(0,0,0,.5)}.modal-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.modal-head h2{font:600 21px var(--serif)}.close{background:none;border:0;color:var(--muted);font-size:20px}.field-lbl{display:block;color:var(--faint);font-size:10.5px;margin:15px 0 5px}.field-input{width:100%;background:#0d1018;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:10px;font-size:12.5px}.modal-actions{display:flex;gap:9px;margin-top:18px}.notion-link{font-size:11px;color:var(--gold2);display:inline-block;margin-top:13px}.notion-link:hover{text-decoration:underline}@media(max-width:800px){.main{padding:16px}.workspace-banner{height:145px}.banner-copy h1{font-size:28px}.topline{flex-direction:column}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:460px){.stats{grid-template-columns:1fr 1fr}.d-title{min-width:0}}

/* Exact Decision Log reference layout */
.main{width:min(100%,860px);max-width:860px;margin:0 auto;padding:20px 18px 70px}
.workspace-banner{height:128px;border-radius:12px;margin-bottom:16px;box-shadow:0 16px 38px rgba(0,0,0,.3)}
.workspace-banner:after{background:linear-gradient(90deg,rgba(4,6,12,.72),rgba(4,6,12,.18) 55%,rgba(4,6,12,.2)),linear-gradient(0deg,rgba(4,6,12,.35),transparent 60%)}
.banner-copy{left:18px;bottom:18px}.banner-copy h1,.banner-copy p{display:none}.kicker{font-size:9px}
.topline{margin-bottom:15px}.topline h2{font-size:25px}.topline p{font-size:11px}.btn{border-radius:7px;padding:8px 11px;font-size:10.5px}
.stats{display:none}.filter-bar{gap:8px;margin-bottom:12px}.filter-bar select{border-radius:6px;padding:8px 10px;font-size:10.5px;min-width:120px}
.d-list{gap:8px}.d-card{border-radius:10px;padding:12px 13px}.d-title{font-size:11.5px}.d-meta{font-size:9.5px;margin-top:5px}.tag{font-size:8px;padding:3px 6px;border-radius:4px}
@media(max-width:800px){.main{padding:16px}.workspace-banner{height:128px}.topline{flex-direction:row}.topline h2{font-size:22px}}
@media(max-width:520px){.topline{flex-direction:column}.actions{width:100%}.actions .btn{flex:1}.d-title{min-width:0}}
</style>
</head>
<body>
<main class="main" id="app">
<section class="workspace-banner"><div class="banner-copy"><div class="kicker">JARVIS · DECISION LOG</div><h1>Decision Log</h1><p>Decisiones pendientes y resueltas en todos tus proyectos.</p></div></section>
<header class="topline"><div><h2>Decision Log</h2><p>Decisiones pendientes y resueltas en todos tus proyectos.</p></div><div class="actions"><button class="btn" type="button" onclick="location.href='/'">⌂ Inicio</button><button class="btn primary" type="button" id="new-decision-btn">+ Nueva decisión</button></div></header>
<section id="quick-add"><input id="new-decision" type="text" placeholder="¿Qué se necesita decidir?…"><select id="new-impact"><option value="">Impacto</option><option value="High">Alto</option><option value="Medium">Medio</option><option value="Low">Bajo</option></select><textarea id="new-context" placeholder="Contexto breve (opcional)"></textarea><button class="btn primary" type="button" id="save-new">Guardar decisión</button><button class="btn subtle" type="button" id="cancel-new">Cancelar</button></section>
<section class="stats" id="stats"></section><section class="filter-bar" id="filter-bar"></section><section class="d-list" id="d-list"></section>
</main>
<div id="modal-backdrop"><section id="modal" role="dialog" aria-modal="true"></section></div>
<script>
const STATUS_OPTIONS=['Pending','Under review','Decided','Reversed'];
const STATUS_LABEL={Pending:'Pendiente','Under review':'En revisión',Decided:'Decidido',Reversed:'Revertido'};
const IMPACT_LABEL={High:'Alto',Medium:'Medio',Low:'Bajo'};
let allDecisions=[], filters={status:'all',impact:'all',area:'all'};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const statusClass=s=>(s||'Pending').toLowerCase().replace(/\s+/g,'-');
function toast(kind,msg){const t=window.jarvisToast;if(t?.[kind]) t[kind](null,msg); else if(kind==='error') alert(msg);}
function renderStats(){const c=s=>allDecisions.filter(d=>d.status===s).length;document.getElementById('stats').innerHTML=`<div class="stat"><div class="stat-label">Total decisiones</div><div class="stat-value">${allDecisions.length}</div></div><div class="stat pending"><div class="stat-label">Pendientes</div><div class="stat-value">${c('Pending')}</div></div><div class="stat review"><div class="stat-label">En revisión</div><div class="stat-value">${c('Under review')}</div></div><div class="stat decided"><div class="stat-label">Decididas</div><div class="stat-value">${c('Decided')}</div></div>`}
function renderFilterBar(){const areas=[...new Set(allDecisions.map(d=>d.area).filter(Boolean))].sort();document.getElementById('filter-bar').innerHTML=`<select id="f-status"><option value="all">Estado: Todos</option>${STATUS_OPTIONS.map(s=>`<option value="${s}" ${filters.status===s?'selected':''}>${STATUS_LABEL[s]}</option>`).join('')}</select><select id="f-impact"><option value="all">Impacto: Todos</option>${['High','Medium','Low'].map(x=>`<option value="${x}" ${filters.impact===x?'selected':''}>${IMPACT_LABEL[x]}</option>`).join('')}</select><select id="f-area"><option value="all">Área: Todas</option>${areas.map(a=>`<option value="${esc(a)}" ${filters.area===a?'selected':''}>${esc(a)}</option>`).join('')}</select>`;document.getElementById('f-status').onchange=e=>{filters.status=e.target.value;render()};document.getElementById('f-impact').onchange=e=>{filters.impact=e.target.value;render()};document.getElementById('f-area').onchange=e=>{filters.area=e.target.value;render()}}
function render(){renderStats();renderFilterBar();const filtered=allDecisions.filter(d=>(filters.status==='all'||d.status===filters.status)&&(filters.impact==='all'||d.impact===filters.impact)&&(filters.area==='all'||d.area===filters.area));const list=document.getElementById('d-list');if(!filtered.length){list.innerHTML='<div class="empty-note">No hay decisiones que coincidan con estos filtros.</div>';return}list.innerHTML=filtered.map(d=>`<article class="d-card" data-id="${esc(d.id)}"><div class="d-top"><div class="d-title">${esc(d.decision)||'Sin título'}</div><span class="tag ${statusClass(d.status)}">${esc(STATUS_LABEL[d.status]||d.status)}</span>${d.impact?`<span class="tag impact-${d.impact.toLowerCase()}">${esc(IMPACT_LABEL[d.impact]||d.impact)}</span>`:''}</div><div class="d-meta">${d.area?esc(d.area)+' · ':''}${d.date?esc(d.date):'Sin fecha'}</div></article>`).join('');list.querySelectorAll('.d-card').forEach(c=>c.onclick=()=>openDetail(c.dataset.id))}
function openDetail(id){const d=allDecisions.find(x=>x.id===id);if(!d)return;document.getElementById('modal-backdrop').style.display='flex';document.getElementById('modal').innerHTML=`<div class="modal-head"><h2>${esc(d.decision)}</h2><button class="close" type="button" onclick="closeModal()">×</button></div><label class="field-lbl">Estado</label><select class="field-input" id="m-status">${STATUS_OPTIONS.map(s=>`<option value="${s}" ${s===d.status?'selected':''}>${STATUS_LABEL[s]}</option>`).join('')}</select><label class="field-lbl">Impacto</label><select class="field-input" id="m-impact"><option value="">Sin definir</option>${['High','Medium','Low'].map(x=>`<option value="${x}" ${d.impact===x?'selected':''}>${IMPACT_LABEL[x]}</option>`).join('')}</select><label class="field-lbl">Contexto</label><textarea class="field-input" id="m-context" rows="4">${esc(d.context)}</textarea><label class="field-lbl">Opciones consideradas</label><textarea class="field-input" id="m-options" rows="3">${esc(d.optionsConsidered)}</textarea><label class="field-lbl">Decisión final</label><textarea class="field-input" id="m-final" rows="4">${esc(d.finalDecision)}</textarea><a class="notion-link" href="${esc(d.notionUrl||'#')}" target="_blank" rel="noopener">Abrir esta decisión en Notion ↗</a><div class="modal-actions"><button class="btn primary" type="button" onclick="saveDetail('${esc(id)}')">Guardar cambios</button><button class="btn" type="button" onclick="closeModal()">Cerrar</button></div>`}
function closeModal(){document.getElementById('modal-backdrop').style.display='none'}
document.getElementById('modal-backdrop').onclick=e=>{if(e.target.id==='modal-backdrop')closeModal()};
async function saveDetail(id){try{const r=await fetch('/api/task-api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'update-decision',pageId:id,status:document.getElementById('m-status').value,impact:document.getElementById('m-impact').value,context:document.getElementById('m-context').value,optionsConsidered:document.getElementById('m-options').value,finalDecision:document.getElementById('m-final').value})});const data=await r.json();if(!r.ok||data.error)throw new Error(data.error||'Error '+r.status);closeModal();await loadData();toast('success','Decisión guardada')}catch(e){toast('error','No se pudo guardar: '+e.message)}}
async function submitNewDecision(){const decision=document.getElementById('new-decision').value.trim();if(!decision){alert('Escribe la decisión a tomar.');return}try{const r=await fetch('/api/task-api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'create-decision',decision,impact:document.getElementById('new-impact').value,context:document.getElementById('new-context').value})});const data=await r.json();if(!r.ok||data.error)throw new Error(data.error||'Error '+r.status);document.getElementById('new-decision').value='';document.getElementById('new-context').value='';document.getElementById('quick-add').classList.remove('open');await loadData();toast('success','Decisión creada')}catch(e){toast('error','No se pudo crear: '+e.message)}}
async function loadData(){const list=document.getElementById('d-list');list.innerHTML='<div class="empty-note">Cargando decisiones desde Notion…</div>';try{const r=await fetch('/api/task-api?action=decisions',{cache:'no-store'});const data=await r.json();if(!r.ok||data.error)throw new Error(data.error||'Error '+r.status);allDecisions=data.decisions||[];render()}catch(e){allDecisions=[];render();list.innerHTML=`<div class="empty-note">No se pudo conectar con Notion: ${esc(e.message)}</div>`}}
document.getElementById('new-decision-btn').onclick=()=>document.getElementById('quick-add').classList.toggle('open');document.getElementById('cancel-new').onclick=()=>document.getElementById('quick-add').classList.remove('open');document.getElementById('save-new').onclick=submitNewDecision;loadData();
</script><script src="/toast.js"></script><script src="/sidebar.js"></script>
</body></html>
