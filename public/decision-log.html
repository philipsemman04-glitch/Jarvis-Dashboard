<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Decision Log — Jarvis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#08090d; --panel:#12141d; --panel-alt:#1a1d29;
    --border-soft:rgba(255,255,255,0.09); --gold:#d4af6a; --gold-bright:#f0cd8e; --gold-dim:rgba(212,175,106,0.16);
    --text:#f8f6f0; --text-dim:#a8a496; --text-faint:#6f6c62;
    --red:#e8615f; --red-dim:rgba(232,97,95,0.18);
    --amber:#f2a13d; --amber-dim:rgba(242,161,61,0.18);
    --green:#3ecf8e; --green-dim:rgba(62,207,142,0.18);
    --gray-dim:rgba(154,150,131,0.14);
    --radius:14px; --serif:'Fraunces',serif; --sans:'Inter',sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:radial-gradient(ellipse 1400px 900px at 15% -10%, #181420 0%, transparent 55%),
        radial-gradient(ellipse 1100px 800px at 100% 0%, #101a26 0%, transparent 50%), var(--bg);
        color:var(--text); font-family:var(--sans); min-height:100vh; -webkit-font-smoothing:antialiased; }
  a{color:inherit; text-decoration:none;} button,select,input,textarea{font-family:inherit; cursor:pointer;}

  .main{ padding:22px 26px 60px; max-width:900px; margin:0 auto; }
  .page-head{ display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:18px; flex-wrap:wrap; gap:10px;}
  .page-head h2{ font-family:var(--serif); font-size:22px; font-weight:600;}
  .page-head p{ font-size:12px; color:var(--text-dim); margin-top:3px;}
  .head-actions{ display:flex; align-items:center; gap:8px;}
  .head-btn{ background:var(--panel); border:1px solid var(--border-soft); color:var(--text); font-weight:600; font-size:12px;
    padding:9px 14px; border-radius:8px; }
  .head-btn.primary{ background:linear-gradient(155deg,var(--gold-bright),var(--gold)); color:#181205; border:none;}

  #quick-add{ display:none; background:var(--panel); border:1px solid var(--border-soft); border-radius:12px;
    padding:14px; margin-bottom:16px; gap:8px; flex-wrap:wrap; align-items:center; }
  #quick-add.open{ display:flex; }
  #quick-add input[type=text]{ flex:1; min-width:220px; background:var(--panel-alt); border:1px solid var(--border-soft);
    color:var(--text); padding:9px 12px; border-radius:8px; font-size:13px; }
  #quick-add select{ background:var(--panel-alt); border:1px solid var(--border-soft); color:var(--text-dim);
    padding:9px 10px; border-radius:8px; font-size:12.5px; }
  #quick-add .save-btn{ background:var(--gold); color:#181205; font-weight:700; font-size:12.5px; padding:9px 16px; border-radius:8px; }

  .filter-bar{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  .filter-bar select{ background:var(--panel); border:1px solid var(--border-soft); color:var(--text-dim);
    font-size:11.5px; padding:7px 9px; border-radius:7px; }

  .d-list{ display:flex; flex-direction:column; gap:10px; }
  .d-card{ background:var(--panel); border:1px solid var(--border-soft); border-radius:12px; padding:14px 16px; cursor:pointer; }
  .d-top{ display:flex; align-items:center; gap:8px; margin-bottom:6px; flex-wrap:wrap; }
  .d-title{ font-weight:600; font-size:13.5px; flex:1; }
  .tag{ font-size:9.5px; font-weight:700; letter-spacing:0.3px; text-transform:uppercase; padding:2px 8px; border-radius:5px; }
  .tag.pending{ background:var(--gray-dim); color:var(--text-faint); }
  .tag.under-review{ background:var(--amber-dim); color:var(--amber); }
  .tag.decided{ background:var(--green-dim); color:var(--green); }
  .tag.reversed{ background:var(--red-dim); color:var(--red); }
  .tag.impact-high{ background:var(--red-dim); color:var(--red); }
  .tag.impact-medium{ background:var(--amber-dim); color:var(--amber); }
  .tag.impact-low{ background:var(--gray-dim); color:var(--text-faint); }
  .d-meta{ font-size:11px; color:var(--text-faint); }
  .empty-note{ font-size:12.5px; color:var(--text-faint); font-style:italic; text-align:center; padding:30px 0; }

  #modal-backdrop{ display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:100; align-items:center; justify-content:center; padding:20px;}
  #modal{ background:var(--panel); border:1px solid var(--border-soft); border-radius:16px; max-width:560px; width:100%; max-height:85vh; overflow-y:auto; padding:24px;}
  .field-lbl{ font-size:10.5px; color:var(--text-faint); display:block; margin-bottom:4px; margin-top:14px;}
  .field-input{ width:100%; background:var(--panel-alt); border:1px solid var(--border-soft); color:var(--text); padding:9px; border-radius:8px; font-size:12.5px;}
</style>
</head>
<body>
<div class="main">
  <div class="page-head">
    <div><h2>🧠 Decision Log</h2><p>Decisiones pendientes y resueltas en todos los proyectos.</p></div>
    <div class="head-actions">
      <div class="head-btn" onclick="window.location.href='/'">🏠 Inicio</div>
      <div class="head-btn primary" onclick="document.getElementById('quick-add').classList.toggle('open')">+ Nueva Decisión</div>
    </div>
  </div>

  <div id="quick-add">
    <input type="text" id="new-decision" placeholder="¿Qué se necesita decidir?…">
    <select id="new-impact"><option value="">Impacto</option><option value="High">Alto</option><option value="Medium">Medio</option><option value="Low">Bajo</option></select>
    <div class="save-btn" onclick="submitNewDecision()">Guardar</div>
  </div>

  <div class="filter-bar" id="filter-bar"></div>
  <div class="d-list" id="d-list"></div>
</div>

<div id="modal-backdrop"><div id="modal"></div></div>

<script>
const STATUS_OPTIONS = ["Pending","Under review","Decided","Reversed"];
const STATUS_LABEL = { Pending:"Pendiente", "Under review":"En revisión", Decided:"Decidido", Reversed:"Revertido" };
let allDecisions = [];
let filters = { status:"all", impact:"all", area:"all" };

function emptyNote(t){ return `<div class="empty-note">${t}</div>`; }
function statusClass(s){ return (s||"Pending").toLowerCase().replace(/\s+/g,"-"); }

function renderFilterBar(){
  const areas = [...new Set(allDecisions.map(d=>d.area).filter(Boolean))].sort();
  document.getElementById("filter-bar").innerHTML = `
    <select id="f-status"><option value="all">Estado: Todos</option>${STATUS_OPTIONS.map(s=>`<option value="${s}" ${filters.status===s?"selected":""}>${STATUS_LABEL[s]}</option>`).join("")}</select>
    <select id="f-impact"><option value="all">Impacto: Todos</option><option value="High" ${filters.impact==="High"?"selected":""}>Alto</option><option value="Medium" ${filters.impact==="Medium"?"selected":""}>Medio</option><option value="Low" ${filters.impact==="Low"?"selected":""}>Bajo</option></select>
    <select id="f-area"><option value="all">Área: Todas</option>${areas.map(a=>`<option value="${a}" ${filters.area===a?"selected":""}>${a}</option>`).join("")}</select>`;
  document.getElementById("f-status").addEventListener("change", e=>{ filters.status=e.target.value; render(); });
  document.getElementById("f-impact").addEventListener("change", e=>{ filters.impact=e.target.value; render(); });
  document.getElementById("f-area").addEventListener("change", e=>{ filters.area=e.target.value; render(); });
}

function render(){
  const list = document.getElementById("d-list");
  const filtered = allDecisions.filter(d => {
    if(filters.status!=="all" && d.status!==filters.status) return false;
    if(filters.impact!=="all" && d.impact!==filters.impact) return false;
    if(filters.area!=="all" && d.area!==filters.area) return false;
    return true;
  });
  if(!filtered.length){ list.innerHTML = emptyNote("Sin decisiones que coincidan."); return; }
  list.innerHTML = filtered.map(d => `
    <div class="d-card" data-id="${d.id}">
      <div class="d-top">
        <span class="d-title">${d.decision}</span>
        <span class="tag ${statusClass(d.status)}">${STATUS_LABEL[d.status]||d.status}</span>
        ${d.impact ? `<span class="tag impact-${d.impact.toLowerCase()}">${d.impact==='High'?'Alto':d.impact==='Medium'?'Medio':'Bajo'}</span>` : ""}
      </div>
      <div class="d-meta">${d.area ? d.area + " · " : ""}${d.date || "Sin fecha"}</div>
    </div>`).join("");
  list.querySelectorAll(".d-card").forEach(c => c.addEventListener("click", () => openDetail(c.dataset.id)));
}

function openDetail(id){
  const d = allDecisions.find(x => x.id === id);
  if(!d) return;
  document.getElementById("modal-backdrop").style.display = "flex";
  document.getElementById("modal").innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:flex-start;">
      <h2 style="font-family:var(--serif); font-size:18px; flex:1;">${d.decision}</h2>
      <span style="cursor:pointer; color:var(--text-faint); font-size:18px;" onclick="closeModal()">✕</span>
    </div>
    <label class="field-lbl">Estado</label>
    <select class="field-input" id="m-status">${STATUS_OPTIONS.map(s=>`<option value="${s}" ${s===d.status?"selected":""}>${STATUS_LABEL[s]}</option>`).join("")}</select>
    <label class="field-lbl">Impacto</label>
    <select class="field-input" id="m-impact"><option value="">Sin definir</option><option value="High" ${d.impact==='High'?"selected":""}>Alto</option><option value="Medium" ${d.impact==='Medium'?"selected":""}>Medio</option><option value="Low" ${d.impact==='Low'?"selected":""}>Bajo</option></select>
    <label class="field-lbl">Contexto</label>
    <textarea class="field-input" id="m-context" rows="3">${d.context||""}</textarea>
    <label class="field-lbl">Decisión final</label>
    <textarea class="field-input" id="m-final" rows="3">${d.finalDecision||""}</textarea>
    <div style="display:flex; gap:10px; margin-top:16px;">
      <div class="head-btn primary" style="flex:1; text-align:center;" onclick="saveDetail('${id}')">Guardar</div>
      <div class="head-btn" onclick="closeModal()">Cerrar</div>
    </div>`;
}
function closeModal(){ document.getElementById("modal-backdrop").style.display = "none"; }
document.getElementById("modal-backdrop").addEventListener("click", e => { if(e.target.id==="modal-backdrop") closeModal(); });

async function saveDetail(id){
  const t = window.jarvisToast?.loading("Guardando…");
  try{
    const r = await fetch("/api/task-api", { method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ action:"update-decision", pageId:id,
        status: document.getElementById("m-status").value,
        impact: document.getElementById("m-impact").value,
        context: document.getElementById("m-context").value,
        finalDecision: document.getElementById("m-final").value }) });
    if(!r.ok) throw new Error("Error " + r.status);
    window.jarvisToast?.success(t, "Guardado");
    closeModal();
    loadData();
  }catch(e){ window.jarvisToast?.error(t, "No se pudo guardar: " + e.message); }
}

async function submitNewDecision(){
  const decision = document.getElementById("new-decision").value.trim();
  if(!decision){ alert("Escribe la decisión a tomar."); return; }
  const impact = document.getElementById("new-impact").value;
  const t = window.jarvisToast?.loading("Creando…");
  try{
    const r = await fetch("/api/task-api", { method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ action:"create-decision", decision, impact }) });
    if(!r.ok) throw new Error("Error " + r.status);
    window.jarvisToast?.success(t, "Decisión creada");
    document.getElementById("new-decision").value = "";
    document.getElementById("quick-add").classList.remove("open");
    loadData();
  }catch(e){ window.jarvisToast?.error(t, "No se pudo crear: " + e.message); }
}

async function loadData(){
  try{
    const res = await fetch("/api/task-api?action=decisions");
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    allDecisions = data.decisions || [];
  }catch(e){
    console.warn("Decision Log data unavailable:", e.message);
    allDecisions = [];
  }
  renderFilterBar();
  render();
}
loadData();
</script>
<script src="/toast.js"></script>
<script src="/sidebar.js"></script>
</body>
</html>
