<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0b10;
    --panel: #12141d;
    --panel-alt: #171a24;
    --border-soft: rgba(255,255,255,0.06);
    --gold: #c9a961;
    --gold-bright: #e0c584;
    --gold-dim: rgba(201,169,97,0.14);
    --text: #f3f0e8;
    --text-dim: #9a9683;
    --text-faint: #67645a;
    --serif: 'Fraunces', serif;
    --sans: 'Inter', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: radial-gradient(ellipse 1400px 900px at 15% -10%, #1a1710 0%, transparent 55%),
                radial-gradient(ellipse 1000px 700px at 100% 0%, #0f1420 0%, transparent 50%),
                var(--bg);
    color: var(--text); font-family: var(--sans); min-height:100vh;
    -webkit-font-smoothing: antialiased;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  a{color:inherit; text-decoration:none;}
  .card{ max-width:420px; text-align:center; }
  .icon-box{
    width:64px; height:64px; border-radius:16px; background:var(--gold-dim); margin:0 auto 20px;
    display:flex; align-items:center; justify-content:center; font-size:30px;
  }
  h1{ font-family:var(--serif); font-size:24px; color:var(--gold-bright); margin-bottom:10px; }
  p{ color:var(--text-dim); font-size:14px; line-height:1.6; margin-bottom:28px; }
  .home-btn{
    display:inline-flex; align-items:center; gap:8px; padding:12px 22px; border-radius:10px;
    background:var(--panel); border:1px solid var(--border-soft); color:var(--text);
    font-weight:600; font-size:13px; cursor:pointer; transition:border-color 0.15s;
  }
  .home-btn:hover{ border-color:var(--gold); }
</style>
</head>
<body>
  <div class="card">
    <div class="icon-box" id="ws-icon">🛠️</div>
    <h1 id="ws-name">Este workspace</h1>
    <p>Este dashboard todavía está en construcción — pronto tendrá su propia vista con datos en vivo de Notion.</p>
    <div class="home-btn" onclick="window.location.href='/'">🏠 Volver al inicio</div>
  </div>

<script>
  // Reads ?name=...&icon=... so the same page can represent any not-yet-built
  // workspace without duplicating this file per project.
  const params = new URLSearchParams(window.location.search);
  const name = params.get("name");
  const icon = params.get("icon");
  if(name) document.getElementById("ws-name").textContent = name;
  if(icon) document.getElementById("ws-icon").textContent = icon;
</script>
</body>
</html>
