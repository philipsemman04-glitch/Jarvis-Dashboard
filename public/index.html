<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="google" content="notranslate"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jarvis — Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#05070b;--panel:#0d1119;--line:rgba(255,255,255,.1);--gold:#d5aa5d;--gold2:#f1cc84;--text:#f5f2ea;--muted:#a7a9b0;--faint:#6e7480;--serif:Fraunces,Georgia,serif;--sans:Inter,system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 75% -10%,#17203355,transparent),#05070b;color:var(--text);font-family:var(--sans);min-height:100vh}button{font:inherit;cursor:pointer}a{text-decoration:none;color:inherit}
.main{max-width:1550px;margin:auto;padding:20px 24px 60px}.topbar{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-bottom:12px}.circle{width:42px;height:42px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;background:#101520;color:#dfe3ea}.top-btn{border:1px solid var(--line);background:#0e131d;color:var(--text);border-radius:10px;padding:10px 14px;font-weight:700;font-size:12px}.primary{background:linear-gradient(135deg,#ebc476,#c89442);border:0;color:#201607}
.hero{min-height:310px;border-radius:20px;border:1px solid rgba(213,170,93,.3);overflow:hidden;position:relative;background:linear-gradient(90deg,rgba(5,7,11,.95) 0%,rgba(5,7,11,.65) 35%,rgba(5,7,11,.05) 75%),url('/assets/covers/jarvis-hero.jpg') center/cover;display:flex;align-items:flex-end;padding:28px 36px;margin-bottom:26px;box-shadow:0 24px 70px #0008}.hero-copy{max-width:500px}.eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold2);font-weight:800}.hero h1{font-family:var(--serif);font-size:38px;margin:10px 0 5px}.hero p{font-size:14px;color:#d8d7d2;margin:0}.edit{position:absolute;right:18px;top:18px;width:38px;height:38px;border-radius:50%;border:1px solid rgba(213,170,93,.5);background:#05070b99;color:var(--gold2)}
.section-head{margin:0 0 14px}.section-head h2{font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold2);margin:0 0 5px}.section-head p{font-size:12px;color:var(--muted);margin:0}.cards{display:grid;gap:14px}.ws-card{min-height:158px;border-radius:16px;border:1px solid var(--line);overflow:hidden;position:relative;background:#0b1018;display:flex;align-items:center;padding:20px 24px;isolation:isolate;cursor:pointer;transition:.18s}.ws-card:hover{transform:translateY(-2px);border-color:rgba(213,170,93,.55);box-shadow:0 14px 34px #0007}.ws-card:before{content:"";position:absolute;inset:0;z-index:-2;background-image:var(--cover);background-size:cover;background-position:center}.ws-card:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,#070a10f5 0%,#070a10dc 34%,#070a1088 65%,#070a1033 100%)}.ws-logo{width:106px;height:106px;border-radius:50%;border:2px solid var(--accent);display:grid;place-items:center;flex-shrink:0;background:#05070bdd;box-shadow:0 0 0 7px #05070b33,0 0 28px var(--accent);font-size:42px}.ws-logo span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:800;text-align:center}.ws-content{margin-left:22px;max-width:620px}.ws-title{display:flex;align-items:center;gap:10px}.ws-title h3{font-family:var(--serif);font-size:25px;margin:0}.badge{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:#d7dbe4;background:#ffffff14;border:1px solid #ffffff1f;border-radius:5px;padding:4px 7px}.ws-desc{font-size:12px;color:#d0d1d0;margin-top:6px}.ws-stat{font-size:12px;font-weight:700;color:var(--accent);margin-top:10px}.ws-edit{position:absolute;right:20px;bottom:20px;width:36px;height:36px;border:1px solid var(--accent);border-radius:50%;background:#05070b99;color:var(--accent)}.empty{padding:30px;text-align:center;color:var(--faint);border:1px dashed var(--line);border-radius:14px}.sync{text-align:center;display:block;color:var(--faint);font-size:11px;margin-top:18px}
@media(max-width:760px){.main{padding:14px 12px 44px}.hero{min-height:260px;padding:22px}.hero h1{font-size:29px}.ws-card{min-height:142px;padding:16px}.ws-logo{width:78px;height:78px;font-size:29px}.ws-content{margin-left:14px}.ws-title h3{font-size:20px}.ws-edit{right:12px;bottom:12px}.ws-desc{max-width:75%}}
</style>
</head>
<body>
<main class="main">
  <div class="topbar"><button class="circle" title="Perfil">●</button><button class="circle" onclick="location.reload()" title="Actualizar">⟳</button><button class="top-btn primary" onclick="location.href='/tareas-proyectos.html'">＋ Nueva Tarea</button></div>
  <section class="hero"><button class="edit" onclick="window.jarvisToast?.error(null,'La edición de portada estará disponible pronto.')">✎</button><div class="hero-copy"><div class="eyebrow">Jarvis · Command Center</div><h1>Hola, Aurelio</h1><p>“Organiza tu mundo. Optimiza tu vida.”</p></div></section>
  <div class="section-head"><h2>Elige un workspace</h2><p>Todos tus negocios, sistemas y herramientas en un solo lugar.</p></div>
  <section class="cards" id="card-list"></section>
  <button class="top-btn" id="add-card" style="margin-top:14px;width:100%;border-style:dashed;color:var(--gold2)">＋ Agregar nuevo workspace</button>
  <span class="sync" id="sync-note"></span>
</main>
<script>
const FALLBACK=[
{name:'One Night Guest',icon:'🏛️',description:'Plataforma de servicios y locaciones para eventos.',statLabel:'187 tareas activas',route:'/ong-command-center.html',accentColor:'Gold',status:'Live'},
{name:'RoutePup',icon:'🐾',description:'Plataforma logística para paseadores y dueños de perros.',statLabel:'73 tarjetas · 1 tareas activas',route:'/project-command-center.html?project=routepup',accentColor:'Teal',status:'Live'},
{name:'StatStrike',icon:'▥',description:'Análisis y visualización de datos inteligentes.',statLabel:'Sin tareas activas aún',route:'/project-command-center.html?project=statstrike',accentColor:'Green',status:'Live'},
{name:'Nikita',icon:'♙',description:'Personaje de IA y contenido.',statLabel:'Sin tareas activas aún',route:'/project-command-center.html?project=nikita',accentColor:'Purple',status:'Live'},
{name:'Aristóteles',icon:'🦉',description:'Sistema de contexto personal, autobiografía y filosofía.',statLabel:'33 documentos reales',route:'/aristoteles.html',accentColor:'Orange',status:'Live'},
{name:'Personal OS',icon:'OS',description:'Hábitos, rutina, metas y desarrollo personal.',statLabel:'Sin tareas pendientes',route:'/personal-os.html',accentColor:'Pink',status:'Live'}];
const COLORS={Gold:'#d5aa5d',Teal:'#45b8d2',Green:'#8acb4a',Purple:'#b16dea',Orange:'#e7a34f',Pink:'#e56a9b',Blue:'#5b91f2',Gray:'#a2a6af'};
	const COVERS={
	'One Night Guest':'/assets/covers/ong-cover-v2.jpg','RoutePup':'/assets/covers/routepup-cover-v2.jpg','StatStrike':'/assets/covers/statstrike-cover-v2.jpg','Nikita':'/assets/covers/nikita-cover-v2.jpg','Aristóteles':'/assets/covers/aristoteles-cover-v2.jpg','Personal OS':'/assets/covers/personal-os-cover-v2.jpg','Tareas & Proyectos':'/assets/covers/tareas-proyectos-cover-v2.jpg','Mis Gustos & Conocimiento':'/assets/covers/mis-gustos-aprendizajes-cover-v2.jpg','Decision Log':'/assets/covers/decision-log-cover-v2.jpg','Meetings':'/assets/covers/meetings-cover-v2.jpg','Calendario':'/assets/covers/calendario-cover-v2.jpg','Sistemas & Ajustes':'/assets/covers/sistemas-ajustes-cover-v2.jpg'};
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
	function renderCard(ws){const accent=COLORS[ws.accentColor]||COLORS.Gray, name=escapeHtml(ws.name), icon=escapeHtml(ws.icon||'◈'), route=ws.route||'';const card=document.createElement('article');card.className='ws-card';card.style.setProperty('--accent',accent);card.style.setProperty('--cover',`url("${COVERS[ws.name]||''}")`);card.innerHTML=`<div class="ws-logo" aria-label="${name}">${icon}</div><div class="ws-content"><div class="ws-title"><h3>${name}</h3>${ws.status==='Coming soon'?'<span class="badge">Próximamente</span>':''}</div><div class="ws-desc">${escapeHtml(ws.description||'')}</div><div class="ws-stat">${escapeHtml(ws.statLabel||'Sin tareas pendientes')}</div></div><button class="ws-edit" title="Editar workspace" onclick="event.stopPropagation(); window.jarvisToast?.error(null,'La edición del workspace se hará desde Notion.')">✎</button>`;card.addEventListener('click',()=>{if(route) location.href=route;else location.href='/coming-soon.html?name='+encodeURIComponent(ws.name)});return card}
function render(list){const el=document.getElementById('card-list');el.innerHTML='';list.forEach(ws=>el.appendChild(renderCard(ws)))}
async function load(){try{const r=await fetch('/api/workspaces-data');if(!r.ok)throw Error(r.status);const d=await r.json();if(!d.workspaces?.length)throw Error('empty');render(d.workspaces);document.getElementById('sync-note').textContent=''}catch(e){render(FALLBACK);document.getElementById('sync-note').textContent='Vista de respaldo · Notion no disponible'}}
document.getElementById('add-card').onclick=()=>location.href='/new-project.html';load();
</script><script src="/toast.js"></script><script src="/sidebar.js"></script>
</body></html>
