<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0b10;
    --panel: #12141d;
    --panel-alt: #171a24;
    --border: rgba(201,169,97,0.14);
    --border-soft: rgba(255,255,255,0.06);
    --gold: #c9a961;
    --gold-bright: #e0c584;
    --gold-dim: rgba(201,169,97,0.14);
    --text: #f3f0e8;
    --text-dim: #9a9683;
    --text-faint: #67645a;
    --green: #7cc99a;
    --green-dim: rgba(124,201,154,0.14);
    --blue: #7d9cc9;
    --blue-dim: rgba(125,156,201,0.14);
    --teal: #6cc2c4;
    --teal-dim: rgba(108,194,196,0.14);
    --purple: #b491d9;
    --purple-dim: rgba(180,145,217,0.14);
    --orange: #e0a45c;
    --orange-dim: rgba(224,164,92,0.14);
    --gray: #9a9683;
    --gray-dim: rgba(154,150,131,0.14);
    --radius: 16px;
    --serif: 'Fraunces', serif;
    --sans: 'Inter', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: radial-gradient(ellipse 1400px 900px at 15% -10%, #1a1710 0%, transparent 55%),
                radial-gradient(ellipse 1000px 700px at 100% 0%, #0f1420 0%, transparent 50%),
                var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  a{color:inherit; text-decoration:none;}

  .shell{ max-width:640px; margin:0 auto; padding:20px 18px 60px; }

  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:8px 4px 22px; }
  .brand{ text-align:center; flex:1; }
  .brand h1{ font-family:var(--serif); font-weight:600; font-size:26px; color:var(--gold-bright); letter-spacing:0.5px; }
  .brand p{ font-size:12px; color:var(--text-dim); margin-top:2px; }
  .avatar{ width:36px; height:36px; border-radius:50%; background:var(--panel-alt); border:1px solid var(--border-soft);
    display:flex; align-items:center; justify-content:center; font-size:16px; }
  .settings-btn{ width:36px; height:36px; border-radius:50%; background:var(--panel-alt); border:1px solid var(--border-soft);
    display:flex; align-items:center; justify-content:center; font-size:15px; cursor:pointer; }

  .section-label{ font-size:11px; font-weight:700; letter-spacing:1px; color:var(--gold); text-transform:uppercase; margin:4px 0 2px; }
  .section-sub{ font-size:12px; color:var(--text-faint); margin-bottom:16px; }

  .card-list{ display:flex; flex-direction:column; gap:10px; }

  .ws-card{
    display:flex; align-items:center; gap:14px; background:var(--panel); border:1px solid var(--border-soft);
    border-radius:var(--radius); padding:14px; cursor:pointer; transition:border-color 0.15s, transform 0.1s;
  }
  .ws-card:hover{ border-color:var(--border); transform:translateY(-1px); }
  .ws-card.coming-soon{ opacity:0.72; }

  .ws-icon{
    width:48px; height:48px; border-radius:12px; display:flex; align-items:center; justify-content:center;
    font-size:22px; flex-shrink:0;
  }
  .ws-icon.gold{ background:var(--gold-dim); }
  .ws-icon.teal{ background:var(--teal-dim); }
  .ws-icon.green{ background:var(--green-dim); }
  .ws-icon.purple{ background:var(--purple-dim); }
  .ws-icon.orange{ background:var(--orange-dim); }
  .ws-icon.blue{ background:var(--blue-dim); }
  .ws-icon.gray{ background:var(--gray-dim); }

  .ws-body{ flex:1; min-width:0; }
  .ws-name-row{ display:flex; align-items:center; gap:8px; }
  .ws-name{ font-weight:600; font-size:15px; color:var(--text); }
  .ws-badge{ font-size:9px; font-weight:700; letter-spacing:0.4px; text-transform:uppercase; padding:2px 6px;
    border-radius:4px; background:var(--gray-dim); color:var(--text-faint); }
  .ws-desc{ font-size:12.5px; color:var(--text-dim); margin-top:2px; line-height:1.4;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ws-stat-row{ display:flex; align-items:center; gap:6px; margin-top:6px; font-size:11.5px; }
  .ws-stat{ color:var(--text-dim); }
  .ws-stat.no-data{ color:var(--text-faint); font-style:italic; }
  .ws-trend{ color:var(--green); font-weight:600; }

  .ws-chevron{ color:var(--text-faint); font-size:16px; flex-shrink:0; }

  .add-card{
    display:flex; align-items:center; justify-content:center; gap:8px; padding:16px; margin-top:6px;
    border:1px dashed var(--border); border-radius:var(--radius); color:var(--gold); font-size:13px; font-weight:600;
    cursor:pointer; transition:background 0.15s;
  }
  .add-card:hover{ background:var(--gold-dim); }

  #sync-note{ display:block; text-align:center; font-size:11px; color:var(--text-faint); margin-top:18px; }

  @media (max-width:420px){
    .shell{ padding:16px 14px 50px; }
    .brand h1{ font-size:23px; }
  }
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="avatar">👤</div>
    <div class="brand">
      <h1>Jarvis</h1>
      <p>Tu sistema operativo personal</p>
    </div>
    <div class="settings-btn" onclick="window.location.reload()" title="Actualizar">⟳</div>
  </div>

  <div class="section-label">Elige un workspace</div>
  <div class="section-sub">Todos tus negocios, sistemas y herramientas en un solo lugar.</div>

  <div class="card-list" id="card-list"></div>

  <div class="add-card" id="add-card">+ Agregar nuevo workspace</div>
  <span id="sync-note"></span>
</div>

<script>
const ICON_CLASS = {
  Gold: "gold", Teal: "teal", Green: "green", Purple: "purple",
  Orange: "orange", Blue: "blue", Gray: "gray"
};

// Shown only if the live Notion fetch fails — same 10 workspaces, no live stats.
const FALLBACK_WORKSPACES = [
  { name:"One Night Guest", icon:"🏛️", description:"Plataforma de servicios y locaciones para eventos.", statLabel:null, statTrend:null, route:"/ong-command-center.html", accentColor:"Gold", status:"Live" },
  { name:"RoutePup", icon:"🐾", description:"Plataforma logística para paseadores y dueños de perros.", statLabel:"6 áreas + 73 tarjetas reales", statTrend:null, route:"/project-command-center.html?project=routepup", accentColor:"Teal", status:"Live" },
  { name:"Nikita", icon:"🤖", description:"Personaje de IA y contenido.", statLabel:"5 áreas — sin tareas asignadas aún", statTrend:null, route:"/project-command-center.html?project=nikita", accentColor:"Purple", status:"Live" },
  { name:"StatStrike", icon:"📊", description:"Proyecto en desarrollo.", statLabel:"5 áreas — sin tareas asignadas aún", statTrend:null, route:"/project-command-center.html?project=statstrike", accentColor:"Orange", status:"Live" },
  { name:"Aristóteles", icon:"🦉", description:"Sistema de contexto personal, autobiografía y filosofía.", statLabel:"30 documentos reales", statTrend:null, route:"https://app.notion.com/p/3bb64152b99e81c88c22c38a5032b179", accentColor:"Green", status:"Live" },
  { name:"Calendario", icon:"📅", description:"Vista global de actividades, reuniones y compromisos.", statLabel:null, statTrend:null, route:"https://app.notion.com/p/3bb64152b99e81e1bce9f6eeb57fccee", accentColor:"Blue", status:"Live" },
  { name:"Personal OS", icon:"🧠", description:"Hábitos, rutina, metas y desarrollo personal.", statLabel:null, statTrend:null, route:"/personal-os.html", accentColor:"Blue", status:"Live" },
  { name:"Tareas & Proyectos", icon:"✅", description:"Gestión global de tareas, proyectos y objetivos.", statLabel:null, statTrend:null, route:"/tareas-proyectos.html", accentColor:"Orange", status:"Live" },
  { name:"Mis Gustos & Aprendizajes", icon:"💙", description:"Explora lo que te apasiona. Conecta ideas, aprende y construye una vida con propósito.", statLabel:null, statTrend:null, route:"/mis-gustos-aprendizajes.html", accentColor:"Blue", status:"Live" },
  { name:"Sistemas & Ajustes", icon:"⚙️", description:"Configuración, integraciones y personalización.", statLabel:null, statTrend:null, route:"/sistemas-ajustes.html", accentColor:"Gray", status:"Live" },
];

// Where "Agregar nuevo workspace" and any workspace without a route send you —
// the live Workspaces database in Notion, so adding/editing a card is just
// adding/editing a row, no code required.
const WORKSPACES_DB_URL = "https://app.notion.com/p/8c6c78ddcbf9465a80df76654a92e7a1";

function renderCard(ws){
  const iconClass = ICON_CLASS[ws.accentColor] || "gray";
  const comingSoon = ws.status === "Coming soon";
  const statHtml = ws.statLabel
    ? `<span class="ws-stat">${ws.statLabel}</span>${ws.statTrend ? `<span class="ws-trend">↗ ${ws.statTrend}</span>` : ""}`
    : `<span class="ws-stat no-data">No data yet</span>`;

  const card = document.createElement("div");
  card.className = "ws-card" + (comingSoon ? " coming-soon" : "");
  card.innerHTML = `
    <div class="ws-icon ${iconClass}">${ws.icon}</div>
    <div class="ws-body">
      <div class="ws-name-row">
        <span class="ws-name">${ws.name}</span>
        ${comingSoon ? `<span class="ws-badge">Próximamente</span>` : ""}
      </div>
      <div class="ws-desc">${ws.description || ""}</div>
      <div class="ws-stat-row">${statHtml}</div>
    </div>
    <div class="ws-chevron">›</div>`;

  card.addEventListener("click", () => {
    if(ws.route){
      // Always navigate in the same tab/frame — this whole app runs
      // embedded inside a Notion page (via an embed block), including on
      // mobile through Notion's app webview. Opening a new tab
      // (target="_blank") inside that embedded context doesn't open a
      // second tab the way it would in a normal browser — on the mobile
      // app it instead hands off to an external browser (Safari/Chrome),
      // which breaks the "stay inside Notion" experience. Same-tab
      // navigation avoids that entirely, on both desktop and mobile.
      window.location.href = ws.route;
    }else{
      // Not built as its own dashboard yet — send him to the in-app "coming
      // soon" placeholder (same Jarvis look, Home button included), never to
      // a raw Notion database/page view.
      const q = new URLSearchParams({ name: ws.name, icon: ws.icon || "" });
      window.location.href = `/coming-soon.html?${q.toString()}`;
    }
  });
  return card;
}

function render(workspaces){
  const list = document.getElementById("card-list");
  list.innerHTML = "";
  workspaces.forEach(ws => list.appendChild(renderCard(ws)));
}

async function loadData(){
  const syncNote = document.getElementById("sync-note");
  try{
    const res = await fetch("/api/workspaces-data");
    if(!res.ok) throw new Error("API error " + res.status);
    const data = await res.json();
    if(!data.workspaces || !data.workspaces.length) throw new Error("Empty workspace list");
    render(data.workspaces);
    if(syncNote) syncNote.textContent = "";
  }catch(err){
    console.warn("Live Workspaces data unavailable, showing fallback:", err.message);
    render(FALLBACK_WORKSPACES);
    if(syncNote) syncNote.textContent = "Demo layout — Notion connection not active yet";
  }
}

document.getElementById("add-card").addEventListener("click", () => {
  window.location.href = "/new-project.html";
});

loadData();
</script>
</body>
</html>
