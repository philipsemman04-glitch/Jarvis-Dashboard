<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mis Gustos & Conocimiento · Jarvis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#050b14;--p:#0b1726;--p2:#0f2033;--p3:#0a1422;--line:#8ec3ee26;--line2:#8ec3ee47;--text:#f3f1ea;--muted:#a5b5c4;--faint:#7890a4;--gold:#e5c068;--gold2:#f3d98f;--blue:#5aa9f0;--green:#46d49c;--purple:#a585f2;--pink:#ec79b3;--orange:#f0a64a;--red:#ef6d73;--serif:Fraunces,Georgia,serif;--sans:Inter,system-ui,sans-serif}
*{box-sizing:border-box}
html,body{overflow-x:clip}
body{margin:0;background:radial-gradient(900px 500px at 72% -10%,#16395a,transparent 62%),radial-gradient(700px 480px at 5% 15%,#2a1c4f55,transparent 70%),var(--bg);color:var(--text);font-family:var(--sans);font-size:13px}
button,input,select,textarea{font-family:inherit;font-size:inherit}
button{cursor:pointer}
a{color:inherit}
.shell{max-width:1560px;margin:auto;padding:16px 24px 96px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.crumb{color:var(--muted);font-size:12px}.crumb b{color:var(--text)}.crumb a{text-decoration:none;cursor:pointer}.crumb a:hover{color:var(--gold2)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line2);background:#0c1c2e;color:var(--text);border-radius:10px;padding:8px 13px;font-size:12px;font-weight:700;white-space:nowrap}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:linear-gradient(135deg,#f2d27e,#cf9f3f);color:#1f1606;border-color:#f3da8f}
.btn.ghost{background:transparent}
.btn.danger{color:#ff9aa0;border-color:#ef6d7366}
.btn.sm{padding:5px 9px;font-size:11px}
.input,.select{background:#0a1829;border:1px solid var(--line2);color:var(--text);border-radius:10px;padding:8px 11px;font-size:12px;min-width:0}
/* Hero */
.hero{position:relative;border:1px solid #e5c06855;border-radius:16px;overflow:hidden;min-height:176px;background:#0a1a2b center/cover no-repeat;margin-bottom:12px}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#050b14f5,#050b14b8 48%,#050b1433),linear-gradient(0deg,#050b1499,transparent 60%)}
.hero-in{position:relative;z-index:1;display:flex;gap:18px;align-items:center;padding:26px 28px;min-height:176px}
.hero-icon{width:72px;height:72px;border-radius:16px;border:1.5px solid var(--gold);background:#07121fcc center/cover no-repeat;display:grid;place-items:center;flex-shrink:0;color:var(--gold)}
.hero-kicker{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold2);font-weight:800}
.hero h1,.topic-hero h1{font-family:var(--serif);font-weight:600;font-size:34px;margin:4px 0 4px;line-height:1.1}
.hero p{color:#d3dde6;margin:0;max-width:620px}
.hero-quote{margin-left:auto;max-width:300px;font-family:var(--serif);font-style:italic;font-size:15px;color:#e8e2d2;text-align:right;align-self:center}
.hero-quote small{display:block;font-family:var(--sans);font-style:normal;font-size:10px;letter-spacing:.14em;color:var(--gold2);margin-top:6px}
.hero-edit{position:absolute;z-index:2;right:14px;top:14px}
/* Tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{background:none;border:0;color:var(--muted);font-weight:700;padding:10px 14px;position:relative;white-space:nowrap}
.tabs button:hover{color:var(--text)}
.tabs button.active{color:var(--gold2)}
.tabs button.active::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:3px;border-radius:3px;background:var(--gold)}
/* Panels */
.panel{background:linear-gradient(160deg,#0d1b2cf2,#08121ff2);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.panel-head h2,.panel-head h3{margin:0;font-family:var(--serif);font-weight:600;font-size:19px}
.panel-head h3{font-size:16px}
.panel-head .sub{color:var(--faint);font-size:11.5px;margin-top:3px}
.link{background:none;border:0;color:var(--gold2);font-weight:800;font-size:11.5px;padding:0}
.link:hover{text-decoration:underline}
.grid-2{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kpi{background:linear-gradient(160deg,#0d1b2c,#08121f);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;gap:12px;align-items:center}
.kpi svg{flex-shrink:0;color:var(--gold)}
.kpi strong{display:block;font-size:24px;font-family:var(--serif);font-weight:600;line-height:1.1}
.kpi span{color:var(--muted);font-size:11px}
.empty{color:var(--faint);font-style:italic;font-size:12px;padding:10px 2px}
/* Topic cards */
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tcard{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--p);cursor:pointer;transition:transform .15s,border-color .15s;min-height:210px;display:flex;flex-direction:column}
.tcard:hover{transform:translateY(-2px);border-color:#e5c06899}
.tcover{height:112px;background:#11253a center/cover no-repeat;position:relative}
.tcover::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#0b1726,transparent 70%)}
.tbody{padding:0 12px 12px;margin-top:-22px;position:relative;z-index:1;display:flex;flex-direction:column;gap:4px;flex:1}
.ticon{width:40px;height:40px;border-radius:10px;border:1px solid var(--gold);background:#081322 center/cover no-repeat;display:grid;place-items:center;color:var(--gold);font-family:var(--serif);font-weight:600;font-size:18px}
.tname{font-weight:800;font-size:13.5px;margin-top:4px}
.tmeta{color:var(--faint);font-size:11px}
.tdesc{color:var(--muted);font-size:11.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tdesc.placeholder{color:var(--faint);font-style:italic}
.tmenu{position:absolute;right:8px;top:8px;z-index:2;background:#07121fcc;border:1px solid var(--line2);color:var(--text);border-radius:8px;width:30px;height:28px;font-weight:800}
.tcard.new{border-style:dashed;align-items:center;justify-content:center;text-align:center;color:var(--muted);gap:6px;padding:14px;background:transparent}
.tcard.new b{color:var(--gold2);font-size:14px}
.plus{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--gold);display:grid;place-items:center;color:var(--gold);font-size:22px}
.menu{position:fixed;z-index:80;background:#0d1d30;border:1px solid var(--line2);border-radius:10px;padding:5px;min-width:170px;box-shadow:0 18px 40px #000a}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--text);padding:8px 10px;border-radius:7px;font-size:12px;font-weight:600}
.menu button:hover{background:#ffffff10}
.menu button.del{color:#ff9aa0}
/* Lists */
.row{display:flex;gap:11px;align-items:center;padding:10px 6px;border-bottom:1px solid #8ec3ee18;cursor:pointer;border-radius:8px}
.row:hover{background:#ffffff08}
.row:last-child{border-bottom:0}
.thumb{width:44px;height:44px;border-radius:9px;background:#10263b center/cover no-repeat;border:1px solid var(--line);display:grid;place-items:center;color:var(--gold);font-size:10px;font-weight:800;flex-shrink:0;text-transform:uppercase;letter-spacing:.04em;text-align:center}
.row .copy{min-width:0;flex:1}
.row strong{display:block;font-size:12.5px;overflow-wrap:anywhere}
.row small{color:var(--faint);font-size:11px}
.row .right{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.chip{display:inline-block;font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;background:#5aa9f01f;color:#9fcaf5;margin:2px 4px 0 0;white-space:nowrap}
.chip.gold{background:#e5c0681f;color:var(--gold2)}
.chip.green{background:#46d49c1f;color:#7fe3b9}
.chip.purple{background:#a585f21f;color:#c7b3f7}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .input{flex:1 1 220px}
/* Board */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.col{background:var(--p2);border:1px solid var(--line);border-radius:12px;padding:10px;width:290px;flex-shrink:0;max-height:70vh;display:flex;flex-direction:column}
.col.drop{border-color:var(--gold);background:#132a40}
.col-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.col-head strong{flex:1;font-size:13px;overflow-wrap:anywhere}
.col-head .count{background:#ffffff12;border-radius:999px;padding:2px 8px;font-size:11px;color:var(--muted)}
.col-head button{background:none;border:0;color:var(--muted);font-weight:800;font-size:15px;padding:0 4px}
.col-body{overflow-y:auto;min-height:40px;display:flex;flex-direction:column;gap:8px}
.card{display:flex;gap:10px;background:var(--p);border:1px solid var(--line);border-radius:10px;padding:9px;cursor:grab}
.card:hover{border-color:#e5c06899}
.card.dragging{opacity:.5}
.card .thumb{width:58px;height:58px}
.card strong{display:block;font-size:12.5px;line-height:1.3;overflow-wrap:anywhere}
.card small{color:var(--faint);font-size:11px;display:block;margin-top:2px}
.add-card{background:none;border:1px dashed var(--line2);color:var(--gold2);border-radius:9px;padding:8px;font-weight:700;font-size:12px;margin-top:8px}
.col.new{align-items:center;justify-content:center;text-align:center;border-style:dashed;color:var(--muted);cursor:pointer;min-height:160px;background:transparent;gap:6px}
.col.new b{color:var(--text)}
.topic-hero{position:relative;border:1px solid #e5c06855;border-radius:16px;overflow:hidden;background:#0a1a2b center/cover no-repeat;margin-bottom:12px}
.topic-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#050b14f2,#050b14b0 55%,#050b1422)}
.topic-hero .hero-in{min-height:150px}
/* Cloud */
.cloud-wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px}
.cloud-box{position:relative;border:1px solid var(--line);border-radius:12px;min-height:380px;overflow:hidden;background:radial-gradient(circle at 50% 50%,#1b4a7555,transparent 60%),#081322}
.cloud{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;justify-content:center;padding:30px 24px;min-height:380px;transform-origin:center;transition:transform .2s}
.cloud button{background:none;border:0;font-weight:800;letter-spacing:-.01em;line-height:1.05;padding:2px;text-shadow:0 0 16px currentColor}
.cloud button:hover{transform:scale(1.07)}
.zoom{position:absolute;left:12px;bottom:12px;display:flex;gap:6px;z-index:2}
.total-pill{position:absolute;right:12px;bottom:12px;z-index:2;border:1px solid var(--line2);border-radius:9px;padding:6px 10px;color:var(--muted);font-size:11px;background:#081322cc}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--muted);padding:6px 12px;font-weight:700;font-size:11.5px}
.seg button.active{background:#e5c06826;color:var(--gold2)}
.tlist .trow{display:grid;grid-template-columns:10px minmax(0,1fr) 70px 30px 36px;gap:8px;align-items:center;padding:8px 4px;border-bottom:1px solid #8ec3ee14;cursor:pointer;font-size:12px}
.tlist .trow:hover{background:#ffffff08}
.dotc{width:10px;height:10px;border-radius:50%}
.bar{height:5px;border-radius:5px;background:#16304a;overflow:hidden}.bar i{display:block;height:100%;border-radius:5px}
.num{text-align:right;color:var(--muted)}
.map svg{width:100%;height:auto;display:block}
.authors{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.author{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--p);cursor:pointer;display:flex;gap:10px;align-items:center}
.author:hover{border-color:#e5c06899}
.avatar{width:40px;height:40px;border-radius:50%;background:#e5c06822;border:1px solid var(--gold);display:grid;place-items:center;color:var(--gold2);font-weight:800;flex-shrink:0}
.quotes{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.quote{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--p);display:flex;flex-direction:column;gap:8px}
.quote q{font-family:var(--serif);font-style:italic;font-size:15.5px;line-height:1.45;quotes:"“" "”"}
.quote small{color:var(--gold2);font-weight:700;letter-spacing:.06em}
.quote .qa{display:flex;gap:6px;margin-top:auto}
/* Quick bar */
.quickbar{position:fixed;left:var(--sbw,0px);right:0;bottom:0;z-index:40;display:flex;gap:8px;align-items:center;padding:10px 24px;background:#050b14ee;backdrop-filter:blur(12px);border-top:1px solid var(--line);overflow-x:auto}
.quickbar .lbl{color:var(--gold2);font-weight:800;font-size:12px;white-space:nowrap;margin-right:4px}
.sync{margin-left:auto;color:var(--green);font-size:11px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
/* Modal */
.modal-bg{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:16px;z-index:90}
.modal{background:linear-gradient(180deg,#0f1f32,#0a1523);border:1px solid var(--line2);border-radius:16px;padding:20px;width:min(760px,100%);max-height:92vh;overflow:auto}
.modal.narrow{width:min(520px,100%)}
.modal-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.modal-head h2{margin:0;font-family:var(--serif);font-weight:600;font-size:22px}
.modal-head .sub{color:var(--muted);font-size:12px;margin-top:3px}
.modal-head .x{margin-left:auto;background:none;border:0;color:var(--muted);font-size:20px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .wide{grid-column:1/-1}
.form label,.flabel{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--muted);font-weight:700}
.form input,.form select,.form textarea{background:#0a1829;border:1px solid var(--line2);color:var(--text);border-radius:9px;padding:9px 11px;font-size:13px;width:100%}
.form textarea{min-height:92px;resize:vertical}
.ref-top{display:grid;grid-template-columns:170px minmax(0,1fr);gap:14px;margin-bottom:12px}
.ref-img{height:150px;border-radius:12px;border:1px solid var(--line2);background:#0a1829 center/cover no-repeat;display:grid;place-items:center;color:var(--faint);font-size:11px;text-align:center;padding:8px}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick label{flex-direction:row;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:999px;padding:5px 10px;font-size:11.5px;color:var(--text);cursor:pointer;background:#0a1829}
.pick input{width:auto;accent-color:var(--gold)}
.pick label:has(input:checked){border-color:var(--gold);background:#e5c0681f}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--line2);border-radius:9px;padding:6px;background:#0a1829}
.tags .chip button{background:none;border:0;color:inherit;margin-left:4px;padding:0;font-weight:800}
.tags input{border:0!important;background:transparent!important;flex:1;min-width:120px;padding:4px!important}
.stars{display:flex;gap:4px;align-items:center}
.stars button{background:none;border:0;font-size:22px;color:#3a4d61;padding:0 1px}
.stars button.on{color:var(--gold)}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.file{position:relative;border:1px solid var(--line2);border-radius:10px;height:100px;background:#0a1829 center/cover no-repeat;display:flex;align-items:flex-end;text-decoration:none;overflow:hidden}
.file span{background:#050b14d9;width:100%;padding:4px 6px;font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .rm{position:absolute;right:4px;top:4px;background:#050b14e6;border:1px solid var(--line2);color:#ff9aa0;border-radius:6px;width:22px;height:22px;font-weight:800;padding:0}
.drop-zone{border:1.5px dashed var(--line2);border-radius:10px;height:100px;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:11px;cursor:pointer;padding:6px}
.drop-zone.over{border-color:var(--gold);color:var(--gold2)}
.comments{display:flex;flex-direction:column;gap:8px;max-height:220px;overflow:auto;margin-top:8px}
.comment{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#0a1829}
.comment small{color:var(--faint);display:block;margin-bottom:3px}
.section-label{font-size:11px;color:var(--muted);font-weight:800;margin:16px 0 8px;letter-spacing:.04em}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.modal-actions .left{margin-right:auto}
.img-field{display:flex;gap:10px;align-items:center}
.img-prev{width:84px;height:56px;border-radius:9px;border:1px solid var(--line2);background:#0a1829 center/cover no-repeat;flex-shrink:0}
.img-prev.sq{width:56px}
.brief{white-space:normal;line-height:1.55;color:#d8e2ea}
.brief h4{margin:14px 0 6px;color:var(--gold2);font-size:12px;letter-spacing:.05em;text-transform:uppercase}
.brief ul{margin:0;padding-left:18px}
.status{text-align:center;color:var(--faint);font-size:11px;margin-top:10px}
@media(max-width:1180px){.grid-2,.cloud-wrap{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:760px){.shell{padding:12px 12px 110px}.hero-in{flex-wrap:wrap;padding:20px 16px;gap:12px}.hero-icon{width:54px;height:54px}.hero h1{font-size:26px}.hero-quote{display:none}.kpis{grid-template-columns:1fr 1fr}.topics{grid-template-columns:1fr 1fr}.form,.ref-top{grid-template-columns:1fr}.col{width:84vw}.quickbar{padding:8px 12px}.hero-edit{top:auto;bottom:10px}}
@media(max-width:420px){.topics{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="shell">
  <div class="top">
    <div class="crumb" id="crumb"><b>Mis Gustos &amp; Conocimiento</b></div>
    <div class="actions">
      <button class="btn" onclick="location.href='/'">⌂ Inicio</button>
      <button class="btn" onclick="openTopicForm()">＋ Nuevo tema</button>
      <button class="btn gold" onclick="openRefForm({})">＋ Nueva referencia</button>
    </div>
  </div>

  <div id="home-view">
    <section class="hero" id="hero">
      <button class="btn hero-edit" onclick="openPageForm()">✎ Editar portada</button>
      <div class="hero-in">
        <div class="hero-icon" id="hero-icon"></div>
        <div>
          <div class="hero-kicker">Jarvis · Conocimiento</div>
          <h1 id="hero-title">Mis Gustos &amp; Conocimiento</h1>
          <p id="hero-desc">Todo lo que me interesa, conectado y organizado.</p>
        </div>
        <div class="hero-quote" id="hero-quote"></div>
      </div>
    </section>
    <nav class="tabs" id="tabs">
      <button data-tab="resumen">Resumen</button>
      <button data-tab="temas">Mis Temas</button>
      <button data-tab="referencias">Referencias</button>
      <button data-tab="nube">Nube de Temas</button>
      <button data-tab="explorar">Explorar</button>
      <button data-tab="autores">Autores</button>
      <button data-tab="citas">Citas</button>
    </nav>
    <div id="tab-view"></div>
  </div>

  <div id="topic-view" style="display:none"></div>
  <div class="status" id="status">Cargando desde Notion…</div>
</main>

<div class="quickbar">
  <span class="lbl">⚡ Acceso rápido</span>
  <button class="btn sm" onclick="openRefForm({})">＋ Nueva referencia</button>
  <button class="btn sm" onclick="openRefForm({ tipo:'Idea / Concepto' })">＋ Nueva nota</button>
  <button class="btn sm" onclick="openTopicForm()">＋ Nuevo tema</button>
  <button class="btn sm" onclick="openQuoteForm()">＋ Nueva cita</button>
  <button class="btn sm" onclick="openBrief('all')">✦ Generar brief</button>
  <button class="btn sm" onclick="go('nube')">◎ Explorar temas</button>
  <span class="sync"><i></i><span id="sync-text">Sincronizado con Notion</span></span>
</div>

<script src="/toast.js"></script>
<div class="modal-bg" id="modal-bg"><div class="modal" id="modal"></div></div>

<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const cssUrl = u => { try{ const x = new URL(String(u), location.origin); return /^https?:$/.test(x.protocol) ? `url("${x.href.replace(/"/g, "%22")}")` : "none"; }catch(e){ return "none"; } };
const safeUrl = u => { try{ const x = new URL(String(u || ""), location.origin); return /^https?:$/.test(x.protocol) ? x.href : ""; }catch(e){ return ""; } };
const TIPOS = ["Artículo / Link","Libro","Podcast","Conferencia / Video","Autor / Pensador","Cuenta / Perfil","Referencia visual","Idea / Concepto","Cita","Evento"];
const TIPO_SHORT = { "Artículo / Link":"Artículo", "Libro":"Libro", "Podcast":"Podcast", "Conferencia / Video":"Video", "Autor / Pensador":"Autor", "Cuenta / Perfil":"Perfil", "Referencia visual":"Visual", "Idea / Concepto":"Nota", "Cita":"Cita", "Evento":"Evento" };
const ESTADOS = ["Por consumir","Consumiendo","Terminado","⭐ Hall of Fame"];
const COLORS = ["#5aa9f0","#ec79b3","#a585f2","#46d49c","#f0c95d","#f0a64a","#6fd3e8","#ef6d73"];
const GRADS = ["#1d4f7c,#0b1726","#5a2a6b,#0b1726","#2b4d78,#0b1726","#5c4521,#0b1726","#1f5a4c,#0b1726","#6b2d3f,#0b1726"];
const DEFAULT_QUOTES = [
  { text:"La curiosidad es una ventaja competitiva.", author:"Jarvis" },
  { text:"Lo que sabemos es una gota; lo que ignoramos, un océano.", author:"Isaac Newton" },
  { text:"Aprende como si fueras a vivir para siempre.", author:"Mahatma Gandhi" },
  { text:"El conocimiento es poder, pero el carácter es más.", author:"Bruce Lee" },
  { text:"Una mente curiosa construye una vida notable.", author:"Jarvis" },
];
const ICONS = {
  book:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/></svg>',
  layers:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></svg>',
  note:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h7M9 8h4"/></svg>',
  people:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6.5 6.5 0 0 1 3.5 6"/></svg>',
  chart:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 20h18"/><path d="m5 15 4-4 4 3 6-7"/></svg>',
  brain:'<svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M9 3a3 3 0 0 0-3 3 3 3 0 0 0-2 5 3 3 0 0 0 2 5 3 3 0 0 0 3 3 2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z"/><path d="M15 3a3 3 0 0 1 3 3 3 3 0 0 1 2 5 3 3 0 0 1-2 5 3 3 0 0 1-3 3 2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/></svg>',
};

let data = { referencias:[], topics:[], page:null }, tab = "resumen", activeTopic = null, cloudZoom = 1, cloudView = "nube", topicSort = "refs";
const refFilters = { q:"", tema:"all", tipo:"all", estado:"all", autor:"", sort:"recent" };
const boardFilters = { q:"", tipo:"all", sort:"recent" };

/* ---------- helpers ---------- */
const topicOf = name => data.topics.find(t => t.name === name);
const refsOf = name => data.referencias.filter(r => (r.temas || []).includes(name));
const colorOf = name => COLORS[Math.max(0, data.topics.findIndex(t => t.name === name)) % COLORS.length];
const initials = s => String(s || "?").trim().split(/\s+/).slice(0,2).map(w => w[0]).join("").toUpperCase();
const dateEs = iso => iso ? new Date(iso).toLocaleDateString("es-MX", { day:"numeric", month:"short", year:"numeric" }) : "";
function relDate(iso){ const d = Math.floor((Date.now() - new Date(iso)) / 86400000); return d <= 0 ? "Hoy" : d === 1 ? "Ayer" : d < 7 ? `Hace ${d} días` : dateEs(iso); }
function coverStyle(url, i){ return url ? `background-image:${cssUrl(url)}` : `background-image:linear-gradient(135deg,${GRADS[i % GRADS.length]})`; }
function iconHTML(t){ return t.iconUrl ? "" : esc(initials(t.name).slice(0,1)); }
function thumbHTML(r, cls = "thumb"){ return r.imageUrl ? `<div class="${cls}" style="background-image:${cssUrl(r.imageUrl)}"></div>` : `<div class="${cls}">${esc(TIPO_SHORT[r.tipo] || "Ref")}</div>`; }
function parseQuote(r){ const m = String(r.referencia || "").match(/^["“](.+)["”]\s*[—-]\s*(.+)$/s); return m ? { text:m[1], author:m[2] } : { text:r.referencia, author:r.autor || "" }; }
const quotes = () => data.referencias.filter(r => r.tipo === "Cita");
function quoteOfDay(){ const saved = quotes().map(parseQuote), pool = saved.length ? saved : DEFAULT_QUOTES; return pool[Math.floor(Date.now() / 86400000) % pool.length]; }
function sortRefs(list, how){
  const l = [...list];
  if(how === "az") return l.sort((a,b) => a.referencia.localeCompare(b.referencia, "es"));
  if(how === "importance") return l.sort((a,b) => (b.importancia||0) - (a.importancia||0));
  if(how === "oldest") return l.sort((a,b) => new Date(a.createdTime) - new Date(b.createdTime));
  return l.sort((a,b) => new Date(b.createdTime) - new Date(a.createdTime));
}
function refRow(r){
  return `<div class="row" data-ref="${esc(r.id)}">${thumbHTML(r)}<div class="copy"><strong>${esc(r.referencia)}</strong><small>${esc([r.tipo, r.autor].filter(Boolean).join(" · "))}</small><div>${(r.temas||[]).slice(0,2).map(t => `<span class="chip">${esc(t)}</span>`).join("")}${(r.tags||[]).slice(0,2).map(t => `<span class="chip purple">${esc(t)}</span>`).join("")}</div></div><div class="right"><span class="chip ${r.estado==="Terminado"||r.estado==="⭐ Hall of Fame"?"green":"gold"}">${esc(r.estado || "Sin estado")}</span><small>${esc(relDate(r.createdTime))}</small></div></div>`;
}
function bindRefs(root){ root.querySelectorAll("[data-ref]").forEach(n => n.addEventListener("click", () => openRef(n.dataset.ref))); }
async function post(url, body){
  const r = await fetch(url, { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(body) });
  const d = await r.json().catch(() => ({}));
  if(!r.ok || d.error || d.ok === false) throw new Error(d.error || ("Error " + r.status));
  return d;
}
async function run(msg, fn, okMsg){
  const t = window.jarvisToast?.loading(msg);
  try{ const out = await fn(); window.jarvisToast?.success(t, okMsg || "Guardado en Notion"); return out; }
  catch(err){ window.jarvisToast?.error(t, "No se pudo: " + err.message); throw err; }
}
function readFile(file){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result)); r.onerror = rej; r.readAsDataURL(file); }); }
// Big photos are resized in the browser so they stay under the 3 MB upload limit.
async function imagePayload(file, max = 1800){
  if(!file) return null;
  if(!/^image\//.test(file.type)) throw new Error("Elige una imagen (JPG, PNG o WebP).");
  if(file.size < 1.5*1024*1024 && file.type !== "image/heic") return { name:file.name, type:file.type, data: await readFile(file) };
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
  const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");
  c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return { name: file.name.replace(/\.\w+$/, "") + ".jpg", type:"image/jpeg", data: c.toDataURL("image/jpeg", .86) };
}
function openModal(html, narrow){ const m = document.getElementById("modal"); m.className = "modal" + (narrow ? " narrow" : ""); m.innerHTML = html; document.getElementById("modal-bg").style.display = "flex"; return m; }
function closeModal(){ document.getElementById("modal-bg").style.display = "none"; document.getElementById("modal").innerHTML = ""; }
document.getElementById("modal-bg").addEventListener("mousedown", e => { if(e.target.id === "modal-bg") closeModal(); });
document.addEventListener("keydown", e => { if(e.key === "Escape"){ closeMenu(); closeModal(); } });
let menuEl = null;
function closeMenu(){ menuEl?.remove(); menuEl = null; }
function showMenu(anchor, items){
  closeMenu();
  menuEl = document.createElement("div"); menuEl.className = "menu";
  menuEl.innerHTML = items.map((it, i) => `<button data-i="${i}" class="${it.danger?"del":""}">${esc(it.label)}</button>`).join("");
  document.body.appendChild(menuEl);
  const r = anchor.getBoundingClientRect();
  menuEl.style.top = Math.min(r.bottom + 4, innerHeight - menuEl.offsetHeight - 8) + "px";
  menuEl.style.left = Math.max(8, Math.min(r.right - menuEl.offsetWidth, innerWidth - menuEl.offsetWidth - 8)) + "px";
  menuEl.querySelectorAll("button").forEach(b => b.addEventListener("click", ev => { ev.stopPropagation(); const it = items[b.dataset.i]; closeMenu(); it.run(); }));
}
document.addEventListener("click", e => { if(menuEl && !menuEl.contains(e.target)) closeMenu(); });

/* ---------- navigation (kept in the URL so a refresh stays put) ---------- */
function go(t){ activeTopic = null; tab = t; location.hash = t; render(); scrollTo({ top:0 }); }
function openTopic(name){ activeTopic = name; location.hash = "tema=" + encodeURIComponent(name); render(); scrollTo({ top:0 }); }
function readHash(){
  const h = decodeURIComponent(location.hash.slice(1));
  if(h.startsWith("tema=")){ activeTopic = h.slice(5); }
  else { activeTopic = null; tab = ["resumen","temas","referencias","nube","explorar","autores","citas"].includes(h) ? h : "resumen"; }
}
addEventListener("hashchange", () => { readHash(); render(); });
document.querySelectorAll("#tabs button").forEach(b => b.addEventListener("click", () => go(b.dataset.tab)));

/* ---------- rendering ---------- */
function render(){
  renderHero();
  const inTopic = activeTopic && topicOf(activeTopic);
  document.getElementById("home-view").style.display = inTopic ? "none" : "";
  document.getElementById("topic-view").style.display = inTopic ? "" : "none";
  document.getElementById("crumb").innerHTML = inTopic ? `<a onclick="go('temas')">Mis Gustos &amp; Conocimiento</a>　›　<b>${esc(activeTopic)}</b>` : "<b>Mis Gustos &amp; Conocimiento</b>";
  if(inTopic) return renderTopic();
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  const el = document.getElementById("tab-view");
  el.innerHTML = ({ resumen:resumenHTML, temas:temasHTML, referencias:referenciasHTML, nube:nubeHTML, explorar:explorarHTML, autores:autoresHTML, citas:citasHTML })[tab]();
  bindTab(el);
}
function renderHero(){
  const p = data.page || {};
  document.getElementById("hero").style.backgroundImage = cssUrl(p.coverUrl || "/assets/covers/mis-gustos-aprendizajes-cover-v2.jpg");
  const icon = document.getElementById("hero-icon");
  icon.style.backgroundImage = p.iconUrl ? cssUrl(p.iconUrl) : "none"; icon.innerHTML = p.iconUrl ? "" : ICONS.brain;
  document.getElementById("hero-title").textContent = p.title || "Mis Gustos & Conocimiento";
  document.getElementById("hero-desc").textContent = p.description || "Todo lo que me interesa, conectado y organizado.";
  const q = quoteOfDay();
  document.getElementById("hero-quote").innerHTML = `“${esc(q.text)}”<small>— ${esc(q.author || "Jarvis")}</small>`;
}
function kpisHTML(){
  const r = data.referencias, week = Date.now() - 7*86400000;
  const authors = new Set(r.map(x => (x.autor||"").trim()).filter(Boolean)).size;
  const items = [
    [ICONS.book, r.length, "Referencias totales", r.filter(x => new Date(x.createdTime) >= week).length + " esta semana"],
    [ICONS.layers, data.topics.filter(t => t.count).length + " / " + data.topics.length, "Temas con referencias", ""],
    [ICONS.note, r.filter(x => (x.porQueMeInteresa||"").trim()).length, "Notas personales", ""],
    [ICONS.people, authors, "Autores", ""],
    [ICONS.chart, r.filter(x => x.estado === "Terminado" || x.estado === "⭐ Hall of Fame").length, "Conocimiento aplicado", "terminadas o Hall of Fame"],
  ];
  return `<div class="kpis">${items.map(([i,n,l,s]) => `<div class="kpi">${i}<div><strong>${esc(n)}</strong><span>${l}${s?` · ${esc(s)}`:""}</span></div></div>`).join("")}</div>`;
}
function topicCard(t, i){
  const cols = new Set([...(t.columns||[]), ...refsOf(t.name).map(r => r.columna).filter(c => c && c !== "Sin columna")]).size;
  return `<div class="tcard" data-topic="${esc(t.name)}"><button class="tmenu" data-tmenu="${esc(t.name)}" title="Opciones">⋯</button><div class="tcover" style="${coverStyle(t.coverUrl, i)}"></div><div class="tbody"><div class="ticon" style="${t.iconUrl?`background-image:${cssUrl(t.iconUrl)}`:""}">${iconHTML(t)}</div><div class="tname">${esc(t.name)}</div><div class="tmeta">${t.count} referencias · ${cols} columnas</div><div class="tdesc ${t.description?"":"placeholder"}">${esc(t.description || "Sin descripción — ✎ edita el tema para añadir portada, ícono y descripción.")}</div></div></div>`;
}
const newTopicCard = () => `<div class="tcard new" data-newtopic><div class="plus">＋</div><b>Nuevo tema</b><span>Empieza a explorar un nuevo interés.</span></div>`;
function resumenHTML(){
  const recent = sortRefs(data.referencias, "recent").slice(0, 6);
  return `${kpisHTML()}<div class="grid-2"><div>
    <section class="panel"><div class="panel-head"><div><h2>Mis Temas</h2><div class="sub">Áreas de interés, aprendizaje y exploración.</div></div><button class="link" onclick="go('temas')">Ver todos (${data.topics.length}) →</button></div>
      <div class="topics">${data.topics.slice(0, 7).map(topicCard).join("")}${newTopicCard()}</div></section>
    <section class="panel"><div class="panel-head"><h3>Referencias recientes</h3><button class="link" onclick="go('referencias')">Ver todas →</button></div>${recent.map(refRow).join("") || '<div class="empty">Aún no hay referencias. Usa “＋ Nueva referencia”.</div>'}</section>
  </div><div>
    <section class="panel"><div class="panel-head"><h3>Brief de conocimiento</h3></div>
      <div class="sub" style="color:var(--muted);font-size:12px;margin-bottom:10px">Un resumen de lo que has guardado en un tema o en todos: novedades, pendientes por consumir, lo mejor valorado y los tags más repetidos.</div>
      <select class="select" id="brief-topic" style="width:100%;margin-bottom:10px"><option value="all">Todos los temas</option>${data.topics.map(t => `<option>${esc(t.name)}</option>`).join("")}</select>
      <button class="btn gold" style="width:100%" onclick="openBrief(document.getElementById('brief-topic').value)">✦ Generar brief</button></section>
    <section class="panel"><div class="panel-head"><h3>Actividad reciente</h3></div>${recent.slice(0,5).map(r => `<div class="row" data-ref="${esc(r.id)}"><div class="copy"><strong>${esc(r.referencia)}</strong><small>${esc(r.tipo||"Referencia")} agregada · ${esc((r.temas||[])[0] || "sin tema")}</small></div><small>${esc(relDate(r.createdTime))}</small></div>`).join("") || '<div class="empty">Sin actividad todavía.</div>'}</section>
    <section class="panel"><div class="panel-head"><h3>Cita del día</h3><button class="link" onclick="go('citas')">Todas →</button></div>${(q => `<div class="quote" style="border:0;padding:0;background:none"><q>${esc(q.text)}</q><small>— ${esc(q.author || "Jarvis")}</small></div>`)(quoteOfDay())}</section>
  </div></div>`;
}
function temasHTML(){
  const list = [...data.topics].sort(topicSort === "az" ? (a,b) => a.name.localeCompare(b.name, "es") : (a,b) => b.count - a.count || a.name.localeCompare(b.name, "es"));
  return `<section class="panel"><div class="panel-head"><div><h2>Mis Temas</h2><div class="sub">Cada tema tiene su portada, ícono, descripción y un tablero con columnas.</div></div>
    <div class="actions"><input class="input" id="topic-q" placeholder="⌕ Buscar temas…"><select class="select" id="topic-sort"><option value="refs" ${topicSort==="refs"?"selected":""}>Ordenar: referencias</option><option value="az" ${topicSort==="az"?"selected":""}>Ordenar: nombre</option></select></div></div>
    <div class="topics" id="topic-grid">${list.map(t => topicCard(t, data.topics.indexOf(t))).join("")}${newTopicCard()}</div></section>`;
}
function filteredRefs(){
  const q = refFilters.q.toLowerCase();
  return sortRefs(data.referencias.filter(r =>
    (!q || `${r.referencia} ${r.autor} ${r.porQueMeInteresa} ${(r.tags||[]).join(" ")}`.toLowerCase().includes(q)) &&
    (refFilters.tema === "all" || (r.temas||[]).includes(refFilters.tema)) &&
    (refFilters.tipo === "all" || r.tipo === refFilters.tipo) &&
    (refFilters.estado === "all" || r.estado === refFilters.estado) &&
    (!refFilters.autor || (r.autor||"").trim() === refFilters.autor)), refFilters.sort);
}
function referenciasHTML(){
  const list = filteredRefs(), opt = (v, cur, label) => `<option value="${esc(v)}" ${v===cur?"selected":""}>${esc(label ?? v)}</option>`;
  return `<section class="panel"><div class="panel-head"><div><h2>Referencias</h2><div class="sub">${list.length} de ${data.referencias.length} referencias${refFilters.autor?` · autor: ${esc(refFilters.autor)}`:""}</div></div><button class="btn gold" onclick="openRefForm({})">＋ Nueva referencia</button></div>
    <div class="toolbar"><input class="input" id="rf-q" value="${esc(refFilters.q)}" placeholder="⌕ Buscar por título, autor, nota o tag…">
      <select class="select" id="rf-tema">${opt("all", refFilters.tema, "Tema · Todos")}${data.topics.map(t => opt(t.name, refFilters.tema)).join("")}</select>
      <select class="select" id="rf-tipo">${opt("all", refFilters.tipo, "Tipo · Todos")}${TIPOS.map(t => opt(t, refFilters.tipo)).join("")}</select>
      <select class="select" id="rf-estado">${opt("all", refFilters.estado, "Estado · Todos")}${ESTADOS.map(t => opt(t, refFilters.estado)).join("")}</select>
      <select class="select" id="rf-sort">${opt("recent", refFilters.sort, "Más recientes")}${opt("oldest", refFilters.sort, "Más antiguas")}${opt("az", refFilters.sort, "A-Z")}${opt("importance", refFilters.sort, "Importancia")}</select>
      <button class="btn ghost" id="rf-clear">× Limpiar</button></div>
    ${list.map(refRow).join("") || '<div class="empty">No hay referencias con estos filtros.</div>'}</section>`;
}
function cloudItems(){
  const words = data.topics.map(t => ({ word:t.name, weight:t.count, topic:true }));
  (data.tagCloud || []).forEach(t => { if(!words.some(w => w.word.toLowerCase() === t.word.toLowerCase())) words.push({ word:t.word, weight:t.weight, topic:false }); });
  return words;
}
function nubeHTML(){
  const words = cloudItems(), max = Math.max(1, ...words.map(w => w.weight)), total = data.referencias.length;
  const sorted = [...data.topics].sort(topicSort === "az" ? (a,b) => a.name.localeCompare(b.name, "es") : (a,b) => b.count - a.count);
  const maxT = Math.max(1, ...data.topics.map(t => t.count));
  const view = cloudView === "mapa" ? `<div class="map">${mapSVG()}</div>` : cloudView === "lista"
    ? `<div class="tlist" style="padding:14px">${sorted.map(t => topicRow(t, maxT, total)).join("")}</div>`
    : `<div class="cloud" id="cloud" style="transform:scale(${cloudZoom})">${words.map((w,i) => `<button data-${w.topic?"topic":"tag"}="${esc(w.word)}" title="${esc(w.word)} · ${w.weight} referencias" style="font-size:${13 + (w.weight/max)*34}px;color:${COLORS[i % COLORS.length]}">${esc(w.word)}</button>`).join("") || '<div class="empty">Crea un tema para verlo aquí.</div>'}</div>
       <div class="zoom"><button class="btn sm" id="z-in" title="Acercar">＋</button><button class="btn sm" id="z-out" title="Alejar">－</button><button class="btn sm" id="z-reset">↺ Restablecer vista</button></div>`;
  return `<div class="cloud-wrap"><section class="panel"><div class="panel-head"><div><h2>Nube de Temas</h2><div class="sub">El tamaño indica cuántas referencias tiene cada tema. Haz clic en un tema para abrirlo; en un tag, para ver sus referencias.</div></div>
      <div class="seg" id="cloud-seg"><button data-v="nube" class="${cloudView==="nube"?"active":""}">Nube</button><button data-v="mapa" class="${cloudView==="mapa"?"active":""}">Mapa</button><button data-v="lista" class="${cloudView==="lista"?"active":""}">Lista</button></div></div>
      <div class="cloud-box">${view}<div class="total-pill">${total} referencias en total</div></div></section>
    <section class="panel"><div class="panel-head"><h3>Temas (${data.topics.length})</h3><select class="select" id="topic-sort"><option value="refs" ${topicSort==="refs"?"selected":""}>Por referencias</option><option value="az" ${topicSort==="az"?"selected":""}>Por nombre</option></select></div>
      <div class="tlist">${sorted.map(t => topicRow(t, maxT, total)).join("")}</div>
      <button class="link" style="margin-top:12px" onclick="openTopicForm()">＋ Agregar tema</button></section></div>
    <section class="panel"><div class="panel-head"><h3>Temas principales</h3><button class="link" onclick="go('temas')">Ver todos →</button></div>
      <div class="topics">${[...data.topics].sort((a,b) => b.count - a.count).slice(0, 6).map(t => topicCard(t, data.topics.indexOf(t))).join("")}</div></section>`;
}
function topicRow(t, max, total){
  const pct = total ? Math.round(t.count / total * 100) : 0, c = colorOf(t.name);
  return `<div class="trow" data-topic="${esc(t.name)}"><span class="dotc" style="background:${c}"></span><span>${esc(t.name)}</span><span class="bar"><i style="width:${Math.max(4, t.count/max*100)}%;background:${c}"></i></span><span class="num">${t.count}</span><span class="num">${pct}%</span></div>`;
}
function mapSVG(){
  const topics = [...data.topics].sort((a,b) => b.count - a.count).slice(0, 8);
  if(!topics.length) return '<div class="empty" style="padding:30px">Crea temas para ver el mapa.</div>';
  const W = 760, H = 420, cx = W/2, cy = H/2, R = 150;
  let s = "";
  topics.forEach((t, i) => {
    const a = i / topics.length * Math.PI * 2 - Math.PI/2, x = cx + R*Math.cos(a), y = cy + R*Math.sin(a), c = colorOf(t.name);
    s += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="${c}" stroke-opacity=".35"/>`;
    const tags = {}; refsOf(t.name).forEach(r => (r.tags||[]).forEach(g => tags[g] = (tags[g]||0) + 1));
    Object.entries(tags).sort((p,q) => q[1]-p[1]).slice(0,3).forEach(([g], j) => {
      const b = a + (j-1)*.35, gx = x + 70*Math.cos(b), gy = y + 70*Math.sin(b);
      s += `<line x1="${x}" y1="${y}" x2="${gx}" y2="${gy}" stroke="${c}" stroke-opacity=".25"/><circle cx="${gx}" cy="${gy}" r="3.5" fill="${c}"/><text x="${gx}" y="${gy-8}" text-anchor="middle" font-size="10" fill="#a5b5c4">${esc(g.slice(0,16))}</text>`;
    });
    s += `<g data-topic="${esc(t.name)}" style="cursor:pointer"><circle cx="${x}" cy="${y}" r="${24 + Math.min(18, t.count*2)}" fill="#0f2033" stroke="${c}" stroke-width="2"/><text x="${x}" y="${y+4}" text-anchor="middle" font-size="11" font-weight="700" fill="#f3f1ea">${esc(t.name.length > 14 ? t.name.slice(0,13) + "…" : t.name)}</text></g>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Mapa de temas"><circle cx="${cx}" cy="${cy}" r="34" fill="#e5c0681a" stroke="#e5c068" stroke-width="1.5"/><text x="${cx}" y="${cy+5}" text-anchor="middle" font-size="13" font-weight="800" fill="#f3d98f">YO</text>${s}</svg>`;
}

/* ---------- topic board ---------- */
function boardColumns(t){
  const refs = refsOf(t.name), cols = [...(t.columns || [])];
  refs.forEach(r => { const c = (r.columna || "").trim(); if(c && c !== "Sin columna" && !cols.includes(c)) cols.push(c); });
  const loose = refs.some(r => !(r.columna || "").trim() || r.columna === "Sin columna");
  return loose || !cols.length ? ["Sin columna", ...cols] : cols;
}

    <div class="toolbar"><input class="input" id="b-q" value="${esc(boardFilters.q)}" placeholder="⌕ Buscar referencias…">
      <select class="select" id="b-tipo"><option value="all">Todos los tipos</option>${TIPOS.map(x => `<option ${x===boardFilters.tipo?"selected":""}>${esc(x)}</option>`).join("")}</select>
      <select class="select" id="b-sort">${[["recent","Más recientes"],["oldest","Más antiguas"],["az","A-Z"],["importance","Importancia"]].map(([v,l]) => `<option value="${v}" ${v===boardFilters.sort?"selected":""}>Ordenar: ${l}</option>`).join("")}</select>

      <button class="add-card" data-addto="${esc(c)}">＋ Añadir referencia</button></div>`; }).join("")}

  bindRefs(el);
  el.querySelectorAll("[data-addto]").forEach(b => b.addEventListener("click", () => openRefForm({ temas:[t.name], columna: b.dataset.addto === "Sin columna" ? "" : b.dataset.addto })));

  el.querySelector("#new-col").addEventListener("click", addColumn);
  const bf = (id, key, evt = "change") => el.querySelector(id).addEventListener(evt, e => { boardFilters[key] = e.target.value; const pos = e.target.selectionStart; renderTopic(); if(evt === "input"){ const n = document.getElementById(id.slice(1)); n.focus(); n.setSelectionRange(pos, pos); } });

  // Drag a card to another column: saves its new Columna in Notion.

async function moveRef(id, column){
  const r = data.referencias.find(x => x.id === id), target = column === "Sin columna" ? "" : column;
  if(!r || (r.columna === "Sin columna" ? "" : r.columna) === target) return;
  const before = r.columna; r.columna = target || "Sin columna"; renderTopic();
  try{ await run("Moviendo…", () => post("/api/capture", { action:"update-reference", pageId:id, columna:target }), `Movida a “${column}”`); }
  catch(e){ r.columna = before; renderTopic(); }
}
function columnMenu(anchor, col){
  const t = topicOf(activeTopic), cols = boardColumns(t).filter(c => c !== "Sin columna"), i = cols.indexOf(col);
  const moveTo = j => { const next = [...cols]; next.splice(i, 1); next.splice(j, 0, col); t.columns = next; renderTopic(); run("Guardando orden…", () => post("/api/capture", { action:"topic-columns", topic:t.name, op:"order", columns:next }), "Orden guardado").catch(load); };
  showMenu(anchor, [
    { label:"✎ Renombrar columna", run:() => { const n = prompt("Nuevo nombre de la columna:", col); if(n && n.trim() && n.trim() !== col) columnsOp({ op:"rename", column:col, newName:n.trim() }, "Columna renombrada"); } },
    ...(i > 0 ? [{ label:"← Mover a la izquierda", run:() => moveTo(i - 1) }] : []),
    ...(i < cols.length - 1 ? [{ label:"→ Mover a la derecha", run:() => moveTo(i + 1) }] : []),
    { label:"＋ Añadir referencia aquí", run:() => openRefForm({ temas:[t.name], columna:col }) },
    { label:"Eliminar columna", danger:true, run:() => { if(confirm(`¿Eliminar la columna “${col}”? Sus referencias pasan a “Sin columna”; no se borra ninguna.`)) columnsOp({ op:"delete", column:col }, "Columna eliminada"); } },
  ]);
}
function addColumn(){ const n = prompt("Nombre de la nueva columna:"); if(n && n.trim()) columnsOp({ op:"add", column:n.trim() }, "Columna creada"); }

    <form id="ref-form" onsubmit="return false">
    <div class="ref-top"><div class="ref-img" style="${img?`background-image:${cssUrl(img.url)}`:""}">${img ? "" : editing ? "Sube una imagen abajo y aparecerá aquí." : "Podrás subir imágenes y archivos al guardar."}</div>
      <div class="form"><label class="wide">Título<input name="referencia" value="${esc(r.referencia || "")}" required placeholder="Ej. Never Split the Difference"></label>
        <label>Autor / pensador<input name="autor" value="${esc(r.autor || "")}" placeholder="Ej. Chris Voss"></label>
        <label>Tipo<select name="tipo">${TIPOS.map(t => `<option ${t===(r.tipo||"Artículo / Link")?"selected":""}>${esc(t)}</option>`).join("")}</select></label></div></div>
    <div class="form">
      <div class="wide"><span class="flabel">Temas</span><div class="pick" id="ref-temas">${topicNames.map(n => `<label><input type="checkbox" value="${esc(n)}" ${temas.includes(n)?"checked":""}>${esc(n)}</label>`).join("") || '<span class="empty">Crea un tema primero.</span>'}</div></div>
      <label>Columna<input name="columna" list="col-list" value="${esc(r.columna && r.columna !== "Sin columna" ? r.columna : "")}" placeholder="Ej. Agentes de IA"><datalist id="col-list">${cols.map(c => `<option value="${esc(c)}">`).join("")}</datalist></label>
      <label>Estado<select name="estado">${ESTADOS.map(s => `<option ${s===(r.estado||"Por consumir")?"selected":""}>${esc(s)}</option>`).join("")}</select></label>
      <label class="wide">Enlace<div style="display:flex;gap:8px"><input name="enlace" type="url" value="${esc(r.enlace || "")}" placeholder="https://…"><a class="btn" id="open-link" target="_blank" rel="noopener" href="${esc(safeUrl(r.enlace))}" style="text-decoration:none;${safeUrl(r.enlace)?"":"display:none"}">Abrir ↗</a></div></label>
      <div class="wide"><span class="flabel">Tags</span><div class="tags" id="tags"></div></div>
      <div><span class="flabel">Importancia</span><div class="stars" id="stars"></div></div>
      <label>Fecha agregada<input value="${esc(dateEs(r.createdTime || new Date()))}" disabled></label>
      <label class="wide">Notas / por qué me importa<textarea name="porQueMeInteresa" placeholder="Lo que aprendiste, por qué importa, próximos pasos…">${esc(r.porQueMeInteresa || "")}</textarea></label>
    </div></form>
    ${editing ? `<div class="section-label">ARCHIVOS E IMÁGENES</div><div class="files">${files.map((f, i) => `<a class="file" href="${esc(safeUrl(f.url))}" target="_blank" rel="noopener" style="${/\.(png|jpe?g|gif|webp|avif)(\?|$)/i.test((f.name||"") + " " + (f.url||"").split("?")[0]) ? `background-image:${cssUrl(f.url)}` : ""}"><button class="rm" data-rmfile="${i}" title="Quitar archivo">×</button><span>📎 ${esc(f.name)}</span></a>`).join("")}<label class="drop-zone" id="drop"><input type="file" id="ref-files" multiple style="display:none"><span><b>Subir archivos</b><br>Arrastra aquí o haz clic · máx. 3 MB</span></label></div>
      <div class="section-label">COMENTARIOS (${(r.comments||[]).length})</div>
      <div style="display:flex;gap:8px"><input class="input" id="comment" style="flex:1" placeholder="Escribe un comentario…"><button class="btn gold" id="post-comment">Publicar</button></div>
      <div class="comments">${(r.comments||[]).map(c => `<div class="comment"><small>${esc(new Date(c.createdTime).toLocaleString("es-MX", { day:"numeric", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit" }))}</small>${esc(c.text)}</div>`).join("")}</div>` : ""}
    <div class="modal-actions">${editing ? `<button class="btn danger left" id="ref-del">Eliminar referencia</button><a class="btn" style="text-decoration:none" href="${esc(safeUrl(r.notionUrl))}" target="_blank" rel="noopener">Abrir en Notion ↗</a>` : ""}<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn gold" id="ref-save">${editing ? "Guardar cambios" : "Guardar"}</button></div>`);
  renderTags(); renderStars();
  const f = document.getElementById("ref-form");
  f.elements.enlace.addEventListener("input", e => { const a = document.getElementById("open-link"), u = safeUrl(e.target.value); a.href = u; a.style.display = u ? "" : "none"; });
  document.getElementById("ref-save").addEventListener("click", () => saveRef(r));
  if(editing){
    document.getElementById("ref-del").addEventListener("click", () => archiveRef(r.id, "¿Eliminar esta referencia? Se archivará en Notion."));
    document.getElementById("post-comment").addEventListener("click", () => postComment(r.id));
    document.getElementById("comment").addEventListener("keydown", e => { if(e.key === "Enter") postComment(r.id); });
    const drop = document.getElementById("drop"), input = document.getElementById("ref-files");
    input.addEventListener("change", () => uploadFiles(r.id, [...input.files]));
    drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
    drop.addEventListener("dragleave", () => drop.classList.remove("over"));
    drop.addEventListener("drop", e => { e.preventDefault(); drop.classList.remove("over"); uploadFiles(r.id, [...e.dataTransfer.files]); });
    document.querySelectorAll("[data-rmfile]").forEach(b => b.addEventListener("click", async e => { e.preventDefault(); e.stopPropagation(); if(!confirm("¿Quitar este archivo de la referencia?")) return; await run("Quitando archivo…", () => post("/api/capture", { action:"remove-file", pageId:r.id, index:Number(b.dataset.rmfile) }), "Archivo quitado").catch(() => {}); openRef(r.id); load(); }));
  }
  f.elements.referencia.focus();
}
function renderTags(){
  const box = document.getElementById("tags");
  box.innerHTML = refTags.map((t,i) => `<span class="chip purple">${esc(t)}<button data-rmtag="${i}" title="Quitar">×</button></span>`).join("") + `<input id="tag-input" placeholder="＋ Añadir tag y Enter">`;
  box.querySelectorAll("[data-rmtag]").forEach(b => b.addEventListener("click", () => { refTags.splice(Number(b.dataset.rmtag), 1); renderTags(); }));
  const input = document.getElementById("tag-input");
  const add = () => { const v = input.value.replace(/,/g, "").trim(); if(v && !refTags.includes(v)) refTags.push(v); input.value = ""; renderTags(); document.getElementById("tag-input").focus(); };
  input.addEventListener("keydown", e => { if(e.key === "Enter" || e.key === ","){ e.preventDefault(); add(); } else if(e.key === "Backspace" && !input.value && refTags.length){ refTags.pop(); renderTags(); document.getElementById("tag-input").focus(); } });
  input.addEventListener("blur", () => { if(input.value.trim()) add(); });
}
function renderStars(){
  const el = document.getElementById("stars");
  el.innerHTML = [1,2,3,4,5].map(n => `<button type="button" class="${n<=refStars?"on":""}" data-star="${n}" title="${n} de 5">★</button>`).join("") + `<span style="color:var(--muted);margin-left:6px">${refStars} / 5</span>`;
  el.querySelectorAll("[data-star]").forEach(b => b.addEventListener("click", () => { const n = Number(b.dataset.star); refStars = refStars === n ? 0 : n; renderStars(); }));
}
async function saveRef(r){
  const f = document.getElementById("ref-form"), v = Object.fromEntries(new FormData(f).entries());
  const pending = document.getElementById("tag-input")?.value.trim(); if(pending && !refTags.includes(pending)) refTags.push(pending);
  if(!v.referencia?.trim()){ window.jarvisToast?.error(null, "Escribe un título."); return; }
  const temas = [...document.querySelectorAll("#ref-temas input:checked")].map(i => i.value);
  const body = { referencia:v.referencia.trim(), autor:v.autor || "", tipo:v.tipo, temas, columna:(v.columna || "").trim(), estado:v.estado, enlace:(v.enlace || "").trim(), tags:refTags, importancia:refStars || null, porQueMeInteresa:v.porQueMeInteresa || "" };
  const btn = document.getElementById("ref-save"); btn.disabled = true;
  try{
    if(r.id){ await run("Guardando…", () => post("/api/capture", { action:"update-reference", pageId:r.id, ...body }), "Referencia guardada"); closeModal(); }
    else { const d = await run("Guardando…", () => post("/api/capture", { action:"create-reference", ...body }), "Referencia creada — ya puedes adjuntar archivos"); await load(); return openRef(d.pageId); }
    await load();
  }catch(e){ btn.disabled = false; }
}
async function archiveRef(id, question){
  if(!confirm(question)) return;
  try{ await run("Eliminando…", () => post("/api/capture", { action:"delete-reference", pageId:id }), "Eliminada"); closeModal(); await load(); }catch(e){}
}
async function postComment(id){
  const input = document.getElementById("comment"), text = input.value.trim();
  if(!text) return;
  try{ await run("Publicando…", () => post("/api/capture", { action:"comment", pageId:id, text }), "Comentario publicado"); openRef(id); }catch(e){}
}
async function uploadFiles(id, files){
  if(!files.length) return;
  if(files.some(f => f.size > 3*1024*1024)){ window.jarvisToast?.error(null, "Cada archivo debe pesar menos de 3 MB."); return; }
  try{
    for(const file of files){ const data64 = (await readFile(file)).split(",")[1]; await run(`Subiendo ${file.name}…`, () => post("/api/capture", { action:"upload", pageId:id, filename:file.name, contentType:file.type, dataBase64:data64 }), "Archivo subido"); }
  }catch(e){}
  openRef(id); load();
}

/* ---------- quotes & brief ---------- */
function openQuoteForm(){
  openModal(`<div class="modal-head"><div><h2>Nueva cita</h2><div class="sub">Se guarda como referencia de tipo “Cita”.</div></div><button class="x" onclick="closeModal()">×</button></div>
    <form class="form" id="quote-form" onsubmit="return false"><label class="wide">Cita<textarea name="text" required placeholder="Escribe la cita…"></textarea></label>
    <label>Autor<input name="author" placeholder="¿Quién la dijo?"></label><label>Tema<select name="tema"><option value="">Sin tema</option>${data.topics.map(t => `<option>${esc(t.name)}</option>`).join("")}</select></label></form>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn gold" id="q-save">Guardar cita</button></div>`, true);
  document.getElementById("q-save").addEventListener("click", () => { const f = document.getElementById("quote-form"); if(!f.elements.text.value.trim()){ window.jarvisToast?.error(null, "Escribe la cita."); return; } saveQuote(f.elements.text.value.trim(), f.elements.author.value.trim(), f.elements.tema.value); });
  document.querySelector("#quote-form textarea").focus();
}
async function saveQuote(text, author, tema){
  try{ await run("Guardando cita…", () => post("/api/capture", { action:"create-reference", referencia:`“${text}” — ${author || "Anónimo"}`, autor:author || "", tipo:"Cita", temas: tema ? [tema] : [], estado:"Terminado" }), "Cita guardada"); closeModal(); await load(); }catch(e){}
}
// A brief built from the real references of one topic (or all): no AI, just
// what is in Notion, organised.
function openBrief(topic){
  const refs = topic === "all" ? data.referencias : refsOf(topic), week = Date.now() - 7*86400000;
  const fresh = sortRefs(refs.filter(r => new Date(r.createdTime) >= week), "recent");
  const queue = sortRefs(refs.filter(r => r.estado === "Por consumir" || r.estado === "Consumiendo"), "importance").slice(0, 6);
  const best = sortRefs(refs.filter(r => r.importancia >= 4), "importance").slice(0, 6);
  const tags = {}; refs.forEach(r => (r.tags||[]).forEach(t => tags[t] = (tags[t]||0) + 1));
  const topTags = Object.entries(tags).sort((a,b) => b[1]-a[1]).slice(0, 8);
  const notes = refs.filter(r => (r.porQueMeInteresa||"").trim()).slice(0, 4);
  const li = r => `<li><b>${esc(r.referencia)}</b>${r.autor ? " — " + esc(r.autor) : ""}${r.importancia ? " · " + "★".repeat(r.importancia) : ""}</li>`;
  openModal(`<div class="modal-head"><div><h2>Brief · ${esc(topic === "all" ? "Todos los temas" : topic)}</h2><div class="sub">${new Date().toLocaleDateString("es-MX", { weekday:"long", day:"numeric", month:"long", year:"numeric" })} · ${refs.length} referencias</div></div><button class="x" onclick="closeModal()">×</button></div>
    <div class="brief">${!refs.length ? '<div class="empty">Este tema todavía no tiene referencias.</div>' : `
      <h4>Esta semana</h4>${fresh.length ? `<ul>${fresh.slice(0,6).map(li).join("")}</ul>` : "<p>No agregaste referencias en los últimos 7 días.</p>"}
      <h4>Por consumir</h4>${queue.length ? `<ul>${queue.map(li).join("")}</ul>` : "<p>No tienes pendientes.</p>"}
      <h4>Lo mejor valorado</h4>${best.length ? `<ul>${best.map(li).join("")}</ul>` : "<p>Aún no hay referencias con 4 o 5 estrellas.</p>"}
      <h4>Ideas que se repiten</h4><p>${topTags.map(([t,n]) => `<span class="chip purple">${esc(t)} · ${n}</span>`).join(" ") || "Agrega tags a tus referencias para ver patrones."}</p>
      ${notes.length ? `<h4>Tus notas</h4><ul>${notes.map(r => `<li><b>${esc(r.referencia)}:</b> ${esc(r.porQueMeInteresa.slice(0, 220))}${r.porQueMeInteresa.length > 220 ? "…" : ""}</li>`).join("")}</ul>` : ""}`}</div>
    <div class="modal-actions">${topic !== "all" && topicOf(topic) ? `<button class="btn" onclick="closeModal();openTopic(${esc(JSON.stringify(topic))})">Abrir tema</button>` : ""}<button class="btn" onclick="window.print()">Imprimir</button><button class="btn gold" onclick="closeModal()">Cerrar</button></div>`);
}

/* ---------- data ---------- */
async function load(){
  const status = document.getElementById("status");
  try{
    const r = await fetch("/api/gustos-data?fresh=" + Date.now(), { cache:"no-store" });
    const d = await r.json();
    if(!r.ok || d.error) throw new Error(d.error || ("Error " + r.status));
    data = { ...d, referencias:d.referencias || [], topics:d.topics || [] };
    status.textContent = `${data.referencias.length} referencias y ${data.topics.length} temas sincronizados desde Notion`;
    document.getElementById("sync-text").textContent = "Sincronizado con Notion · " + new Date().toLocaleTimeString("es-MX", { hour:"2-digit", minute:"2-digit" });
    if(activeTopic && !topicOf(activeTopic)){ activeTopic = null; tab = "temas"; }
    render();
  }catch(err){ status.textContent = "No se pudo cargar desde Notion: " + err.message; render(); }
}
readHash(); render(); load();
</script>
<script src="/sidebar.js"></script>
